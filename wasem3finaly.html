<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>وسم — تعلّم HTML و CSS</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#080b16;--card:#111830;--ink:#eef0f8;--mut:#9aa5c4;--pri:#d4af37;--pri2:#f6e3a1;--vio:#7c6cf0;--ok:#34d399;--bad:#fb7185;--line:#222b4a;--code:#060914;--gold:linear-gradient(135deg,#b8901f,#f6e3a1 55%,#d4af37)}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font:17px/1.9 Tajawal,system-ui,sans-serif;background:radial-gradient(900px 500px at 85% -5%,#2a237a55,transparent 70%),radial-gradient(700px 400px at 5% 10%,#d4af3718,transparent 70%),var(--bg);background-attachment:fixed}
a{color:var(--pri);text-decoration:none}
code,pre,textarea{font-family:"JetBrains Mono",ui-monospace,monospace;direction:ltr;text-align:left}
header{position:sticky;top:0;z-index:9;background:#080b16cc;backdrop-filter:blur(14px);border-bottom:1px solid #d4af3730}
.bar{max-width:1050px;margin:auto;padding:10px 20px;display:flex;align-items:center;gap:20px}
.brand{font-weight:800;font-size:26px;background:var(--gold);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:1px}
nav{display:flex;gap:4px;flex:1}nav a{color:var(--mut);padding:4px 16px;border-radius:99px;font-weight:500;transition:.2s}nav a:hover{color:var(--ink)}nav a.on{background:#d4af371f;color:var(--pri2);box-shadow:inset 0 0 0 1px #d4af3755}
.xp{background:#d4af371a;color:var(--pri2);padding:2px 14px;border-radius:99px;font-weight:700;font-size:15px;box-shadow:inset 0 0 0 1px #d4af3755}
main{max-width:1050px;margin:auto;padding:28px 20px 80px}
.hero{position:relative;overflow:hidden;background:radial-gradient(600px 300px at 15% 0%,#d4af3733,transparent 60%),linear-gradient(135deg,#1c1760,#101a45 60%,#0b1130);color:#fff;border:1px solid #d4af3755;border-radius:28px;padding:44px 40px;display:flex;gap:28px;align-items:center;flex-wrap:wrap;box-shadow:0 20px 60px #0008,inset 0 1px 0 #ffffff22}
.hero h1{margin:0;font-size:42px;line-height:1.4;background:linear-gradient(180deg,#fff,#f6e3a1);-webkit-background-clip:text;background-clip:text;color:transparent}.hero p{color:#cfd6ee;margin:8px 0 22px}.hero>div:first-child{flex:1;min-width:260px}
.btn{background:var(--gold);color:#1d1600;border:0;padding:9px 26px;border-radius:12px;font:800 16px Tajawal;cursor:pointer;box-shadow:0 6px 18px #d4af3730;transition:.2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 26px #d4af3755}
.btn.w{background:var(--gold);color:#1d1600}.btn.g{background:#ffffff0d;color:var(--ink);border:1px solid var(--line);box-shadow:none}.btn.g:hover{border-color:var(--pri)}
.ring{width:140px;height:140px;border-radius:50%;display:grid;place-items:center;font:800 28px Tajawal;background:conic-gradient(var(--pri) calc(var(--p)*1%),#ffffff1a 0);box-shadow:0 0 40px #d4af3733}
.ring span{width:108px;height:108px;border-radius:50%;background:#0d1230;color:var(--pri2);display:grid;place-items:center}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin:22px 0}
.stat,.card{background:linear-gradient(160deg,#151d3a,#0f1530);border:1px solid var(--line);border-radius:18px;padding:16px 20px;box-shadow:0 8px 24px #0006}
.stat b{display:block;font-size:30px;background:var(--gold);-webkit-background-clip:text;background-clip:text;color:transparent}.stat small,small{color:var(--mut)}
h1,h2,h3{color:var(--ink)}
h2{margin:34px 0 14px;font-size:24px;display:flex;align-items:center;gap:10px}h2::before{content:"";width:6px;height:24px;border-radius:4px;background:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.lc{display:block;color:inherit;transition:.25s}.lc:hover{transform:translateY(-4px);border-color:#d4af3788;box-shadow:0 14px 34px #d4af3724}
.tag{font-size:12px;padding:1px 12px;border-radius:99px;background:#d4af3722;color:var(--pri2);font-weight:700;box-shadow:inset 0 0 0 1px #d4af3755}.tag.css{background:#7c6cf026;color:#c4bbff;box-shadow:inset 0 0 0 1px #7c6cf088}
.pb{height:8px;background:#1b2443;border-radius:9px;overflow:hidden;margin-top:10px}.pb i{display:block;height:100%;background:var(--gold);border-radius:9px;transition:.4s}
.seg,.etabs{display:inline-flex;direction:ltr;gap:4px;padding:4px;background:#0b1126;border:1px solid var(--line);border-radius:99px;margin:4px 0 18px}
.seg button,.etabs button{border:0;background:transparent;color:var(--mut);padding:6px 30px;border-radius:99px;font:800 15px "JetBrains Mono",monospace;cursor:pointer;transition:.2s}
.seg button:hover,.etabs button:hover{color:var(--ink)}
.seg button.on,.etabs button.on{background:var(--gold);color:#1d1600;box-shadow:0 4px 14px #d4af3744}
.etabs{margin:0 0 8px}.etabs button{padding:4px 22px;font-size:13px}
.tabs{display:flex;gap:6px;margin:18px 0;flex-wrap:wrap}.tabs button{border:1px solid var(--line);background:#ffffff08;color:var(--mut);border-radius:99px;padding:4px 18px;font:500 15px Tajawal;cursor:pointer;transition:.2s}
.tabs button:hover{color:var(--ink);border-color:#d4af3766}
.tabs button.on{background:var(--gold);color:#1d1600;border-color:transparent;font-weight:800}
pre{background:var(--code);color:#e2e8f0;padding:14px;border-radius:12px;overflow:auto;line-height:1.6;font-size:14px;border:1px solid var(--line)}
code{background:#d4af3718;color:var(--pri2);padding:1px 6px;border-radius:6px;font-size:.88em}pre code{background:none;padding:0;color:inherit}
mark{background:#d4af3730;color:var(--pri2);padding:0 4px;border-radius:4px}
.note{background:#7c6cf018;border-inline-start:4px solid var(--vio);padding:8px 14px;border-radius:8px}
.hid{display:none}table{border-collapse:collapse;width:100%;font-size:15px}td,th{border:1px solid var(--line);padding:6px 10px;text-align:start}th{background:#1a2347;color:var(--pri2)}
.opt{display:block;width:100%;text-align:start;margin:6px 0;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:#0b1126;color:var(--ink);font:inherit;cursor:pointer;transition:.2s}
.opt:hover{border-color:var(--pri)}.opt.ok{background:#34d3991f;border-color:var(--ok)}.opt.no{background:#fb71851f;border-color:var(--bad)}
.ed{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:700px){.ed{grid-template-columns:1fr}.hero h1{font-size:30px}.hero{padding:28px 22px}}
textarea{width:100%;height:190px;background:var(--code);color:#e2e8f0;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:14px;resize:vertical;outline:0}textarea:focus{border-color:var(--pri)}
iframe{width:100%;height:190px;border:1px solid var(--line);border-radius:12px;background:#fff}
.chk{padding:0;margin:10px 0}.chk li{list-style:none;padding:2px 0}.chk .p::before{content:"✓ ";color:var(--ok);font-weight:700}.chk .f::before{content:"✗ ";color:var(--bad);font-weight:700}
.win{color:var(--ok);font-weight:800}
.row{display:flex;align-items:center;gap:14px;padding:10px 0;border-bottom:1px solid var(--line)}.row .pb{flex:1;margin:0}.row span{min-width:150px}
.guide{background:linear-gradient(160deg,#1a2347,#101733);border:1px solid #d4af3755;border-radius:16px;padding:12px 18px;margin:14px 0;box-shadow:0 8px 24px #0005}
.guide .gh{font-weight:800;color:var(--pri2);margin-bottom:2px}
.gl{margin:6px 0;padding-inline-start:24px}.gl li{padding:2px 0}
.mini{color:var(--mut);font-size:14px;margin:8px 0 2px}
.card.ex{margin:18px 0}.exh{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:18px}
.badge{background:var(--gold);color:#1d1600;border-radius:99px;padding:0 14px;font-weight:800;font-size:13px}
.qbox,.abox,.cbox,.rbox{border-radius:14px;padding:10px 14px;margin:10px 0}
.qbox{background:#7c6cf018;border:1px solid #7c6cf055}.qbox p,.abox p{margin:4px 0}
.abox{background:#34d3991a;border:2px solid var(--ok);box-shadow:0 0 0 4px #34d39914}
.why{color:var(--mut);font-size:15px}
.lbl2{font-weight:800;font-size:14px;color:var(--pri2)}.abox .lbl2{color:var(--ok)}
.cbox{background:var(--code);border:1px solid var(--line)}.cbox textarea{border-color:#222b4a;height:150px}
.rbox{background:#0b1126;border:1px solid var(--line)}.rbox iframe{height:170px}
.lbl{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--mut);margin-bottom:6px;font-weight:700}
.acts{display:flex;gap:6px}
.btn.sm{padding:1px 12px;font-size:13px;border-radius:8px;font-weight:700}
.steps{background:#d4af370f;border:1px dashed #d4af3766;border-radius:12px;padding:8px 14px;margin:10px 0}.steps ol{margin:4px 0;padding-inline-start:24px}
.obj{margin:14px 0;border-color:#d4af3755}.obj ul,.sumc ul{margin:6px 0}
.lang{cursor:pointer;white-space:nowrap}
footer.dev{text-align:center;padding:26px 20px 36px;border-top:1px solid #d4af3730;direction:ltr}
footer.dev span{font:800 20px "JetBrains Mono",monospace;letter-spacing:1px;background:var(--gold);-webkit-background-clip:text;background-clip:text;color:transparent}
@media(max-width:700px){.bar{flex-wrap:wrap;gap:8px}nav{order:3;flex-basis:100%;overflow:auto}}
</style>
</head>

<script>
const DATA={"lessons":[{"id":"html-01","track":"html","chapter":"HTML · الأساسيات","order":1,"title":"كيف يعمل الويب و HTML","subtitle":"تفهم رحلة الصفحة من السيرفر إلى شاشتك، ثم تكتب أول ملف index.html بيدك.","minutes":12,"level":"مبتدئ","objectives":["تشرح الفرق بين لغة التوصيف ولغة البرمجة","تتابع رحلة طلب الصفحة من السيرفر حتى الرسم على الشاشة","تميّز الوسم عن السمة عن العنصر","تكتب ملف index.html صالحًا وتحفظه بترميز UTF-8","تستخدم التعليقات والوسوم ذاتية الإغلاق بثقة"],"theory":[{"type":"h","text":"ما هو HTML؟"},{"type":"p","text":"`HTML` اختصار **HyperText Markup Language** أي «لغة توصيف النص التشعبي». الكلمة المفتاحية هنا هي **توصيف**: أنت لا تعطي المتصفح أوامر منطقية مثل «احسب» أو «كرّر»، بل تُلبس النص ملصقات تقول ما هو: هذا عنوان، هذه فقرة، هذا رابط."},{"type":"p","text":"لهذا لا تُعدّ HTML لغة برمجة: لا متغيرات ولا شروط ولا حلقات. هي **هيكل** فحسب؛ الشكل (الألوان والخطوط والمسافات) تتكفّل به CSS، والسلوك (النقر والتحديث) تتكفّل به JavaScript. الصفحة الجيدة تبقى مفهومة حتى لو تعطّلت الأنماط تمامًا."},{"type":"list","items":["**HTML**: البنية والمعنى — عنوان، فقرة، قائمة، صورة.","**CSS**: المظهر — الألوان، الخطوط، المسافات، التخطيط.","**JavaScript**: السلوك — النقر، الحساب، تحديث المحتوى بلا إعادة تحميل."],"ordered":false},{"type":"quote","text":"اكتب HTML كأن CSS لن تُحمَّل أبدًا: إن بقي المحتوى مفهومًا بلا تنسيق، فالهيكل سليم."},{"type":"h","text":"رحلة الصفحة من السيرفر إلى شاشتك"},{"type":"p","text":"حين تكتب عنوانًا مثل `https://matjar.example/products` في المتصفح، يحدث ما يشبه طلب كتاب من مكتبة بعيدة، على خمس خطوات:"},{"type":"list","items":["يترجم **DNS** اسم النطاق `matjar.example` إلى عنوان IP لخادم بعيد.","يرسل المتصفح طلب **HTTP GET** إلى ذلك الخادم.","يردّ السيرفر بملف نصي عادي هو صفحة HTML، مع رمز حالة مثل `200` أو `404`.","يقرأ المتصفح النص من أعلى إلى أسفل ويبني منه شجرة عناصر.","يحسب التنسيق ويرسم البكسلات على الشاشة."],"ordered":true},{"type":"p","text":"لاحظ أن السيرفر لا يرسل «صورة الصفحة»؛ يرسل **نصًا** فقط. المتصفح هو من يفسّره ويرسمه. لذلك يختلف العرض قليلًا بين المتصفحات، ولذلك أيضًا تستطيع فتح الملف نفسه من قرصك دون إنترنت."},{"type":"note","tone":"info","title":"ملف محلي أم سيرفر؟","text":"إن فتحت `index.html` بنقرة مزدوجة فالعنوان يبدأ بـ `file://` ويقرأ المتصفح الملف من جهازك. وإن جاءت الصفحة من سيرفر فالعنوان يبدأ بـ `https://` أو `http://`."},{"type":"h","text":"ما هو DOM ببساطة؟"},{"type":"p","text":"المتصفح لا يعمل على النص كما هو، بل يحوّله إلى **شجرة كائنات** اسمها DOM اختصار **Document Object Model**. كل وسم يصبح عقدة، والوسوم المتداخلة تصبح فروعًا داخل فروع."},{"type":"code","lang":"html","code":"\u003cbody>\n  \u003ch1>متجر التمور\u003c/h1>\n  \u003cp>أفضل \u003cstrong>التمور\u003c/strong> في المدينة.\u003c/p>\n\u003c/body>","caption":"نص HTML قبل التحليل"},{"type":"p","text":"الشجرة الناتجة: `body` في الجذر، وتحته طفلان `h1` و`p`، وداخل `p` عقدة نصية ثم `strong` ثم عقدة نصية. هذه الشجرة هي ما تعمل عليها CSS، وهي ما تستعمله JavaScript للوصول إلى العناصر وتغييرها. وحين نقول «عنصر» في بقية الدروس فنحن نعني عقدة في هذه الشجرة."},{"type":"h","text":"الوسم والسمة والعنصر"},{"type":"p","text":"**الوسم (Tag)** هو العلامة المكتوبة بين قوسين زاويّين. و**السمة (Attribute)** معلومة إضافية تُكتب داخل الوسم الافتتاحي فقط. و**العنصر (Element)** هو المجموع: الوسم الافتتاحي + المحتوى + وسم الإغلاق."},{"type":"code","lang":"html","code":"\u003cp class=\"lead\" id=\"intro\">نصّ الفقرة هنا.\u003c/p>","caption":"وسم + سمات + محتوى = عنصر واحد"},{"type":"table","head":["الجزء","في المثال","وظيفته"],"rows":[["الوسم الافتتاحي","\u003cp class=\"lead\" id=\"intro\">","يبدأ العنصر ويحمل سماته"],["السمة","class=\"lead\"","تصنيف يستخدمه CSS وJavaScript"],["المحتوى","نصّ الفقرة هنا.","ما يراه الزائر"],["وسم الإغلاق","\u003c/p>","ينهي العنصر"]]},{"type":"note","tone":"tip","title":"ترتيب السمات لا يهم","text":"`\u003ca href=\"x\" target=\"_blank\">` و`\u003ca target=\"_blank\" href=\"x\">` متساويان تمامًا. المهم ألّا تتكرر السمة نفسها مرتين في العنصر نفسه."},{"type":"h","text":"وسوم مغلقة ووسوم ذاتية الإغلاق"},{"type":"p","text":"معظم الوسوم تحتاج إغلاقًا صريحًا مثل `\u003c/p>`، لأنها تحتوي محتوى. لكن هناك وسوم **فارغة** لا محتوى لها فتُغلق نفسها: `\u003cbr>` و`\u003chr>` و`\u003cimg>` و`\u003cinput>` و`\u003cmeta>` و`\u003clink>`. في HTML5 تُكتب هكذا `\u003cbr>`، ويقبل المتصفح `\u003cbr />` أيضًا."},{"type":"code","lang":"html","code":"\u003cp>السطر الأول\u003cbr>السطر الثاني\u003c/p>\n\u003chr>\n\u003cimg src=\"dates.jpg\" alt=\"صندوق تمر على طاولة\">","caption":"ثلاثة وسوم فارغة بلا وسم إغلاق"},{"type":"note","tone":"warn","title":"خطأ شائع","text":"كتابة `\u003c/br>` أو `\u003c/img>` خطأ لا معنى له، فالوسوم الفارغة لا تُغلق. المتصفح يتجاهل الخطأ غالبًا ويستمر، لكن الكود يبقى غير صحيح ويُربك من يقرأه بعدك."},{"type":"h","text":"التعليقات: ملاحظات لا يراها الزائر"},{"type":"p","text":"التعليق يبدأ بـ `\u003c!--` وينتهي بـ `-->`، لا يُرسم على الشاشة، لكنه يبقى في شجرة DOM عقدةً من نوع تعليق تستطيع JavaScript رؤيتها. استخدمه لتذكير نفسك بمهمة متبقية، أو لتوضيح سبب قرار غريب في الكود، أو لتعطيل جزء مؤقتًا أثناء التجربة."},{"type":"code","lang":"html","code":"\u003c!-- قائمة المنتجات تُبنى في الدرس القادم -->\n\u003ch1>عروض الأسبوع\u003c/h1>\n\u003cp>خصم 20% على العجوة.\u003c/p>","caption":"تعليق فوق العنوان"},{"type":"note","tone":"warn","title":"لا تضع أسرارًا في التعليقات","text":"التعليقات تُرسل إلى المتصفح كاملة، وأي زائر يستطيع قراءتها من «عرض مصدر الصفحة». لا تكتب فيها كلمات مرور ولا مسارات داخلية ولا أسماء عملاء."},{"type":"h","text":"أول ملف لك: index.html"},{"type":"p","text":"افتح محررًا نصيًا مثل VS Code، أنشئ ملفًا باسم `index.html`، اكتب فيه الكود التالي، ثم احفظه بترميز **UTF-8** وافتحه في المتصفح."},{"type":"code","lang":"html","code":"\u003c!DOCTYPE html>\n\u003chtml lang=\"ar\" dir=\"rtl\">\n\u003chead>\n  \u003cmeta charset=\"UTF-8\">\n  \u003ctitle>أول صفحة لي\u003c/title>\n\u003c/head>\n\u003cbody>\n  \u003ch1>مرحبًا بالعالم\u003c/h1>\n  \u003cp>هذه أول فقرة أكتبها بيدي.\u003c/p>\n\u003c/body>\n\u003c/html>","caption":"index.html — الصفحة الأولى كاملة"},{"type":"p","text":"إن ظهرت الحروف العربية على شكل رموز غريبة مثل `Ø£` فالسبب أن الملف حُفظ بترميز آخر غير UTF-8؛ أعد الحفظ بالترميز الصحيح. وإن ظهرت الصفحة بيضاء فتحقّق من امتداد الملف أنه `.html` لا `.txt`."},{"type":"list","items":["اسم `index` تقليدي: السيرفر يقدّمه تلقائيًا عند طلب المجلد.","امتداد `.html` يجعل المتصفح يقرأ الملف كصفحة ويب.","أي تعديل في الملف يحتاج تحديثًا للصفحة (F5) لتراه."],"ordered":false},{"type":"h","text":"حالة الأحرف والمسافات"},{"type":"p","text":"أسماء الوسوم والسمات **غير حساسة لحالة الأحرف**: `\u003cH1>` و`\u003ch1>` متساويتان تمامًا، لكن الاصطلاح السائد كتابة الأسماء بحروف صغيرة، وهو ما ستراه في كل مثال. أما **قيم السمات** فقد تكون حساسة: المسار `Images/Logo.png` ليس هو `images/logo.png` على سيرفرات Linux."},{"type":"p","text":"والمتصفح يدمج المسافات المتعددة والأسطر الجديدة في **مسافة واحدة**. اكتب ما شئت من المسافات والأسطر لترتيب كودك، فلن يظهر أثرها في الصفحة. وإن أردت مسافات محفوظة فعلًا فهناك وسم `pre` يأتي في درس لاحق."},{"type":"terms","items":[{"term":"HTML","desc":"لغة توصيف تصف بنية المحتوى ومعناه، وليست لغة برمجة."},{"term":"الوسم Tag","desc":"علامة بين قوسين زاويّين تحدد نوع العنصر مثل `\u003cp>`."},{"term":"السمة Attribute","desc":"معلومة إضافية داخل الوسم الافتتاحي مثل `href` أو `class`."},{"term":"العنصر Element","desc":"الوسم الافتتاحي ومحتواه ووسم إغلاقه معًا."},{"term":"DOM","desc":"شجرة العناصر التي يبنيها المتصفح من نص HTML وتعمل عليها CSS وJavaScript."},{"term":"UTF-8","desc":"ترميز نصي يمثّل حروف العالم ومنها العربية، ويجب حفظ ملفات HTML به."}]}],"examples":[{"title":"أول صفحة لمتجر","prompt":"ماذا سيعرض المتصفح من هذا الكود؟","answer":"عنوان كبير عريض «متجر التمور» في سطر، ثم فقرة عادية تحته.","explain":"المتصفح يطبّق تنسيقًا افتراضيًا على `h1` فيعرضه أكبر وأثقل، أما `p` فبخط النص العادي مع مسافة أعلى وأسفل.","html":"\u003ch1>متجر التمور\u003c/h1>\n\u003cp>تمور فاخرة تُعبّأ في اليوم نفسه.\u003c/p>","css":"","en":{"title":"A store's first page","prompt":"What will the browser show for this code?","answer":"A big bold heading «متجر التمور» on one line, then a normal paragraph below it.","explain":"The browser applies default styles: `h1` is bigger and heavier, while `p` uses normal text with space above and below."}},{"title":"السمة تغيّر الوجهة","prompt":"إلى أين يؤدي النقر على كلمة «موقعنا»؟ وما الذي تضيفه السمة `title`؟","answer":"ينقل إلى https://example.com، وعند وقوف المؤشر على الكلمة تظهر فقاعة صغيرة نصّها «افتح الموقع».","explain":"`href` تحدد عنوان الوجهة، و`title` نص تلميحي يظهر عند المرور بالمؤشر. لاحظ أن `title` لا يُغني عن نص رابط واضح، لأنه لا يظهر على شاشات اللمس.","html":"\u003cp>زر \u003ca href=\"https://example.com\" title=\"افتح الموقع\">موقعنا\u003c/a> لمزيد من التفاصيل.\u003c/p>","css":"","en":{"title":"An attribute changes the destination","prompt":"Where does clicking the word «موقعنا» lead? And what does the `title` attribute add?","answer":"It goes to https://example.com, and when the pointer rests on the word a small tooltip appears saying «افتح الموقع».","explain":"`href` sets the destination, `title` is a hint shown on hover. Note that `title` is no substitute for clear link text, because touch screens never show it."}},{"title":"تعليق لا يُعرض","prompt":"كم سطرًا سيظهر على الشاشة؟","answer":"سطر واحد فقط: «تحديث الأسعار قريبًا». التعليق لا يظهر إطلاقًا.","explain":"كل ما بين `\u003c!--` و`-->` يُهمله المتصفح عند الرسم، ويبقى في الملف المصدري وفي شجرة DOM عقدةً لا تُعرض. لهذا يصلح التعليق لتذكير الفريق، لا لإخفاء معلومات.","html":"\u003c!-- TODO: أضف جدول الأسعار قبل الإطلاق -->\n\u003ch1>تحديث الأسعار قريبًا\u003c/h1>","css":"","en":{"title":"A comment that is not displayed","prompt":"How many lines will appear on screen?","answer":"Only one line: «تحديث الأسعار قريبًا». The comment is never shown.","explain":"Everything between `\u003c!--` and `-->` is ignored when painting. It stays in the source file and in the DOM as a node that is not rendered, so use comments for team notes, never to hide information."}}],"quiz":[{"q":"أي وصف يصف HTML بدقة؟","options":["لغة برمجة كاملة فيها شروط وحلقات","لغة توصيف تحدد بنية المحتوى ومعناه","لغة تنسيق للألوان والخطوط","قاعدة بيانات تُخزّن منتجات المتجر"],"answer":1,"explain":"HTML توصيف: تُلبس الملصقات النص لتحديد نوعه. الألوان والخطوط مهمة CSS، والسلوك مهمة JavaScript."},{"q":"ما الذي يرسله السيرفر إلى المتصفح عند طلب صفحة HTML؟","options":["صورة جاهزة للصفحة","ملفًا نصيًا يفسّره المتصفح ويبنيه","ملف CSS فقط","أوامر JavaScript ترسم الصفحة"],"answer":1,"explain":"السيرفر يرسل نص HTML، والمتصفح يحوّله إلى شجرة DOM ثم يحسب التنسيق ويرسمه."},{"q":"أي مجموعة كلها وسوم ذاتية الإغلاق؟","options":["\u003cp> و\u003ch1> و\u003cdiv>","\u003cbr> و\u003cimg> و\u003cmeta>","\u003ca> و\u003csection> و\u003cspan>","\u003cul> و\u003cli> و\u003cpre>"],"answer":1,"explain":"`br` و`img` و`meta` وسوم فارغة لا تحتوي محتوى، فتُكتب وحدها بلا وسم إغلاق."},{"q":"كتبت كلمة «التمور» في الملف فظهرت في المتصفح «Ø§Ù„ØªÙ…ÙˆØ±». ما السبب الأرجح؟","options":["نسيان وسم الإغلاق","حفظ الملف بترميز غير UTF-8","استخدام حروف كبيرة في أسماء الوسوم","المسافات الزائدة قبل النص"],"answer":1,"explain":"هذا نمط كلاسيكي لقراءة نص UTF-8 بترميز آخر؛ أعد حفظ الملف بترميز UTF-8 وأضف `\u003cmeta charset=\"UTF-8\">`."}],"tasks":[{"id":"html-01-t1","title":"بطاقة تعريف بمطعم","brief":"أنشئ بطاقة بسيطة لمطعم: عنوان `h1` واحد فيه اسم المطعم، وفقرة `p` تصف المطبخ، وفقرة ثانية بساعات العمل. وأضف في أعلى الملف تعليقًا HTML يذكر كلمة «مطعم» ليعرف زميلك سبب وجود الصفحة.","steps":["اكتب تعليقًا يبدأ بـ \u003c!-- وينتهي بـ -->","أضف \u003ch1> باسم المطعم ثم أغلق الوسم","أضف فقرتين \u003cp> إحداهما لساعات العمل"],"files":{"html":"\u003c!-- ابدأ هنا -->\n","css":""},"checks":[{"kind":"selector","label":"عنوان h1 واحد فقط","sel":"h1","min":1,"max":1},{"kind":"text","label":"اسم المطعم في العنوان","sel":"h1","regex":"مطعم"},{"kind":"selector","label":"فقرتان على الأقل","sel":"p","min":2},{"kind":"source","label":"تعليق يذكر كلمة مطعم","regex":"\u003c!--[\\s\\S]*?مطعم[\\s\\S]*?-->"}],"hint":"التعليق يبدأ بـ \u003c!-- وينتهي بـ -->، وكل عنصر يُفتح ثم يُغلق.","solution":{"html":"\u003c!-- صفحة مطعم البيت الشامي -->\n\u003ch1>مطعم البيت الشامي\u003c/h1>\n\u003cp>نقدّم المأكولات الشامية الطازجة كل يوم.\u003c/p>\n\u003cp>ساعات العمل: من الظهر حتى منتصف الليل.\u003c/p>","css":""},"en":{"title":"A restaurant intro card","brief":"Create a simple restaurant card: one `h1` with the restaurant name, a `p` describing the cuisine, and a second paragraph with opening hours. Add an HTML comment at the top of the file that contains the word «مطعم» so your teammate knows why the page exists.","steps":["Write a comment that starts with \u003c!-- and ends with -->","Add an \u003ch1> with the restaurant name, then close it","Add two \u003cp> paragraphs, one of them for opening hours"],"hint":"A comment starts with \u003c!-- and ends with -->, and every element is opened and then closed."}},{"id":"html-01-t2","title":"رابط بسمتين","brief":"أضف فقرة فيها رابط `\u003ca>` نصه «زيارة المتجر» ويؤدي إلى `https://example.com`، وأضف للرابط سمة `title` قيمتها «افتح المتجر».","steps":["ابدأ بفقرة \u003cp> لتضع الرابط داخل نص","اكتب \u003ca href=\"https://example.com\">","أضف title=\"افتح المتجر\" داخل الوسم الافتتاحي"],"files":{"html":"\u003cp>تعريف بالمتجر هنا.\u003c/p>\n","css":""},"checks":[{"kind":"selector","label":"رابط a واحد","sel":"a","min":1,"max":1},{"kind":"attr","label":"وجهة الرابط example.com","sel":"a","attr":"href","regex":"^https://example\\.com/?$"},{"kind":"attr","label":"الرابط يحمل سمة title","sel":"a","attr":"title","regex":"المتجر"},{"kind":"text","label":"نص الرابط «زيارة المتجر»","sel":"a","regex":"زيارة المتجر"}],"hint":"السمات تُكتب داخل الوسم الافتتاحي فقط، بهذه الصيغة: name=\"value\".","solution":{"html":"\u003cp>للعروض الجديدة \u003ca href=\"https://example.com\" title=\"افتح المتجر\">زيارة المتجر\u003c/a> قبل نفاد الكمية.\u003c/p>","css":""},"en":{"title":"A link with two attributes","brief":"Add a paragraph that contains an `\u003ca>` link with the text «زيارة المتجر» pointing to `https://example.com`, and give the link a `title` attribute with the value «افتح المتجر».","steps":["Start with a \u003cp> so the link sits inside text","Write \u003ca href=\"https://example.com\">","Add title=\"افتح المتجر\" inside the opening tag"],"hint":"Attributes go in the opening tag only, in the form name=\"value\"."}}],"summary":["HTML لغة توصيف تحدد البنية، لا لغة برمجة","السيرفر يرسل نصًا، والمتصفح يبني منه DOM ويرسمه","العنصر = وسم افتتاحي + محتوى + وسم إغلاق","الوسوم الفارغة تُكتب وحدها بلا إغلاق","احفظ الملفات بترميز UTF-8 وسمِّ الصفحة الأولى index.html"],"en":{"chapter":"HTML · Basics","title":"How the Web and HTML Work","subtitle":"Follow a page's journey from the server to your screen, then write your first index.html by hand.","level":"Beginner","objectives":["Explain the difference between a markup language and a programming language","Follow a page request from the server to the pixels on screen","Tell a tag, an attribute and an element apart","Write a valid index.html and save it as UTF-8","Use comments and self-closing tags with confidence"],"summary":["HTML is a markup language that defines structure — it is not a programming language","The server sends text; the browser builds the DOM from it and paints it","Element = opening tag + content + closing tag","Empty tags stand alone with no closing tag","Save files as UTF-8 and name the first page index.html"]}},{"id":"html-02","track":"html","chapter":"HTML · الأساسيات","order":2,"title":"هيكل المستند والبيانات الوصفية","subtitle":"تبني مستند HTML5 كاملًا من DOCTYPE إلى ترتيب وسوم head التي تقرأها المتصفحات ومحركات البحث.","minutes":16,"level":"مبتدئ","objectives":["تكتب هيكل مستند HTML5 كاملًا من الذاكرة","تضبط لغة الصفحة واتجاهها لعربية سليمة","تستخدم meta للترميز والوصف والاستجابة","تربط CSS وJavaScript بالسمات defer وasync وmodule","ترتب عناصر head بترتيب منطقي يحسّن سرعة الرسم"],"theory":[{"type":"h","text":"المستند كاملًا: أربع طبقات"},{"type":"p","text":"الصفحة التي كتبتها في الدرس السابق عملت لأن المتصفح متسامح ويُكمّل ما ينقص. لكن الصفحة الحقيقية تُعلن هيكلها بنفسها: تصريح النوع، ثم `html` جذرًا، ثم `head` للبيانات، ثم `body` للمحتوى المرئي."},{"type":"code","lang":"html","code":"\u003c!DOCTYPE html>\n\u003chtml lang=\"ar\" dir=\"rtl\">\n\u003chead>\n  \u003cmeta charset=\"UTF-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003ctitle>متجر التمور | الرئيسية\u003c/title>\n\u003c/head>\n\u003cbody>\n  \u003ch1>أهلًا بك في متجر التمور\u003c/h1>\n  \u003cp>تمور تُعبّأ في يوم الحصاد.\u003c/p>\n\u003c/body>\n\u003c/html>","caption":"الهيكل الأدنى لمستند HTML5"},{"type":"h","text":"\u003c!DOCTYPE html> سطر لا وسم"},{"type":"p","text":"`\u003c!DOCTYPE html>` تصريح يخبر المتصفح أن المستند مكتوب بمعيار HTML5، فيدخل في **وضع المعايير** (standards mode). إن نسيته دخل المتصفح في «الوضع الغريب» (quirks mode) واختلفت حسابات الصندوق والخطوط، فتبدو صفحتك مختلفة عمّا صمّمته. اكتبه في أول سطر، ولا تغلقه، ولا تكتبه بعد `\u003chtml>`."},{"type":"note","tone":"warn","title":"أشهر خطأ في الهيكل","text":"كتابة `\u003c!DOCTYPE html>` في منتصف الملف أو نسيانها تمامًا. المتصفح يعرض الصفحة رغم ذلك، لكن التنسيق يصبح غير متوقع — وهذا النوع من الأخطاء يُتعب في التصحيح."},{"type":"h","text":"عنصر html: اللغة والاتجاه"},{"type":"p","text":"العنصر `html` هو جذر الشجرة، وله سمتان لا تنساهما في أي صفحة عربية: `lang=\"ar\"` تُخبر قارئات الشاشة ومحركات البحث والترجمة الآلية بأن المحتوى عربي، و`dir=\"rtl\"` تجعل الاتجاه من اليمين إلى اليسار فينعكس ترتيب الأعمدة ومحاذاة النص افتراضيًا."},{"type":"code","lang":"html","code":"\u003chtml lang=\"ar\" dir=\"rtl\">","caption":"جذر المستند بالعربية"},{"type":"note","tone":"tip","title":"لماذا dir مهم؟","text":"بلا `dir=\"rtl\"` تبقى الفواصل وعلامات الترقيم في الطرف الخطأ من السطر، ويظهر النص المختلط بالعربية والإنجليزية مرتبكًا. الاتجاه الصحيح يوفّر عليك تنسيقًا يدويًا كثيرًا."},{"type":"h","text":"الرأس والجسد: head و body"},{"type":"p","text":"`head` حاوية **بيانات وصفية**: لا يُرسم منها شيء على مساحة الصفحة (إلا نص `title` في تبويب المتصفح). و`body` هو كل ما يراه الزائر. القاعدة العملية: كل ما لا يُرى يذهب إلى `head`، وكل ما يُرى يذهب إلى `body`."},{"type":"table","head":["القسم","محتواه","هل يظهر؟"],"rows":[["head","title, meta, link, style, script","لا، إلا العنوان في التبويب"],["body","العناوين والفقرات والصور والنماذج","نعم، هذا ما يراه الزائر"]]},{"type":"h","text":"\u003ctitle>: عنوان الصفحة"},{"type":"p","text":"`title` نص يظهر في تبويب المتصفح، ويُستخدم عنوانًا أزرق في نتائج البحث، واسمًا افتراضيًا عند حفظ الصفحة في المفضلة. اكتبه وصفًا فريدًا لكل صفحة: «متجر التمور | الرئيسية» أفضل من «صفحة» أو «مرحبًا»."},{"type":"note","tone":"warn","title":"عنوان واحد فقط","text":"`title` واحد في المستند كله، ويوضع داخل `head`. إن كتبته داخل `body` فقد يظهر كنص عادي في الصفحة، وهذا خلل في البنية حتى لو بدت النتيجة مقبولة."},{"type":"h","text":"\u003cmeta>: بيانات لا تُرى"},{"type":"p","text":"`meta` وسم فارغ يحمل معلومات عن المستند نفسه. هذه أشهر استخداماته في صفحة متجر حقيقية:"},{"type":"code","lang":"html","code":"\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003cmeta name=\"description\" content=\"متجر تمور عربية فاخرة مع توصيل سريع داخل المدينة.\">\n\u003cmeta name=\"keywords\" content=\"تمور, عجوة, سكري, متجر\">\n\u003cmeta name=\"author\" content=\"فريق متجر التمور\">\n\u003cmeta name=\"robots\" content=\"index, follow\">\n\u003cmeta http-equiv=\"refresh\" content=\"30\">","caption":"وسوم meta الشائعة"},{"type":"table","head":["السمة","الوظيفة","ملاحظة"],"rows":[["charset","تحديد ترميز النص","اجعله أول عنصر داخل head"],["name=\"viewport\"","ضبط العرض على شاشة الجوال","ضروري لأي تصميم متجاوب"],["name=\"description\"","وصف يظهر تحت العنوان في نتائج البحث","بين 120 و160 حرفًا"],["name=\"keywords\"","كلمات مفتاحية","تتجاهلها محركات البحث عمليًا"],["name=\"author\"","اسم المؤلف أو الفريق","للتوثيق الداخلي"],["name=\"robots\"","السماح بالفهرسة أو منعها","index/noindex وfollow/nofollow"],["http-equiv","محاكاة ترويسة HTTP","مثل refresh أو content-security-policy"]]},{"type":"p","text":"`charset` يجب أن يأتي مبكرًا جدًا: المتصفح يفحص أول 1024 بايت من الملف لتحديد الترميز، فإن وجده متأخرًا قد يعرض العربية رموزًا قبل أن يصحّح نفسه. أما `description` فلا ترفع ترتيبك مباشرة، لكنها النص الذي يقرأه الباحث قبل أن يقرر النقر، فهي إعلانك المختصر."},{"type":"note","tone":"warn","title":"keywords ليست حيلة","text":"محركات البحث الكبرى تتجاهل `keywords` منذ سنوات، وبعضها ينظر إلى حشوها كمؤشر سلبي. اكتبها للتوثيق إن شئت، ولا تبنِ عليها أملًا في الظهور. و`http-equiv=\"refresh\"` يعيد تحميل الصفحة تلقائيًا ويزعج القارئ — استخدمه بحذر شديد أو لا تستخدمه."},{"type":"h","text":"ربط الموارد: link و style و script"},{"type":"p","text":"`link` وسم فارغ يربط المستند بمورد خارجي. السمة `rel` تحدد نوع العلاقة، و`href` مسار المورد. ثلاث علاقات تحتاجها كثيرًا:"},{"type":"code","lang":"html","code":"\u003clink rel=\"stylesheet\" href=\"css/style.css\">\n\u003clink rel=\"icon\" href=\"favicon.ico\" type=\"image/x-icon\">\n\u003clink rel=\"preload\" href=\"fonts/Cairo.woff2\" as=\"font\" type=\"font/woff2\" crossorigin>","caption":"ثلاث وظائف لوسم link"},{"type":"p","text":"أما `style` فيكتب CSS داخل المستند نفسه — مفيد لصفحة واحدة أو لتجربة سريعة، وأما `script` فيضمّن JavaScript أو يجلبها من ملف. موضع `script` وسماته يحددان **متى** ينفّذ السكربت، وهذا فرق حاسم:"},{"type":"code","lang":"html","code":"\u003cscript src=\"app.js\" defer>\u003c/script>\n\u003cscript src=\"analytics.js\" async>\u003c/script>\n\u003cscript type=\"module\" src=\"main.js\">\u003c/script>","caption":"ثلاث طرق لتحميل السكربت"},{"type":"table","head":["الطريقة","التحميل","التنفيذ"],"rows":[["\u003cscript src> بلا سمة","يحجب تحليل الصفحة","فور نزول الملف"],["defer","بالتوازي مع التحليل","بعد بناء DOM وبالترتيب"],["async","بالتوازي مع التحليل","فور نزوله وبلا ترتيب مضمون"],["type=\"module\"","مؤجّل تلقائيًا","بعد بناء DOM وبترتيب الوحدات"]]},{"type":"note","tone":"tip","title":"القاعدة العملية","text":"استخدم `defer` لسكربتاتك التي تتعامل مع DOM، و`async` للسكربتات المستقلة مثل التحليلات، و`type=\"module\"` إن كنت تستخدم `import`. السكربت الذي يعتمد على عناصر الصفحة بلا `defer` قد يبحث عن عنصر لم يُبنَ بعد."},{"type":"h","text":"noscript و base"},{"type":"p","text":"`noscript` يعرض بديلًا لمن عطّل JavaScript، فيوضع في `body` ويحتوي رسالة مفهومة بدل صفحة فارغة. أما `base` فيحدد عنوانًا أساسيًا تُحسب منه كل المسارات النسبية والروابط في الصفحة؛ وهو قوي وخطير في الوقت نفسه، لأن عنصرًا واحدًا منه يغيّر سلوك كل الروابط النسبية."},{"type":"code","lang":"html","code":"\u003chead>\n  \u003cbase href=\"https://matjar.example/\">\n\u003c/head>\n\u003cbody>\n  \u003cnoscript>\u003cp>لعرض السلة يلزم تشغيل JavaScript.\u003c/p>\u003c/noscript>\n\u003c/body>","caption":"base في الرأس و noscript في الجسد"},{"type":"h","text":"ترتيب العناصر داخل head"},{"type":"p","text":"الترتيب ليس عشوائيًا. ابدأ بالترميز ليقرأه المتصفح قبل أي نص عربي، ثم viewport، ثم العنوان والوصف، ثم الأنماط والخطوط، وأخيرًا السكربتات. هذا التسلسل يقلّل وميض النص غير المنسّق ويسرّع أول رسم."},{"type":"list","items":["`\u003cmeta charset=\"UTF-8\">` أولًا بلا استثناء","`\u003cmeta name=\"viewport\">` ثم `\u003ctitle>`","`\u003cmeta name=\"description\">` وبقية البيانات الوصفية","`\u003clink rel=\"stylesheet\">` وروابط الخطوط","`\u003cstyle>` إن وُجد تنسيق داخلي","`\u003cscript defer>` في النهاية"],"ordered":true},{"type":"terms","items":[{"term":"\u003c!DOCTYPE html>","desc":"تصريح يحدد معيار HTML5 ويشغّل وضع المعايير في المتصفح."},{"term":"lang","desc":"سمة على `\u003chtml>` تحدد لغة المحتوى لقارئات الشاشة ومحركات البحث."},{"term":"dir","desc":"سمة تحدد اتجاه النص: `rtl` للعربية و`ltr` للإنجليزية."},{"term":"viewport","desc":"بيانات وصفية تجعل عرض الصفحة مساويًا لعرض شاشة الجوال."},{"term":"defer","desc":"سمة سكربت تؤجل التنفيذ إلى ما بعد بناء DOM مع حفظ الترتيب."},{"term":"async","desc":"سمة سكربت تنفّذه فور نزوله دون انتظار DOM ودون ترتيب مضمون."},{"term":"http-equiv","desc":"سمة في `meta` تحاكي ترويسة HTTP مثل refresh."}]}],"examples":[{"title":"عنوان التبويب أم عنوان الصفحة؟","prompt":"ما الذي يظهر في تبويب المتصفح، وما الذي يظهر داخل الصفحة؟","answer":"التبويب يعرض «متجر التمور | العروض»، والصفحة تعرض «عروض الأسبوع» كعنوان كبير.","explain":"`title` في `head` يُعرض في التبويب ونتائج البحث، أما `h1` في `body` فيُرسم داخل الصفحة. وظيفتهما مختلفة حتى لو تشابه النص.","html":"\u003c!DOCTYPE html>\n\u003chtml lang=\"ar\" dir=\"rtl\">\n\u003chead>\n  \u003cmeta charset=\"UTF-8\">\n  \u003ctitle>متجر التمور | العروض\u003c/title>\n\u003c/head>\n\u003cbody>\n  \u003ch1>عروض الأسبوع\u003c/h1>\n  \u003cp>خصم 20% على العجوة حتى نهاية الخميس.\u003c/p>\n\u003c/body>\n\u003c/html>","css":"","en":{"title":"Tab title or page title?","prompt":"What shows in the browser tab, and what shows inside the page?","answer":"The tab shows «متجر التمور | العروض», and the page shows «عروض الأسبوع» as a large heading.","explain":"`title` in `head` appears in the tab and in search results; `h1` in `body` is painted inside the page. They do different jobs even when the text is similar."}},{"title":"زائر عطّل JavaScript","prompt":"ماذا يرى من عطّل JavaScript في متصفحه؟","answer":"يرى عنوان «سلة المشتريات» ثم الفقرة البديلة: «لعرض السلة يلزم تشغيل JavaScript». ولا تظهر عناصر السلة التفاعلية.","explain":"`noscript` لا يُرسم إلا حين يكون JavaScript معطّلًا في المتصفح. استخدمه لرسالة واضحة بدل صفحة تبدو معطوبة بلا سبب.","html":"\u003ch1>سلة المشتريات\u003c/h1>\n\u003cnoscript>\u003cp>لعرض السلة يلزم تشغيل JavaScript.\u003c/p>\u003c/noscript>","css":"","en":{"title":"A visitor disabled JavaScript","prompt":"What does someone who turned JavaScript off in their browser see?","answer":"They see the heading «سلة المشتريات» and then the fallback paragraph: «لعرض السلة يلزم تشغيل JavaScript». The interactive cart does not appear.","explain":"`noscript` is only rendered when JavaScript is disabled. Use it for a clear message instead of a page that looks broken for no reason."}},{"title":"لغة داخل لغة","prompt":"لماذا نضع `lang=\"en\"` على الكلمة الإنجليزية وحدها؟","answer":"ليقرأها قارئ الشاشة بالنطق الإنجليزي الصحيح بدل محاولة نطقها كأنها عربية.","explain":"سمة `lang` تُورَّث لكل الأبناء؛ وضعها على `span` يغيّر لغة ذلك الجزء فقط، و`dir=\"ltr\"` يحافظ على ترتيب الكلمات اللاتينية داخل سطر عربي.","html":"\u003cp>في متجرنا نوفر خدمة \u003cspan lang=\"en\" dir=\"ltr\">Same Day Delivery\u003c/span> داخل المدينة.\u003c/p>","css":"","en":{"title":"A language inside a language","prompt":"Why do we put `lang=\"en\"` on the English word alone?","answer":"So a screen reader pronounces it with correct English pronunciation instead of trying to read it as Arabic.","explain":"`lang` is inherited by all children; placing it on a `span` changes the language of that part only, and `dir=\"ltr\"` keeps Latin words in order inside an Arabic line."}}],"quiz":[{"q":"ما وظيفة \u003c!DOCTYPE html>؟","options":["إغلاق المستند في نهايته","إخبار المتصفح بمعيار HTML5 وتشغيل وضع المعايير","تحميل ملف الأنماط تلقائيًا","تحديد لغة الصفحة"],"answer":1,"explain":"التصريح يحدد المعيار ويشغّل standards mode، وبغيابه قد يدخل المتصفح في quirks mode فتختلف الحسابات."},{"q":"أين يوضع \u003cmeta charset=\"UTF-8\"> ولماذا؟","options":["في نهاية body لتسريع الرسم","في أول head ليقرأه المتصفح قبل النص العربي","داخل title","في ملف CSS"],"answer":1,"explain":"المتصفح يفحص أول 1024 بايت لتحديد الترميز، فتأخير `charset` قد يعرض العربية رموزًا قبل التصحيح."},{"q":"لديك سكربت يقرأ عنصرًا من DOM فور تحميل الصفحة. أي سمة تختار؟","options":["async","defer","src وحده بلا سمات","type=\"text/css\""],"answer":1,"explain":"`defer` يؤجل التنفيذ إلى ما بعد بناء DOM ويحفظ الترتيب، فيجد السكربت العناصر جاهزة. `async` قد ينفّذ قبل وجودها."},{"q":"ما الخطأ في هذا الهيكل: `\u003chtml>\u003chead>\u003ctitle>...\u003c/title>\u003c/head>\u003cbody>...\u003c/body>\u003c/html>`؟","options":["لا يوجد خطأ إطلاقًا","يفتقد تصريح DOCTYPE فقد يعمل المتصفح في الوضع الغريب","title يجب أن يكون داخل body","html لا يحتاج وسم إغلاق"],"answer":1,"explain":"بقية العناصر سليمة، لكن غياب `\u003c!DOCTYPE html>` يترك المتصفح في quirks mode وتصبح الحسابات غير موثوقة."},{"q":"أي سمة تضبط لغة المحتوى ليقرأه قارئ الشاشة بالنطق الصحيح؟","options":["dir","lang","charset","rel"],"answer":1,"explain":"`lang` تحدد اللغة، أما `dir` فتحدد الاتجاه. لكل منهما وظيفة مختلفة، وتحتاج الاثنتين في صفحة عربية."}],"tasks":[{"id":"html-02-t1","title":"هيكل مستند صفحة المنتجات","brief":"اكتب مستند HTML5 كاملًا لصفحة منتجات: تصريح `DOCTYPE` في أول سطر، و`html` بسمتي `lang=\"ar\"` و`dir=\"rtl\"`، و`head` فيه `charset` بترميز UTF-8 و`title` نصه «المنتجات | متجر التمور»، و`body` فيه عنوان `h1` نصه «منتجاتنا» وفقرة قصيرة.","steps":["ابدأ بـ \u003c!DOCTYPE html> ثم \u003chtml lang=\"ar\" dir=\"rtl\">","اكتب \u003chead> وضع فيه \u003cmeta charset=\"UTF-8\"> ثم \u003ctitle>","افتح \u003cbody> وأضف \u003ch1>منتجاتنا\u003c/h1> وفقرة تحت العنوان"],"files":{"html":"\u003chtml>\n\u003chead>\n  \u003ctitle>صفحة جديدة\u003c/title>\n\u003c/head>\n\u003cbody>\n  \u003ch1>عنوان مؤقت\u003c/h1>\n\u003c/body>\n\u003c/html>","css":""},"checks":[{"kind":"source","label":"تصريح DOCTYPE موجود","regex":"\u003c!DOCTYPE\\s+html"},{"kind":"attr","label":"لغة المستند عربية","sel":"html","attr":"lang","regex":"^ar"},{"kind":"source","label":"اتجاه المستند من اليمين","regex":"dir=[\"']?rtl"},{"kind":"attr","label":"ترميز الصفحة UTF-8","sel":"meta[charset]","attr":"charset","regex":"utf-8"},{"kind":"text","label":"عنوان التبويب يذكر المنتجات","sel":"title","regex":"المنتجات"}],"hint":"السمات تُكتب داخل الوسم الافتتاحي: \u003chtml lang=\"ar\" dir=\"rtl\">، وليس بعد وسم الإغلاق.","solution":{"html":"\u003c!DOCTYPE html>\n\u003chtml lang=\"ar\" dir=\"rtl\">\n\u003chead>\n  \u003cmeta charset=\"UTF-8\">\n  \u003ctitle>المنتجات | متجر التمور\u003c/title>\n\u003c/head>\n\u003cbody>\n  \u003ch1>منتجاتنا\u003c/h1>\n  \u003cp>تمور فاخرة تُعبّأ في يوم الحصاد وتوصل داخل المدينة.\u003c/p>\n\u003c/body>\n\u003c/html>","css":""},"en":{"title":"Document skeleton for a products page","brief":"Write a complete HTML5 document for a products page: `DOCTYPE` on the first line, `html` with `lang=\"ar\"` and `dir=\"rtl\"`, a `head` with a UTF-8 `charset` and a `title` reading «المنتجات | متجر التمور», and a `body` with an `h1` reading «منتجاتنا» and a short paragraph.","steps":["Start with \u003c!DOCTYPE html> then \u003chtml lang=\"ar\" dir=\"rtl\">","Write \u003chead> with \u003cmeta charset=\"UTF-8\"> then \u003ctitle>","Open \u003cbody> and add \u003ch1>منتجاتنا\u003c/h1> and a paragraph under the heading"],"hint":"Attributes go inside the opening tag: \u003chtml lang=\"ar\" dir=\"rtl\">, not after the closing tag."}},{"id":"html-02-t2","title":"بيانات وصفية وربط الأنماط","brief":"أكمل رأس المستند: أضف `meta name=\"viewport\"` بمحتوى `width=device-width, initial-scale=1`، و`meta name=\"description\"` يذكر كلمة «متجر» في وصفه، ورابطًا لملف الأنماط `css/style.css` بعلاقة `stylesheet`، وسكربتًا من `app.js` بسمة `defer`.","steps":["ضع viewport بعد charset مباشرة","أضف description بجملة تصف الصفحة","أضف \u003clink rel=\"stylesheet\" href=\"css/style.css\">","أضف \u003cscript src=\"app.js\" defer>\u003c/script> في نهاية head"],"files":{"html":"\u003c!DOCTYPE html>\n\u003chtml lang=\"ar\" dir=\"rtl\">\n\u003chead>\n  \u003cmeta charset=\"UTF-8\">\n  \u003ctitle>المنتجات | متجر التمور\u003c/title>\n\u003c/head>\n\u003cbody>\n  \u003ch1>منتجاتنا\u003c/h1>\n\u003c/body>\n\u003c/html>","css":""},"checks":[{"kind":"attr","label":"إعداد viewport للجوال","sel":"meta[name=\"viewport\"]","attr":"content","regex":"width=device-width"},{"kind":"attr","label":"وصف الصفحة يذكر المتجر","sel":"meta[name=\"description\"]","attr":"content","regex":"متجر"},{"kind":"attr","label":"رابط ملف الأنماط style.css","sel":"link[rel=\"stylesheet\"]","attr":"href","regex":"style\\.css"},{"kind":"source","label":"سكربت مؤجّل بـ defer","regex":"\u003cscript[^>]*defer[^>]*>"}],"hint":"كل وسوم head فارغة تُكتب وحدها بلا إغلاق، وقيم السمات بين علامتي تنصيص.","solution":{"html":"\u003c!DOCTYPE html>\n\u003chtml lang=\"ar\" dir=\"rtl\">\n\u003chead>\n  \u003cmeta charset=\"UTF-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"description\" content=\"متجر تمور عربية فاخرة مع توصيل سريع داخل المدينة.\">\n  \u003ctitle>المنتجات | متجر التمور\u003c/title>\n  \u003clink rel=\"stylesheet\" href=\"css/style.css\">\n  \u003cscript src=\"app.js\" defer>\u003c/script>\n\u003c/head>\n\u003cbody>\n  \u003ch1>منتجاتنا\u003c/h1>\n\u003c/body>\n\u003c/html>","css":""},"en":{"title":"Metadata and linking styles","brief":"Complete the document head: add `meta name=\"viewport\"` with content `width=device-width, initial-scale=1`, a `meta name=\"description\"` whose text contains the word «متجر», a link to the stylesheet `css/style.css` with `rel=\"stylesheet\"`, and a script from `app.js` with the `defer` attribute.","steps":["Put viewport right after charset","Add a description with a sentence describing the page","Add \u003clink rel=\"stylesheet\" href=\"css/style.css\">","Add \u003cscript src=\"app.js\" defer>\u003c/script> at the end of head"],"hint":"Empty head tags stand alone with no closing tag, and attribute values go between quotes."}}],"summary":["المستند يبدأ بـ DOCTYPE ثم html ثم head ثم body","lang و dir ضروريتان لكل صفحة عربية","charset أول عنصر في head، وtitle واحد لكل صفحة","meta تحمل الوصف والاستجابة وسياسة الفهرسة","link يربط الأنماط والأيقونات، وscript بسمة defer ينتظر DOM"],"en":{"chapter":"HTML · Basics","title":"Document Structure and Metadata","subtitle":"Build a complete HTML5 document, from DOCTYPE to the order of the head tags that browsers and search engines read.","level":"Beginner","objectives":["Write a complete HTML5 document skeleton from memory","Set the page language and direction correctly for Arabic","Use meta for encoding, description and responsiveness","Link CSS and JavaScript with defer, async and module","Order the head elements logically for faster rendering"],"summary":["A document starts with DOCTYPE, then html, head, body","lang and dir are essential on every Arabic page","charset comes first in head, and each page has exactly one title","meta carries the description, responsiveness and indexing policy","link attaches styles and icons; a script with defer waits for the DOM"]}},{"id":"html-03","track":"html","chapter":"HTML · الأساسيات","order":3,"title":"العناوين والفقرات وتنظيم النص","subtitle":"تبني خريطة محتوى واضحة بالعناوين الستة، وتتحكم في الأسطر والفواصل دون أن تفسد المعنى.","minutes":14,"level":"مبتدئ","objectives":["تستخدم h1 حتى h6 بتسلسل هرمي صحيح","تفرّق بين الفقرة وفاصل السطر والفاصل الموضوعي","تعرف متى تحفظ المسافات بـ pre ومتى لا","تتجنّب استخدام العناوين لتكبير الخط"],"theory":[{"type":"h","text":"العناوين خريطة لا زينة"},{"type":"p","text":"العنوان ليس نصًا كبيرًا فحسب، بل علامة على **موضوع قسم**. قارئ الشاشة يستطيع إحصاء عناوين الصفحة والتنقل بينها بمفتاح واحد، ومحركات البحث تبني فهرسها من هذه العناوين، ووضع القارئ في المتصفح يستخدمها كذلك. لو كبّرت نصًا بـ CSS لبدا عنوانًا، لكن لا أحد سيعرف أنه عنوان."},{"type":"code","lang":"html","code":"\u003ch1>دليل التمور\u003c/h1>\n\u003ch2>أنواع التمور\u003c/h2>\n\u003ch3>السكري\u003c/h3>\n\u003ch3>العجوة\u003c/h3>\n\u003ch2>التخزين\u003c/h2>\n\u003ch3>في الثلاجة\u003c/h3>","caption":"تسلسل هرمي سليم لصفحة دليل"},{"type":"h","text":"المستويات الستة"},{"type":"p","text":"`h1` أعلى مستوى و`h6` أدنى مستوى. المتصفح يعرضها بأحجام متناقصة افتراضيًا، لكن الحجم نتيجة جانبية لا هدفًا؛ المهم هو **عمق** القسم الذي يعنيه العنوان."},{"type":"table","head":["الوسم","المعنى","الاستخدام المعتاد"],"rows":[["\u003ch1>","عنوان الصفحة","اسم المقال أو المنتج أو المتجر"],["\u003ch2>","قسم رئيسي","محاور المقال أو أقسام الصفحة"],["\u003ch3>","قسم فرعي","تفصيل داخل محور"],["\u003ch4>–\u003ch6>","مستويات أعمق","نادرة الاستخدام في الصفحات العادية"]]},{"type":"h","text":"خطأ تخطي المستويات"},{"type":"p","text":"لا تنتقل من `h2` إلى `h4` مباشرة لأنك تريد خطًا أصغر. التخطي يكسر الشجرة: يعلن قارئ الشاشة «عنوان مستوى رابع» دون أن يعرف تحت أي قسم يندرج. الصح أن تنزل درجة واحدة كل مرة، وأن تعود درجة واحدة عند بدء قسم جديد."},{"type":"note","tone":"warn","title":"العنوان أداة معنى لا أداة حجم","text":"إن أردت نصًا أصغر فاستخدم CSS: `h2 { font-size: 1.25rem; }`. لا تختر `h4` لأنه «أنسب شكلًا»، فذلك يفسد الخريطة ويُربك قارئات الشاشة."},{"type":"h","text":"كم h1 في الصفحة؟"},{"type":"p","text":"المعيار لا يمنع أكثر من `h1`، لكن **الاقتراح العملي** عنوان `h1` واحد لكل صفحة يمثل موضوعها. في صفحة قائمة منتجات يكون `h1` هو «منتجاتنا»، وكل منتج عنوان `h2`، وتفاصيل المنتج `h3`. بهذا يفهم الزائر — والآلة — أين يقف."},{"type":"h","text":"الفقرات: p"},{"type":"p","text":"`p` للفقرات النصية المتصلة. لا تستخدمه لتغليف كل شيء: القائمة لها `ul`، والاقتباس له `blockquote`، والعنوان له `h2`. المتصفح يضيف مسافة أعلى وأسفل كل فقرة تلقائيًا، فلا حاجة لإضافة أسطر فارغة بينها."},{"type":"note","tone":"info","title":"لا تستخدم فقرات فارغة للمسافات","text":"`\u003cp>\u003c/p>` المتكررة لصناعة فراغ لا تعمل بشكل موثوق، وتُربك قارئ الشاشة. المسافة بين العناصر مهمة CSS: `margin`."},{"type":"h","text":"فواصل وأسطر: br و hr و wbr"},{"type":"p","text":"`br` فاصل سطر داخل النص نفسه، ويُستخدم في العنوان البريدي والبيت الشعري حيث الفصل جزء من المعنى — لا لتنسيق الفقرات. و`hr` فاصل **موضوعي** بين قسمين، أي تحوّل في الموضوع، لا مجرد خط للزينة. أما `wbr` فنقطة اقتراح لكسر كلمة طويلة إذا لم تتسع الشاشة، ولا يظهر منه شيء إن لم يكن الكسر لازمًا."},{"type":"code","lang":"html","code":"\u003cp>مطعم البيت الشامي\u003cbr>شارع الملك فهد\u003cbr>الرياض\u003c/p>\n\u003chr>\n\u003cp>رابط طويل: https://example.com/\u003cwbr>products/\u003cwbr>dates-2026\u003c/p>","caption":"عنوان متعدد الأسطر وفاصل موضوعي"},{"type":"h","text":"pre: عندما تكون المسافات جزءًا من المعنى"},{"type":"p","text":"`pre` يعرض النص كما كُتب: كل المسافات والأسطر الجديدة محفوظة، وبخط ثابت العرض. مناسب للشِعر والجداول النصية والمخططات، وغير مناسب لفقرات عادية لأن السطر الطويل سيخرج عن حدود الشاشة."},{"type":"code","lang":"html","code":"\u003cpre>\nالتمورُ في الصحنِ نورٌ\nوالبخلُ في القلبِ عارُ\n\u003c/pre>","caption":"بيتان داخل pre"},{"type":"note","tone":"tip","title":"pre مع code","text":"لعرض شفرة برمجية استخدم `\u003cpre>\u003ccode>…\u003c/code>\u003c/pre>`: `pre` يحفظ المسافات و`code` يعطي الدلالة البرمجية. ولا تنسَ تهريب `\u003c` و`>` إلى `&lt;` و`&gt;` إن أردت عرضهما كنص."},{"type":"terms","items":[{"term":"\u003ch1>","desc":"عنوان المستوى الأول، يمثل موضوع الصفحة كله."},{"term":"\u003ch2>–\u003ch6>","desc":"عناوين أقسام متداخلة، تنزل درجة واحدة كل مرة."},{"term":"\u003cp>","desc":"فقرة نصية متصلة، ولها مسافة افتراضية أعلى وأسفل."},{"term":"\u003cbr>","desc":"فاصل سطر داخل النص مثل عنوان بريدي أو بيت شعر."},{"term":"\u003chr>","desc":"فاصل موضوعي بين قسمين، لا خط للزينة."},{"term":"\u003cwbr>","desc":"نقطة اقتراح كسر كلمة طويلة عند الحاجة فقط."},{"term":"\u003cpre>","desc":"نص محفوظ المسافات والأسطر بخط ثابت العرض."}]}],"examples":[{"title":"ثلاثة مستويات في صفحة منتج","prompt":"أي نص يعرضه المتصفح بخط أكبر، ولماذا؟","answer":"«متجر التمور» أكبر (h1)، ثم «الأنواع» (h2)، ثم «السكري» (h3) الأصغر بينها.","explain":"الأحجام الافتراضية تتناقص مع المستوى، لكن الأهم أن الترتيب يخبر قارئ الشاشة بالعلاقة بين الأقسام.","html":"\u003ch1>متجر التمور\u003c/h1>\n\u003ch2>الأنواع\u003c/h2>\n\u003ch3>السكري\u003c/h3>\n\u003cp>حلو المذاق، لين القوام، وأشهر تمر في المنطقة.\u003c/p>","css":"","en":{"title":"Three levels on a product page","prompt":"Which text does the browser show in a bigger font, and why?","answer":"«متجر التمور» (h1) is the biggest, then «الأنواع» (h2), then «السكري» (h3) which is the smallest of them.","explain":"Default sizes shrink with the level, but more importantly the order tells a screen reader how the sections relate."}},{"title":"فاصلان مختلفان","prompt":"ما الفرق بين الأثرين الظاهرين هنا؟","answer":"`br` يقطع السطر داخل الفقرة الأولى دون فراغ كبير، و`hr` يرسم خطًا أفقيًا يفصل بين فرعي الرياض وجدة.","explain":"`br` أداة تنسيق داخل النص، و`hr` أداة معنى بين قسمين. خلطهما يجعل بنية الصفحة غامضة للقارئ الآلي.","html":"\u003cp>فرع الرياض\u003cbr>حي النخيل\u003cbr>طريق الملك فهد\u003c/p>\n\u003chr>\n\u003cp>فرع جدة\u003cbr>حي الروضة\u003c/p>","css":"","en":{"title":"Two different separators","prompt":"What is the difference between the two visible effects here?","answer":"`br` breaks the line inside the first paragraph without a big gap, and `hr` draws a horizontal line separating the Riyadh and Jeddah branches.","explain":"`br` is a formatting tool inside text, `hr` is a meaning tool between two sections. Mixing them makes the page structure unclear to machines."}},{"title":"التكبير ليس عنوانًا","prompt":"السطران يبدوان متشابهين في الحجم. بأي شيء يختلفان فعلًا؟","answer":"السطر الأول نص عادي مكبّر بـ CSS، والثاني عنوان `h2` حقيقي يمكن التنقل إليه والقفز بينه وبين العناوين.","explain":"التنسيق يغيّر المظهر فقط، أما الوسم فيمنح الدلالة التي تعتمد عليها قارئات الشاشة ومحركات البحث.","html":"\u003cp class=\"big\">التخزين في الثلاجة\u003c/p>\n\u003ch2>التخزين في المجمّد\u003c/h2>","css":".big {\n  font-size: 1.5em;\n  font-weight: bold;\n}","en":{"title":"Bigger is not a heading","prompt":"Both lines look the same size. What actually makes them different?","answer":"The first line is normal text enlarged with CSS; the second is a real `h2` heading that can be navigated to and jumped between.","explain":"Styling only changes appearance; the tag provides the meaning that screen readers and search engines rely on."}}],"quiz":[{"q":"أي تسلسل عناوين سليم داخل مقال؟","options":["h1 ثم h3 ثم h2","h1 ثم h2 ثم h3 ثم h2","h2 ثم h1 ثم h4","h1 ثم h1 ثم h3"],"answer":1,"explain":"يبدأ بعنوان الصفحة ثم ينزل درجة واحدة لكل مستوى، ويعود إلى `h2` عند بدء قسم رئيسي جديد."},{"q":"ما الغرض الصحيح من \u003chr>؟","options":["رسم خط للزينة","فصل موضوعي بين قسمين مختلفين","إضافة مسافة رأسية كبيرة","كسر السطر داخل العنوان"],"answer":1,"explain":"`hr` يحمل معنى انتهاء موضوع وبدء آخر. المسافات والخطوط الزخرفية مكانها CSS."},{"q":"متى تستخدم \u003cbr>؟","options":["بين كل فقرتين","داخل عنوان بريدي أو بيت شعر","لإضافة مسافة كبيرة","لتوسيط النص"],"answer":1,"explain":"`br` فاصل سطر ذو معنى داخل النص. أما المسافات بين الفقرات فتأتي تلقائيًا من `p`."},{"q":"أي وسم يحفظ المسافات والأسطر كما كتبتها؟","options":["p","pre","br","wbr"],"answer":1,"explain":"`pre` يعرض النص بمسافاته وأسطره الأصلية بخط ثابت العرض، وهو المناسب للشِعر والمخططات النصية."},{"q":"لماذا لا نستخدم \u003ch4> بدل CSS لتكبير نص؟","options":["لأن h4 لا يعمل على الجوال","لأن ذلك يخلق عنوانًا وهميًا يفسد خريطة المستند","لأن المتصفح يمنع تكرار h4","لأن h4 لا يقبل النص العربي"],"answer":1,"explain":"اختيار المستوى بحسب الحجم يجعل العناوين لا تعكس البنية، فيتوه قارئ الشاشة وتفقد الصفحة تسلسلها."}],"tasks":[{"id":"html-03-t1","title":"مقال في مدونة","brief":"اكتب مقالًا قصيرًا: عنوان `h1` واحد نصه «كيف تحفظ التمور؟»، ثم عنوانان `h2` نصّهما «التخزين في الثلاجة» و«التخزين في المجمّد»، وتحت كل عنوان فقرة `p` واحدة على الأقل. لا تستخدم `h3` في هذا التحدي حتى يبقى التسلسل بسيطًا.","steps":["ابدأ بعنوان h1 ثم أغلق الوسم","أضف h2 أول ثم فقرة تحته","أضف h2 ثانيًا ثم فقرة تحته"],"files":{"html":"\u003ch1>عنوان المقال\u003c/h1>\n\u003cp>اكتب الفقرة الأولى.\u003c/p>\n","css":""},"checks":[{"kind":"selector","label":"عنوان h1 واحد فقط","sel":"h1","min":1,"max":1},{"kind":"text","label":"عنوان المقال يذكر التمور","sel":"h1","regex":"التمور"},{"kind":"selector","label":"عنوانان h2 للقسمين","sel":"h2","min":2},{"kind":"selector","label":"فقرة على الأقل لكل قسم","sel":"p","min":2},{"kind":"sourceNot","label":"لا عناوين h3 في هذا التحدي","regex":"\u003ch3"}],"hint":"العنوان الرئيسي للصفحة h1، وكل قسم رئيسي h2. اكتب النص بين الوسمين ثم أغلق.","solution":{"html":"\u003ch1>كيف تحفظ التمور؟\u003c/h1>\n\u003ch2>التخزين في الثلاجة\u003c/h2>\n\u003cp>ضع التمور في علبة محكمة الإغلاق على الرف الأوسط مدة لا تتجاوز شهرين.\u003c/p>\n\u003ch2>التخزين في المجمّد\u003c/h2>\n\u003cp>التجميد يحفظ التمور أشهرًا، لكن افصلها عن الأطعمة ذات الرائحة القوية.\u003c/p>","css":""},"en":{"title":"A blog article","brief":"Write a short article: one `h1` reading «كيف تحفظ التمور؟», then two `h2` headings reading «التخزين في الثلاجة» and «التخزين في المجمّد», with at least one `p` paragraph under each. Do not use `h3` in this challenge so the hierarchy stays simple.","steps":["Start with an h1 and close the tag","Add the first h2 and a paragraph under it","Add the second h2 and a paragraph under it"],"hint":"The page's main heading is h1 and every main section is h2. Write the text between the tags, then close."}},{"id":"html-03-t2","title":"بيتان وفاصل","brief":"أضف عنوانًا `h2` نصه «مقطوعة قصيرة»، ثم عنصر `pre` فيه بيتان على سطرين منفصلين، أحدهما يبدأ بـ «التمورُ»، ثم خطًا فاصلًا `hr` بعده، وفقرة `p` في النهاية. لا تستخدم `br` داخل `pre`.","steps":["اكتب \u003ch2>مقطوعة قصيرة\u003c/h2>","افتح \u003cpre> واكتب البيت الأول ثم اضغط Enter واكتب الثاني","أغلق \u003c/pre> ثم أضف \u003chr> ثم فقرة"],"files":{"html":"\u003ch2>مقطوعة قصيرة\u003c/h2>\n\u003cp>ضع البيتين هنا.\u003c/p>\n","css":""},"checks":[{"kind":"selector","label":"عنصر pre واحد","sel":"pre","min":1,"max":1},{"kind":"text","label":"البيت يذكر التمور","sel":"pre","regex":"التمور"},{"kind":"text","label":"البيتان على سطرين منفصلين","sel":"pre","regex":"\\n"},{"kind":"selector","label":"خط فاصل hr","sel":"hr","min":1},{"kind":"sourceNot","label":"لا br داخل pre","regex":"\u003cpre[\\s\\S]*?\u003cbr"}],"hint":"داخل pre لا تحتاج br؛ اضغط Enter مباشرة في المحرر لينزل سطر جديد.","solution":{"html":"\u003ch2>مقطوعة قصيرة\u003c/h2>\n\u003cpre>\nالتمورُ في الصحنِ نورٌ\nوالبخلُ في القلبِ عارُ\n\u003c/pre>\n\u003chr>\n\u003cp>من ديوان شاعر من المدينة القديمة.\u003c/p>","css":""},"en":{"title":"Two verses and a divider","brief":"Add an `h2` reading «مقطوعة قصيرة», then a `pre` element with two verses on separate lines, one of them starting with «التمورُ», then a horizontal rule `hr`, and a `p` paragraph at the end. Do not use `br` inside `pre`.","steps":["Write \u003ch2>مقطوعة قصيرة\u003c/h2>","Open \u003cpre>, write the first verse, press Enter and write the second","Close \u003c/pre>, then add \u003chr> and a paragraph"],"hint":"Inside pre you don't need br; just press Enter in the editor to start a new line."}}],"summary":["العنوان علامة معنى، لا أداة تكبير","انزل درجة واحدة كل مرة ولا تتخطَّ المستويات","عنوان h1 واحد لكل صفحة كقاعدة عملية","br للسطر داخل النص، وhr للفصل الموضوعي","pre يحفظ المسافات والأسطر كما كتبتها"],"en":{"chapter":"HTML · Basics","title":"Headings, Paragraphs and Text Organization","subtitle":"Build a clear content map with the six heading levels, and control lines and separators without breaking meaning.","level":"Beginner","objectives":["Use h1 to h6 in a correct hierarchy","Tell a paragraph, a line break and a thematic break apart","Know when to preserve spacing with pre and when not to","Avoid using headings just to make text bigger"],"summary":["A heading is a meaning marker, not a size tool","Go down one level at a time and never skip levels","One h1 per page is a practical rule","br is for a line inside text, hr is a thematic break","pre keeps spaces and lines exactly as you typed them"]}},{"id":"html-04","track":"html","chapter":"HTML · النصوص والوسوم الدلالية","order":4,"title":"تنسيق النصوص دلاليًا","subtitle":"تختار الوسم الذي يعبّر عن معنى النص لا عن شكله فقط: أهمية، تشديد، حذف، اقتباس، وقت، ومصطلح.","minutes":18,"level":"مبتدئ","objectives":["تفرّق بين الوسم الدلالي والوسم البصري في النص","تستخدم strong وem وmark وdel وins في مواضعها الصحيحة","تكتب الكود والاقتباس والتعريف والوقت بوسوم مناسبة","تضبط اتجاه النص المختلط وتفهم دور span المحايد"],"theory":[{"type":"h","text":"لماذا يوجد وسمان للنص العريض؟"},{"type":"p","text":"لو كتبت `\u003cb>مهم\u003c/b>` أو `\u003cstrong>مهم\u003c/strong>` فلن ترى فرقًا على الشاشة: الاثنان يظهران عريضين. الفرق في المعنى الذي يحمله الكود لا في الشكل. `strong` تعني **أهمية أو خطورة أو إلحاح**، أما `b` فتعني «اعرض هذا عريضًا» بلا أي دلالة إضافية. المتصفح يمنحهما التنسيق نفسه، لكن قارئ الشاشة ومحرك البحث يقرآن المعنى."},{"type":"table","head":["الدلالي","معناه","البصري","متى تستخدم البصري؟"],"rows":[["\u003cstrong>","أهمية أو تحذير","\u003cb>","كلمة مفتاحية في ملخص أو اسم في قائمة بلا أهمية خاصة"],["\u003cem>","تشديد يغيّر النبرة","\u003ci>","مصطلح أجنبي أو اسم علم أو فكرة داخلية"],["\u003cdel>","نص محذوف موثّق","\u003cs>","معلومة لم تعد صالحة مثل سعر منتهٍ"],["\u003cins>","نص مضاف","\u003cu>","تنبيه إملائي أو اسم علم صيني؛ وليس للتزيين"]]},{"type":"h","text":"التشديد والنبرة: em و i"},{"type":"p","text":"`em` تشديد في النبرة: لو قرأت الجملة بصوت عالٍ لرفعت صوتك عند الكلمة الموضوعة داخلها، وقارئ الشاشة يستطيع إعلان هذا التشديد. أما `i` فتستخدمها للمصطلحات الأجنبية وأسماء الأعلام والأفكار الداخلية. لا تفرط في `em`: التشديد في كل سطر يعني ألّا شيء مشدد."},{"type":"code","lang":"html","code":"\u003cp>لا \u003cem>تغلق\u003c/em> النافذة قبل حفظ العمل.\u003c/p>\n\u003cp>شغّلت الهاتف على وضع \u003ci>الطيران\u003c/i> فور الإقلاع.\u003c/p>\n\u003cp>الاسم العلمي للتمر هو \u003ci>Phoenix dactylifera\u003c/i>.\u003c/p>","caption":"التشديد مقابل المصطلح"},{"type":"h","text":"التمييز والحذف والإضافة"},{"type":"p","text":"`mark` تظلل نصًا لأن له صلة بالسياق الحالي: نتيجة بحث أو كلمة مفتاحية في مقال. و`small` للنصوص الجانبية مثل الحقوق والشروط لا لتصغير الخط. و`del` و`ins` توثّقان تغييرًا في المحتوى: المحذوف والمضاف، ويعرضهما المتصفح مشطوبًا ومسطّرًا تلقائيًا. و`sub` و`sup` للمعادلات والوحدات والحواشي."},{"type":"list","ordered":false,"items":["`mark`: تظليل مرتبط بالسياق، مثل الكلمة التي بحث عنها الزائر.","`small`: تفاصيل جانبية وحقوق وشروط، ويُعرض بخط أصغر افتراضيًا.","`del` و`ins`: حذف وإضافة موثّقة، ويمكن إرفاق `datetime` بتاريخ التغيير.","`sub` و`sup`: أسفل السطر وأعلاه، مثل H2O ومساحة الشقة بالمتر المربع.","`s`: معلومة لم تعد صالحة، و`u`: تسطير تنبيهي فقط."]},{"type":"code","lang":"html","code":"\u003cp>السعر بعد الخصم: \u003cdel>199\u003c/del> \u003cins>149\u003c/ins> ريال\u003c/p>\n\u003cp>ينتهي العرض بعد \u003csmall>48 ساعة فقط\u003c/small>.\u003c/p>\n\u003cp>ماء: H\u003csub>2\u003c/sub>O · شقة: 120 م\u003csup>2\u003c/sup>\u003c/p>\n\u003cp>\u003cmark>الشحن مجاني\u003c/mark> على الطلبات فوق 200 ريال.\u003c/p>","caption":"بطاقة منتج"},{"type":"h","text":"النص البرمجي والمدخلات"},{"type":"p","text":"هذه الوسوم تحمل معنى دقيقًا عند التقنيين: `code` جزء من كود، `kbd` ما يضغطه المستخدم على لوحة المفاتيح، `samp` مخرجات برنامج، و`var` اسم متغير في معادلة أو كود. لكتلة كود متعددة الأسطر ضع `code` داخل `pre` حتى تُحفظ الأسطر والمسافات."},{"type":"code","lang":"html","code":"\u003cp>اضغط \u003ckbd>Ctrl\u003c/kbd> + \u003ckbd>S\u003c/kbd> للحفظ.\u003c/p>\n\u003cp>ظهرت الرسالة \u003csamp>Build finished\u003c/samp>.\u003c/p>\n\u003cp>اجمع السعر في المتغير \u003cvar>total\u003c/var>.\u003c/p>\n\u003cpre>\u003ccode>&lt;p&gt;مرحبًا&lt;/p&gt;\u003c/code>\u003c/pre>","caption":"وسوم الشيفرة"},{"type":"h","text":"الاقتباس والتعريف والاختصار"},{"type":"p","text":"`blockquote` اقتباس كتلي مستقل، و`q` اقتباس قصير داخل جملة يضيف المتصفح علامات التنصيص حوله تلقائيًا. السمة `cite` على `blockquote` تحمل رابط المصدر لكنها لا تظهر للزائر ولا تتحول إلى رابط. أما وسم `cite` فيكتب اسم العمل أو المؤلف. و`dfn` أول تعريف لمصطلح في الصفحة، و`abbr` اختصار يشرحه `title` عند مرور المؤشر."},{"type":"code","lang":"html","code":"\u003cp>قال الكاتب إن القراءة \u003cq>عادة تُبنى ولا تُولد\u003c/q>.\u003c/p>\n\u003cblockquote cite=\"https://example.com/read\">\n  \u003cp>عشر صفحات كل ليلة تكفي لإنهاء كتاب في شهر.\u003c/p>\n\u003c/blockquote>\n\u003cp>المصدر: \u003ccite>مجلة القارئ\u003c/cite>\u003c/p>\n\u003cp>\u003cdfn>تجربة المستخدم\u003c/dfn> مجموع انطباعات الزائر، وتُختصر \u003cabbr title=\"User Experience\">UX\u003c/abbr>.\u003c/p>","caption":"اقتباس وتعريف"},{"type":"h","text":"الوقت والعنوان"},{"type":"p","text":"`time` يخبر الآلة بتاريخ، والسمة `datetime` تحمل الصيغة القياسية `YYYY-MM-DD` أو مع وقت `YYYY-MM-DDTHH:MM`. لا تكتب التاريخ داخل `datetime` بالعربية أبدًا. و`address` لمعلومات التواصل الخاصة بالمقال أو الصفحة، وليست للعنوان البريدي فقط، ويمكن أن تحتوي هاتفًا وبريدًا."},{"type":"code","lang":"html","code":"\u003cp>نُشر في \u003ctime datetime=\"2026-03-01\">1 مارس 2026\u003c/time>.\u003c/p>\n\u003caddress>\n  فريق الدعم\u003cbr>\n  \u003ca href=\"mailto:support@example.com\">support@example.com\u003c/a>\n\u003c/address>","caption":"تاريخ آلي ومعلومات تواصل"},{"type":"h","text":"اتجاه النص والقراءة فوق الحروف"},{"type":"p","text":"عندما تختلط العربية باللاتينية والأرقام قد يضطرب ترتيب النص. `bdi` يعزل نصًا مجهول الاتجاه مثل اسم مستخدم فلا يُفسد ما حوله، و`bdo` يفرض اتجاهًا محددًا بالسمة `dir`. و`ruby` تكتب النطق فوق الحرف وتُستخدم في اليابانية والصينية، مع `rt` للنطق و`rp` كأقواس احتياطية للمتصفحات التي لا تدعم ruby."},{"type":"code","lang":"html","code":"\u003cp>المرسل: \u003cbdi>@ali_99\u003c/bdi> والمتابع: \u003cbdi>@سارة\u003c/bdi>\u003c/p>\n\u003cp>\u003cbdo dir=\"ltr\">HTML 2026\u003c/bdo>\u003c/p>\n\u003cp>\u003cruby>漢\u003crp>(\u003c/rp>\u003crt>kan\u003c/rt>\u003crp>)\u003c/rp>\u003c/ruby> تعني «صيني».\u003c/p>","caption":"عزل الاتجاه"},{"type":"h","text":"span: الوسم بلا معنى"},{"type":"p","text":"`span` حاوية سطرية محايدة لا تحمل أي دلالة. تُستخدم لتلوين كلمة أو ربط جزء من نص بجافاسكربت. إن كان لديك معنى — أهمية، اقتباس، كود — فاختر الوسم الدلالي، وإن أردت شكلًا فقط فمكان التنسيق هو CSS وspan مجرد خطاف للاختيار."},{"type":"code","lang":"html","code":"\u003cp>اللون \u003cspan class=\"swatch\">الأزرق\u003c/span> هو لون الهوية.\u003c/p>","caption":"span كخطاف تنسيق"},{"type":"note","tone":"tip","title":"ثلاثة مستفيدين من الدلالة","text":"قارئ الشاشة يعلن «تأكيد» عند strong وem، ومحرك البحث يزن الكلمات داخل strong والعناوين أكثر من غيرها، والمتصفح يضيف سلوكًا جاهزًا مثل التنصيص في q والتسطير في ins. الوصف الدلالي يعمل مجانًا لثلاثة أنظمة في وقت واحد، أما b وi فلا تنقل شيئًا."},{"type":"terms","items":[{"term":"\u003cstrong>","desc":"نص ذو أهمية أو خطورة، يُعلن لقارئ الشاشة."},{"term":"\u003cb>","desc":"عريض بصري بلا دلالة."},{"term":"\u003cem>","desc":"تشديد في النبرة يغيّر معنى الجملة."},{"term":"\u003cmark>","desc":"تظليل نص مرتبط بالسياق الحالي."},{"term":"\u003cdel> / \u003cins>","desc":"نص محذوف ونص مضاف، يُعرضان مشطوبًا ومسطّرًا."},{"term":"\u003ccode> / \u003ckbd> / \u003csamp> / \u003cvar>","desc":"كود، مفتاح يضغطه المستخدم، مخرج برنامج، اسم متغير."},{"term":"\u003cblockquote> / \u003cq>","desc":"اقتباس كتلي مستقل، واقتباس قصير داخل جملة."},{"term":"\u003cdfn> / \u003cabbr>","desc":"تعريف مصطلح أول مرة، واختصار يشرحه title."},{"term":"\u003ctime>","desc":"تاريخ بصيغة تفهمها الآلة عبر datetime."},{"term":"\u003caddress>","desc":"معلومات التواصل الخاصة بالمقال أو الصفحة."},{"term":"\u003cbdi> / \u003cbdo>","desc":"عزل نص مجهول الاتجاه، وفرض اتجاه محدد."},{"term":"\u003cruby> / \u003crt> / \u003crp>","desc":"كتابة النطق فوق الحرف مع بديل احتياطي."},{"term":"\u003cspan>","desc":"حاوية سطرية محايدة للتنسيق أو للجافاسكربت."}]}],"examples":[{"title":"strong أم b؟","prompt":"ماذا يرى المستخدم في السطرين، وماذا يختلف عند قارئ الشاشة؟","answer":"يرى المستخدم السطرين عريضين تمامًا، لكن قارئ الشاشة يرفع النبرة ويعلن الأهمية عند «لا تغلق النافذة» في السطر الأول، ويمر على السطر الثاني كنص عادي.","explain":"المتصفح يعطي strong وb الوزن نفسه، لكن strong وحدها تحمل دلالة الأهمية التي تصل إلى التقنيات المساعدة ومحركات البحث.","html":"\u003cp>\u003cstrong>لا تغلق النافذة\u003c/strong> قبل حفظ التعديلات.\u003c/p>\n\u003cp>\u003cb>شعار\u003c/b> المتجر مكتوب بخط عريض في الترويسة.\u003c/p>","css":"","en":{"title":"strong or b?","prompt":"What does the user see in the two lines, and what differs for a screen reader?","answer":"The user sees both lines bold, but a screen reader raises its tone and announces importance on «لا تغلق النافذة» in the first line, and reads the second line as normal text.","explain":"The browser gives strong and b the same weight, but only strong carries the importance meaning that reaches assistive technology and search engines."}},{"title":"بطاقة عرض سعر","prompt":"أي رقم سيظهر مشطوبًا، وأي رقم ستُسطَّر تحته خط، وأي كلمة ستُظلَّل؟","answer":"199 يظهر مشطوبًا لأنه السعر القديم، و149 يظهر بخط تحته لأنه السعر الجديد، و«الشحن مجاني» يظهر بخلفية صفراء.","explain":"del يعني محذوف وins يعني مضاف، والتنسيق الافتراضي للمتصفح يعبّر عن الدلالة نفسها: شطب للمحذوف وخط تحت المضاف. mark تظليل، وsub وsup يرفعان الرقم أو يخفضانه.","html":"\u003cp>سعر الحزمة: \u003cdel>199\u003c/del> \u003cins>149\u003c/ins> ريال\u003c/p>\n\u003cp>ينتهي العرض في \u003ctime datetime=\"2026-12-31\">31 ديسمبر 2026\u003c/time>\u003c/p>\n\u003cp>ماء: H\u003csub>2\u003c/sub>O · المساحة: 25 م\u003csup>2\u003c/sup> · \u003cmark>الشحن مجاني\u003c/mark>\u003c/p>","css":"","en":{"title":"A price offer card","prompt":"Which number appears struck through, which is underlined, and which word is highlighted?","answer":"199 is struck through because it is the old price, 149 is underlined because it is the new price, and «الشحن مجاني» has a yellow background.","explain":"del means deleted and ins means inserted, and the default browser styling expresses the same meaning: strike-through for deleted, underline for inserted. mark highlights, and sub and sup lower or raise a number."}},{"title":"اقتباس وتعريف واختصار","prompt":"لماذا استُخدم blockquote هنا ولم يُستخدم q؟ وهل cite في الوسم الأول رابط؟","answer":"الاقتباس جملة كاملة مستقلة عن النص فمكانه blockquote؛ ولو كان جزءًا من جملة لاستخدمنا q وأضاف المتصفح علامات التنصيص. وقيمة cite في blockquote رابط مصدر لا يظهر للزائر، بينما وسم cite هنا اسم المجلة وهو نص لا رابط.","explain":"blockquote للاقتباس الكتلي وq للاقتباس الداخلي، وcite في السمة توثّق المصدر للآلة فقط. dfn يعرّف المصطلح أول مرة، وabbr يشرح الاختصار في title عند المرور بالمؤشر.","html":"\u003cp>كما كتبت \u003ccite>مجلة القارئ\u003c/cite>:\u003c/p>\n\u003cblockquote cite=\"https://example.com/read\">\n  \u003cp>القراءة عادة تُبنى ولا تُولد.\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cdfn>تجربة المستخدم\u003c/dfn> مجموع انطباعات الزائر، وتُختصر \u003cabbr title=\"User Experience\">UX\u003c/abbr>.\u003c/p>","css":"","en":{"title":"Quote, definition and abbreviation","prompt":"Why was blockquote used here and not q? And is cite in the first tag a link?","answer":"The quotation is a full sentence separate from the text so it belongs in blockquote; if it were part of a sentence we would use q and the browser would add quotation marks. The cite attribute on blockquote is a source link not shown to the visitor, while the cite tag here is the magazine name — text, not a link.","explain":"blockquote is for block quotations and q for inline ones; the cite attribute documents the source for machines only. dfn defines a term the first time, and abbr explains an abbreviation in its title on hover."}}],"quiz":[{"q":"أي وسم يجعل النص مهمًا فعلًا وليس عريضًا فقط؟","options":["\u003cb>","\u003cstrong>","\u003ci>","\u003cspan>"],"answer":1,"explain":"strong تحمل دلالة الأهمية فيعلنها قارئ الشاشة ويعاملها محرك البحث بوزن أكبر، أما b فتنسيق عريض بلا معنى."},{"q":"في أي حالة يكون \u003ci> الخيار الصحيح؟","options":["لتشديد كلمة تغيّر معنى الجملة","لكتابة اسم علم أجنبي أو مصطلح لاتيني","لتحذير المستخدم من خطأ في النموذج","لتعريف مصطلح لأول مرة"],"answer":1,"explain":"i للمصطلحات الأجنبية والأسماء والأفكار الداخلية، والتشديد لـem، والتعريف الأول لـdfn، والتحذير يكون بنص واضح لا بمجرد ميلان."},{"q":"كيف تكتب تاريخًا يفهمه الحاسوب ويظهر بالعربية للمستخدم؟","options":["\u003ctime datetime=\"2026-05-01\">1 مايو 2026\u003c/time>","\u003ctime>1 مايو 2026\u003c/time> بدون سمة","\u003cdate>2026-05-01\u003c/date>","\u003cspan class=\"date\">1 مايو 2026\u003c/span>"],"answer":0,"explain":"السمة datetime تحمل الصيغة القياسية التي تفهمها الآلة، والنص بين الوسمين يظهر للزائر بأي صيغة تريدها. ولا يوجد وسم اسمه date."},{"q":"ما الفرق بين blockquote وq؟","options":["لا فرق، كلاهما يقتبس نصًا","q اقتباس قصير داخل جملة ويضيف المتصفح علامات التنصيص، وblockquote اقتباس كتلي مستقل","q للكود وblockquote للاقتباس","blockquote يضيف رابطًا تلقائيًا إلى المصدر"],"answer":1,"explain":"الفرق في الحجم والسياق: q داخل السطر مع تنصيص تلقائي، وblockquote كتلة مستقلة قد تحتوي فقرات. السمة cite توثّق المصدر لكنها لا تُنشئ رابطًا مرئيًا."},{"q":"لماذا لا نستخدم \u003cu> لتسطير نص للزينة؟","options":["لأنه محذوف من HTML5","لأنه يحمل دلالة تنبيه أو خطأ إملائي، والتزيين مكانه CSS","لأنه لا يعمل في المتصفحات الحديثة","لأنه يمنع نسخ النص"],"answer":1,"explain":"u ما زال موجودًا لكن بمعنى تنبيهي مثل خطأ إملائي أو اسم علم صيني. التسطير التزييني يُكتب بـ text-decoration في CSS."}],"tasks":[{"id":"html-04-t1","title":"بطاقة منتج بنصوص دلالية","brief":"أنشئ بطاقة منتج فيها عنوان h2، ثم فقرة باسم المنتج داخل strong، وسطر سعر فيه السعر القديم 799 داخل del والسعر الجديد 649 داخل ins، وتاريخ انتهاء العرض داخل time مع السمة datetime بالقيمة 2026-12-31، واختصار abbr يحمل السمة title.","steps":["اكتب h2 ثم فقرة الاسم وضع الاسم نفسه داخل strong","اكتب السعرين داخل del وins بالترتيب","أضف time مع datetime ثم abbr مع title"],"files":{"html":"\u003c!-- اكتب بطاقة المنتج هنا -->\n\u003ch2>ساعة ذكية\u003c/h2>\n","css":""},"checks":[{"kind":"selector","label":"يوجد نص داخلي بـ strong","sel":"strong","min":1},{"kind":"selector","label":"السعر القديم داخل del","sel":"del","min":1},{"kind":"selector","label":"السعر الجديد داخل ins","sel":"ins","min":1},{"kind":"attr","label":"datetime بصيغة سنة-شهر-يوم","sel":"time","attr":"datetime","regex":"^\\d{4}-\\d{2}-\\d{2}$"},{"kind":"attr","label":"كل abbr له title يشرحه","sel":"abbr","attr":"title","regex":".+"}],"hint":"داخل time اكتب التاريخ الظاهر بالعربية، وضع الصيغة الرقمية في datetime فقط.","solution":{"html":"\u003ch2>ساعة نور الذكية\u003c/h2>\n\u003cp>\u003cstrong>ساعة نور\u003c/strong> بضمان سنتين.\u003c/p>\n\u003cp>السعر: \u003cdel>799\u003c/del> \u003cins>649\u003c/ins> ريال\u003c/p>\n\u003cp>ينتهي العرض في \u003ctime datetime=\"2026-12-31\">31 ديسمبر 2026\u003c/time>\u003c/p>\n\u003cp>يشمل السعر \u003cabbr title=\"ضريبة القيمة المضافة\">ض.ق.م\u003c/abbr>.\u003c/p>","css":""},"en":{"title":"A product card with semantic text","brief":"Create a product card with an h2, then a paragraph with the product name inside strong, a price line with the old price 799 inside del and the new price 649 inside ins, the offer's end date inside time with a datetime attribute of 2026-12-31, and an abbr that carries a title attribute.","steps":["Write an h2 then a name paragraph with the name itself inside strong","Write the two prices inside del and ins, in that order","Add time with datetime, then abbr with title"],"hint":"Inside time write the visible date in Arabic, and put the numeric form in datetime only."}},{"id":"html-04-t2","title":"مقطع من مقال","brief":"اكتب مقطعًا فيه عنوان h2، وفقرة تحتوي اقتباسًا قصيرًا داخل q، ثم blockquote مستقل يحوي فقرة ووسم cite باسم المصدر داخل الـblockquote نفسه، ثم address لمعلومات التواصل، ووقت النشر داخل time مع datetime.","steps":["ضع q داخل فقرة عادية","اكتب blockquote وضع داخله p ثم footer فيه cite","أغلق المقطع بـ address وtime"],"files":{"html":"\u003carticle>\n  \u003ch2>ملاحظات عن القراءة\u003c/h2>\n  \u003c!-- أكمل الفقرة والاقتباس -->\n\u003c/article>\n","css":""},"checks":[{"kind":"selector","label":"يوجد اقتباس كتلي blockquote","sel":"blockquote","min":1},{"kind":"selector","label":"اسم المصدر داخل blockquote","sel":"blockquote cite","min":1},{"kind":"selector","label":"اقتباس قصير داخل جملة بـ q","sel":"q","min":1},{"kind":"selector","label":"معلومات تواصل داخل address","sel":"address","min":1},{"kind":"attr","label":"تاريخ نشر آلي في datetime","sel":"time","attr":"datetime","regex":"^\\d{4}-\\d{2}-\\d{2}$"}],"hint":"cite اسم العمل أو المؤلف، ضعه داخل blockquote لا خارجه.","solution":{"html":"\u003carticle>\n  \u003ch2>ملاحظات عن القراءة\u003c/h2>\n  \u003cp>يقول المؤلف إن القراءة \u003cq>عادة تُبنى ولا تُولد\u003c/q>.\u003c/p>\n  \u003cblockquote cite=\"https://example.com/read\">\n    \u003cp>عشر صفحات كل ليلة تكفي لإنهاء كتاب في شهر.\u003c/p>\n    \u003cfooter>— \u003ccite>مجلة القارئ\u003c/cite>\u003c/footer>\n  \u003c/blockquote>\n  \u003cp>نُشر في \u003ctime datetime=\"2026-02-10\">10 فبراير 2026\u003c/time>\u003c/p>\n  \u003caddress>للمراسلة: reader@example.com\u003c/address>\n\u003c/article>","css":""},"en":{"title":"An article excerpt","brief":"Write an excerpt with an h2, a paragraph containing a short quotation inside q, then a standalone blockquote with a paragraph and a cite tag naming the source inside the same blockquote, then an address for contact information, and the publish time inside time with datetime.","steps":["Put q inside a normal paragraph","Write blockquote with a p inside it, then a footer containing cite","Close the excerpt with address and time"],"hint":"cite is the name of the work or author; put it inside the blockquote, not outside."}}],"summary":["الدلالي يقول معنى النص، والبصري يقول شكله فقط","strong وem وmark وdel وins تنقل معنى يقرأه قارئ الشاشة","code وkbd وsamp وvar لكل منها وظيفة تقنية محددة","time وabbr وdfn تضيف معلومات تفهمها الآلة"],"en":{"chapter":"HTML · Text and Semantic Tags","title":"Semantic Text Formatting","subtitle":"Choose the tag that expresses the meaning of the text, not only its look: importance, emphasis, deletion, quotation, time and terms.","level":"Beginner","objectives":["Tell semantic tags from purely visual ones in text","Use strong, em, mark, del and ins in the right places","Mark up code, quotations, definitions and time with suitable tags","Handle mixed-direction text and understand the neutral span"],"summary":["Semantic says what the text means; visual only says how it looks","strong, em, mark, del and ins carry meaning a screen reader can read","code, kbd, samp and var each have a specific technical role","time, abbr and dfn add information machines understand"]}},{"id":"css-01","track":"css","chapter":"CSS · الأساسيات","order":1,"title":"مقدمة CSS وطرق الربط","subtitle":"تكتب قاعدة CSS صحيحة، تربطها بالصفحة بالطريقة المناسبة، وتعرف لماذا يفوز نمط على آخر عند التعارض.","minutes":16,"level":"مبتدئ","objectives":["تفرّق بين المحدِّد والتعريف وتكتب قاعدة CSS بلا أخطاء صياغة","تربط ورقة أنماط بالصفحة بثلاث طرق وتختار الأنسب لكل حالة","تتتبع ترتيب الشلال لتعرف أي قيمة سيطبّقها المتصفح"],"theory":[{"type":"h","text":"لماذا توجد CSS أصلًا؟"},{"type":"p","text":"في مسار HTML بنيت **المعنى**: `h1` عنوان، `p` فقرة، `ul` قائمة، `a` رابط. لكن إن فتحت تلك الصفحة الآن فستراها بخط المتصفح الافتراضي: أسود على أبيض بلا مسافات ولا ترتيب، لأن HTML لا يعرف شيئًا عن الشكل. CSS هي الطبقة التي تقول للمتصفح **كيف** يُعرض هذا المعنى: اللون والحجم والخط والمسافات وموضع كل كتلة."},{"type":"p","text":"الفصل بين البنية والعرض ليس ترفًا: تستطيع تغيير ألوان موقع كامل من ملف واحد دون لمس HTML، ويقرأ قارئ الشاشة ومحرك البحث HTML نظيفًا من دون ضجيج التنسيق، ويستطيع مصمم آخر إعادة بناء المظهر وأنت لم تغيّر حرفًا في المحتوى."},{"type":"compare","left":{"title":"HTML: البنية والمعنى","code":"\u003carticle class=\"card\">\n  \u003ch2>تمر سكري\u003c/h2>\n  \u003cp>45 ر.س\u003c/p>\n\u003c/article>"},"right":{"title":"CSS: الشكل","code":".card {\n  padding: 20px;\n  border: 1px solid #e2e8f0;\n}\n.card h2 {\n  color: #0f172a;\n}"}},{"type":"h","text":"تشريح القاعدة"},{"type":"p","text":"كل تنسيق تكتبه هو **قاعدة** (rule): محدِّد يختار العناصر، ثم كتلة بين `{` و `}` فيها التعريفات. المحدِّد يجيب عن سؤال «من؟»، والكتلة تجيب عن «وماذا عليه أن يصير؟»."},{"type":"code","lang":"css","code":".card {\n  padding: 20px;\n  border: 1px solid #e2e8f0;\n  background: #ffffff;\n}","caption":"قاعدة واحدة: محدِّد واحد وثلاثة تعريفات"},{"type":"list","ordered":true,"items":["**المحدِّد** selector: `.card` يعني كل عنصر يحمل الصنف `card`.","**الكتلة** declaration block: كل ما بين `{` و `}`، ولا تحتوي إلا تعريفات.","**التعريف** declaration: `padding: 20px;` أي خاصية ثم `:` ثم قيمة ثم `;`.","**الفاصلة المنقوطة** الأخيرة اختيارية في CSS، لكن اكتبها دائمًا حتى لا تنساها عند إضافة تعريف جديد."]},{"type":"note","tone":"warn","title":"خطأان يفسدان القاعدة كلها","text":"نسيان `;` بين تعريفين يجعل المتصفح يتجاهل ما بعده، ونسيان `}` يجعل كل ما يأتي بعد القاعدة جزءًا منها. افتح أدوات المطوّر وراقب القاعدة المشطوبة بعلامة صفراء."},{"type":"h","text":"التعليقات"},{"type":"p","text":"التعليق في CSS يبدأ بـ `/*` وينتهي بـ `*/` ولا يُعرض في الصفحة، ويصلح لسطر أو لعدة أسطر. اكتب في التعليق **لماذا** اخترت القيمة أو من أين جاءت، لا مجرد تكرار اسم الخاصية؛ التعليق `/* اللون */` فوق `color` لا يضيف معلومة لأحد."},{"type":"code","lang":"css","code":"/* شريط علوي بلون العلامة التجارية */\n.header {\n  background: #0f766e;\n  /* مؤقتًا: سيُستبدل بصورة عند تصميم الوضع الليلي */\n}\n\n/* لا يوجد تعليق سطري في CSS: // غير صالح */","caption":"التعليقات لا تُطبَّق ولا تظهر في الصفحة"},{"type":"h","text":"ثلاث طرق لربط CSS بالصفحة"},{"type":"table","head":["الطريقة","الشكل","متى تستخدمها"],"rows":[["سطري inline","سمة `style` على العنصر نفسه","اختبار فوري أو بريد HTML؛ لا للمشاريع"],["داخلي internal","`\u003cstyle>` داخل `\u003chead>`","صفحة واحدة أو أنماط حرجة صغيرة"],["خارجي external","`\u003clink rel=\"stylesheet\" href=\"style.css\">`","الاختيار الافتراضي لكل مشروع حقيقي"]]},{"type":"code","lang":"html","code":"\u003c!doctype html>\n\u003chtml lang=\"ar\" dir=\"rtl\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003ctitle>متجر التمور\u003c/title>\n  \u003clink rel=\"stylesheet\" href=\"styles/main.css\">\n\u003c/head>\n\u003cbody>\n  \u003ch1>متجر التمور\u003c/h1>\n\u003c/body>\n\u003c/html>","caption":"الطريقة الخارجية: سطر واحد في head يكفي"},{"type":"p","text":"يمكنك ربط أكثر من ملف بترتيب متتالٍ، مثل ملف تصفير `reset.css` ثم `main.css`؛ وعند التعارض المتساوي يفوز الملف **الأخير**. أما الربط السطري `style=\"color: red\"` فيُكتب على عنصر واحد، ولا يُعاد استخدامه، ولا يُتجاوز إلا بـ `!important` أو ورقة المستخدم؛ ولهذا يتحول المشروع سريعًا إلى فوضى إن اعتمدت عليه."},{"type":"h","text":"‏@import والفرق بينه وبين link"},{"type":"code","lang":"css","code":"/* @import يجب أن يأتي قبل أي قاعدة أخرى */\n@import url(\"base.css\");\n@import url(\"print.css\") print;\n\nbody {\n  font-family: system-ui, sans-serif;\n}","caption":"استيراد ورقة من داخل ورقة"},{"type":"p","text":"`@import` يُحمّل ورقة أنماط من داخل CSS ويعمل فعلًا، لكن المتصفح لا يكتشف الملف المستورد إلا بعد تنزيل الملف الأب ثم تحليله، فتتسلسل الطل
