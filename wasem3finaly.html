بات ويتأخر أول رسم. لذلك `\u003clink>` في `head` أسرع وأوضح، ويُترك `@import` لحالات نادرة مثل ورقة طباعة منفصلة. والخطأ الشائع: كتابته بعد قواعد أخرى فيتجاهله المتصفح بصمت."},{"type":"h","text":"الشلال: من يفوز عند التعارض؟"},{"type":"p","text":"قد تعلن ثلاث قواعد القيمة نفسها لعنصر واحد. المتصفح لا يدمج ولا يرمي خطأً؛ بل يطبّق **الشلال** (cascade): يجمع كل الإعلانات، يرتبها، ثم يترك **قيمة واحدة** لكل خاصية في كل عنصر."},{"type":"list","ordered":true,"items":["**الأصل والأهمية**: `!important` قبل غيره، وأنماط المؤلف قبل أنماط المتصفح الافتراضية.","**الأولوية** (specificity): المحدِّد الأدقّ يفوز، وسنحسبها بالتفصيل في درس المحددات.","**ترتيب الظهور**: عند التساوي الكامل يفوز الإعلان **الأخير** في ترتيب القراءة.","**الوراثة** ليست منافسًا: هي القيمة التي يأخذها العنصر من أبيه حين لا يوجد إعلان خاص به."]},{"type":"code","lang":"css","code":"p { color: #334155; }      /* عنصر: (0,0,1) */\n.note { color: #b45309; }   /* صنف: (0,1,0) يفوز على العنصر */\np.note { color: #1d4ed8; } /* صنف+عنصر: (0,1,1) يفوز على .note */\n.note { color: #15803d; }   /* (0,1,0) لكنه متأخر: يفوز على الأول فقط */","caption":"أربع قواعد، وقيمة واحدة تصل إلى الشاشة"},{"type":"note","tone":"tip","title":"قبل أن تكتب !important","text":"اسأل نفسك: هل يمكنني كتابة محدِّد أدقّ بدلًا منه؟ كل `!important` تحوّل التعديل التالي إلى معركة، وتجعل ورقة الأنماط غير قابلة للتنبؤ بعد أسبوعين."},{"type":"h","text":"كيف يقرأ المتصفح أنماطك؟"},{"type":"p","text":"يقرأ المتصفح HTML فيبني شجرة **DOM**، ويقرأ CSS فيبني شجرة **CSSOM**، ثم يدمجهما في **شجرة العرض** ويحسب لكل عنصر «النمط المحسوب» (computed style). لا يُلوَّن العنصر مرة لكل قاعدة؛ الناتج النهائي كائن واحد فيه قيمة نهائية لكل خاصية، وهو ما تراه في لوحة Styles بأدوات المطوّر."},{"type":"p","text":"التنزيل يحدث مرة واحدة وتُخزَّن الورقة في ذاكرة التخزين المؤقت فتُعاد في كل صفحة وكل زيارة. ولأن CSS **يحجب الرسم**، يؤجل المتصفح أول رسم حتى تجهز الأنماط؛ ولهذا يُفضّل ملف واحد مضغوط على عشرة ملفات صغيرة متتابعة."},{"type":"note","tone":"info","title":"أفضل ممارسة","text":"ملف خارجي واحد يُشار إليه من كل الصفحات: زيارة أولى أبطأ بقليل، وكل زيارة تالية أسرع بكثير، وتعديل واحد يغيّر الموقع كله."},{"type":"terms","items":[{"term":"قاعدة (rule)","desc":"محدِّد ثم كتلة تعريفات بين `{}`."},{"term":"التعريف","desc":"خاصية وقيمة تنتهي بفاصلة منقوطة، مثل `color: #0f766e;`."},{"term":"الشلال (cascade)","desc":"ترتيب المتصفح لكل الإعلانات ليختار قيمة واحدة لكل خاصية."},{"term":"CSSOM","desc":"تمثيل المتصفح لورقة الأنماط بعد تحليلها، ويُدمج مع DOM قبل الرسم."},{"term":"@import","desc":"استيراد ورقة أنماط من داخل CSS؛ أقل كفاءة من `\u003clink>`."}]}],"examples":[{"title":"سطري أم ورقة أنماط؟","prompt":"ما لون الفقرتين في المتصفح؟ ولماذا لم تجعلهما قاعدة `p` أخضر؟","answer":"الأولى حمراء `#dc2626` والثانية رمادية `#64748b`؛ قاعدة `p` خسرت في الحالتين، مرة أمام النمط السطري ومرة أمام الصنف.","explain":"النمط السطري أقوى إعلان في ورقة المؤلف، فيتغلب على أي محدِّد عادي. أما `.muted` فأولويتها (0,1,0) أعلى من `p` ذات (0,0,1)، فتغلبها حتى لو جاءت قبلها في الملف.","html":"\u003cp style=\"color: #dc2626;\">خصم اليوم فقط\u003c/p>\n\u003cp class=\"muted\">الكمية محدودة\u003c/p>","css":"p {\n  color: #0f766e;\n}\n.muted {\n  color: #64748b;\n}","en":{"title":"Inline or stylesheet?","prompt":"What colour are the two paragraphs? And why didn't the `p` rule make them green?","answer":"The first is red `#dc2626` and the second is grey `#64748b`; the `p` rule lost both times, once to the inline style and once to the class.","explain":"An inline style is the strongest declaration in the author sheet, so it beats any ordinary selector. `.muted` has specificity (0,1,0), higher than `p` at (0,0,1), so it wins even if it comes earlier in the file."}},{"title":"من يفوز عند التعارض؟","prompt":"ثلاث قواعد تعلن لون النص للفقرة نفسها. أي لون سيظهر؟","answer":"أزرق `#1d4ed8`؛ لأن `p.note` أولويته (0,1,1) أعلى من `.note` ذات (0,1,0).","explain":"الأولوية تُقارن قبل ترتيب الظهور: الصنف وحده لا يكفي أمام صنف مقترن بعنصر. والقاعدتان الأولى والثالثة متساويتان تمامًا فيفوز الأخير بينهما، لكنهما خسرتا أصلًا أمام `p.note`.","html":"\u003cp class=\"note\">خصم 20% على كل التمور\u003c/p>","css":".note {\n  color: #b45309;\n}\np.note {\n  color: #1d4ed8;\n}\n.note {\n  color: #15803d;\n}","en":{"title":"Who wins in a conflict?","prompt":"Three rules declare the text colour of the same paragraph. Which colour appears?","answer":"Blue `#1d4ed8`, because `p.note` has specificity (0,1,1), higher than `.note` at (0,1,0).","explain":"Specificity is compared before source order: a class alone isn't enough against a class combined with an element. The first and third rules are exactly equal so the later one wins between them, but both lost to `p.note` anyway."}},{"title":"التعليق والقاعدة المكررة","prompt":"لماذا ظهر السعر بلون مختلف عن أول تعريف له؟ وهل أثّر التعليق في شيء؟","answer":"السعر أخضر مزرق `#0f766e` والعنوان `#0f172a`؛ التعليق لم يؤثر لأنه نص يتجاهله المتصفح، والقاعدة الثانية للسعر فازت لورودها لاحقًا.","explain":"القاعدتان `.price` متساويتان في المحدِّد والأولوية، فالحكم لترتيب الظهور. التعليق أداة للقارئ البشري فقط، ووجوده أو حذفه لا يغيّر الناتج على الشاشة.","html":"\u003ch2>عرض الأسبوع\u003c/h2>\n\u003cp class=\"price\">199 ر.س\u003c/p>","css":"/* اللون الأساسي للسعر */\n.price {\n  color: #64748b;\n}\n.price {\n  color: #0f766e;\n}\nh2 {\n  color: #0f172a;\n}","en":{"title":"A comment and a repeated rule","prompt":"Why did the price appear in a different colour than its first declaration? And did the comment affect anything?","answer":"The price is teal `#0f766e` and the heading is `#0f172a`; the comment had no effect because the browser ignores it, and the second price rule won because it comes later.","explain":"The two `.price` rules are equal in selector and specificity, so source order decides. A comment is for the human reader only; keeping or deleting it doesn't change what's on screen."}}],"quiz":[{"q":"لديك موقع من 12 صفحة وتريد توحيد تنسيقها. ما الطريقة الصحيحة؟","options":["سمة style على كل عنصر في كل صفحة","كتلة \u003cstyle> مكررة في كل صفحة","ملف CSS خارجي واحد يُربط بـ \u003clink> في كل صفحة","@import في نهاية كل ورقة"],"answer":2,"explain":"الملف الخارجي يُنزَّل مرة ويُخزَّن مؤقتًا ويُشارَك بين الصفحات، فأي تعديل واحد يسري على الموقع كله، بخلاف التكرار في كل صفحة."},{"q":"في القاعدة `.card { padding: 16px; }` ما هو المحدِّد؟","options":[".card","padding","16px","{ padding: 16px; }"],"answer":0,"explain":"المحدِّد هو ما يقف قبل `{`، وهو هنا الصنف `card`. أما `padding` فخاصية، و`16px` قيمة، وما بين القوسين كتلة تعريفات."},{"q":"قاعدتان لهما المحدِّد نفسه والأولوية نفسها تعلنان `color` لعنصر واحد. أي قيمة تظهر؟","options":["قيمة القاعدة الأولى في الملف","قيمة القاعدة الأخيرة في الملف","القيمة الأقصر","لا تُطبَّق أي قيمة ويظهر تحذير للمستخدم"],"answer":1,"explain":"عند التساوي الكامل في الأصل والأولوية يحكم ترتيب الظهور، فيفوز الإعلان الأخير. والشلال لا يدمج القيم ولا يعرض خطأً للمستخدم."},{"q":"ما وظيفة @import؟","options":["استيراد ورقة أنماط أخرى من داخل CSS","تحويل CSS إلى HTML","إخفاء القاعدة عن المتصفح","ربط ملف JavaScript بالصفحة"],"answer":0,"explain":"`@import` يستورد ورقة أنماط، ويجب أن يتقدم على كل القواعد وإلا تجاهله المتصفح. لكنه يبطئ التحميل لأن اكتشاف الملف يحتاج تحليل الملف الأب، لذا يُفضّل `\u003clink>`."},{"q":"أي عبارة تصف بدقة ما يفعله المتصفح بورقة الأنماط؟","options":["يطبّق كل قاعدة على حدة ويجمع تأثيراتها","يختار لكل خاصية قيمة واحدة بعد ترتيب الإعلانات حسب الشلال","يتجاهل الأنماط الموروثة تمامًا","يحوّل CSS إلى وسوم HTML جديدة"],"answer":1,"explain":"المتصفح يبني CSSOM ثم يحسب لكل عنصر قيمة نهائية واحدة لكل خاصية، لا مجموعة تأثيرات متراكمة. والوراثة جزء من الحساب تظهر في النمط المحسوب."}],"tasks":[{"id":"css-01-t1","title":"انقل التنسيق من العنصر إلى ورقة الأنماط","brief":"البطاقة في المحرر مكتوبة بأنماط سطرية داخل سمات `style`. احذف **كل** سمات `style`، واكتب القواعد في محرر CSS بدلًا منها: للصنف `card` خلفية `#f8fafc` وحدّ `1px solid #e2e8f0` وحشوة `20px`، وللصنف `card-title` حجم خط `20px` ولون `#0f172a`، وللصنف `card-text` لون `#475569`. بعد الحذف لن يظهر أي تنسيق حتى تكتب القواعد.","steps":["احذف سمات style من الوسوم الثلاثة","اكتب `.card` واجمع فيها الخلفية والحد والحشوة","أضف قاعدتي `.card-title` و`.card-text`"],"files":{"html":"\u003cdiv class=\"card\" style=\"background: #f8fafc; border: 1px solid #e2e8f0; padding: 20px;\">\n  \u003ch3 class=\"card-title\" style=\"font-size: 20px; color: #0f172a;\">تمر سكري فاخر\u003c/h3>\n  \u003cp class=\"card-text\" style=\"color: #475569;\">الكرتون 5 كجم — توصيل مجاني داخل المدينة.\u003c/p>\n\u003c/div>","css":"/* ابدأ هنا: لا تنسَ الفاصلة المنقوطة بعد كل تعريف */\n"},"checks":[{"kind":"sourceNot","label":"لم تبقَ أي سمة style","regex":"style\\s*="},{"kind":"cssDecl","label":"قاعدة .card تعلن الخلفية","selector":".card","prop":"background","regex":"#f8fafc"},{"kind":"cssDecl","label":"عنوان البطاقة بحجم 20px","selector":".card-title","prop":"font-size","regex":"20px"},{"kind":"cssDecl","label":"نص البطاقة بلون رمادي","selector":".card-text","prop":"color","regex":"#475569"},{"kind":"computed","label":"الخلفية محسوبة على .card","sel":".card","prop":"background","regex":"#f8fafc|248"}],"hint":"احذف `style=\"...\"` كاملة بعلامات التنصيص، ثم اكتب `.card { ... }` كتلة واحدة تجمع الخصائص الثلاث.","solution":{"html":"\u003cdiv class=\"card\">\n  \u003ch3 class=\"card-title\">تمر سكري فاخر\u003c/h3>\n  \u003cp class=\"card-text\">الكرتون 5 كجم — توصيل مجاني داخل المدينة.\u003c/p>\n\u003c/div>","css":".card {\n  background: #f8fafc;\n  border: 1px solid #e2e8f0;\n  padding: 20px;\n}\n\n.card-title {\n  font-size: 20px;\n  color: #0f172a;\n}\n\n.card-text {\n  color: #475569;\n}\n"},"en":{"title":"Move styling from the element to the stylesheet","brief":"The card in the editor is written with inline `style` attributes. Delete **all** `style` attributes and write the rules in the CSS editor instead: class `card` with background `#f8fafc`, border `1px solid #e2e8f0` and padding `20px`; class `card-title` with font size `20px` and colour `#0f172a`; class `card-text` with colour `#475569`. After deleting, no styling will show until you write the rules.","steps":["Delete the style attributes from the three tags","Write `.card` and put the background, border and padding in it","Add the `.card-title` and `.card-text` rules"],"hint":"Delete the whole `style=\"...\"` including quotes, then write one `.card { ... }` block that holds the three properties."}},{"id":"css-01-t2","title":"بطاقة منتج بثلاث طبقات من المحدِّدات","brief":"نسّق بطاقة المنتج في المحرر بكتابة CSS فقط دون تغيير HTML: اجعل `.product` بحشوة `16px` وحدّ `1px solid #e2e8f0`، وكل عنوان `h3` بلون `#0f172a` وحجم `20px`، والصنف `.price` بلون `#0f766e` ووزن خط `700`، والمعرّف `#note` بلون `#64748b` وحجم `13px`.","steps":["ابدأ بقاعدة `.product` للحاوية","استخدم محدِّد العنصر `h3` للعنوان","أنهِ بالصنف `.price` ثم المعرّف `#note`"],"files":{"html":"\u003c!-- نسّق بكتابة CSS فقط، ولا تغيّر هذا الهيكل -->\n\u003cdiv class=\"product\">\n  \u003ch3>تمر عجوة المدينة\u003c/h3>\n  \u003cp class=\"price\">45 ر.س\u003c/p>\n  \u003cp id=\"note\">السعر شامل ضريبة القيمة المضافة.\u003c/p>\n\u003c/div>","css":"/* نسّق البطاقة هنا */\n"},"checks":[{"kind":"cssDecl","label":"حشوة للحاوية .product","selector":".product","prop":"padding","regex":"\\d+px"},{"kind":"cssDecl","label":"عناوين h3 بلون داكن","selector":"h3","prop":"color","regex":"#0f172a"},{"kind":"cssDecl","label":"السعر بخط عريض","selector":".price","prop":"font-weight","regex":"700|bold"},{"kind":"cssDecl","label":"الملاحظة بلون رمادي","selector":"#note","prop":"color","regex":"#64748b"},{"kind":"cssCount","label":"ثلاث قواعد على الأقل تعلن color","prop":"color","min":3}],"hint":"المعرّف يُكتب بـ `#` ويطابق سمة `id`، والصنف بـ `.`. تذكّر أن أولوية `#note` أعلى من `.price`، لكن لكل منهما عنصر مختلف هنا.","solution":{"html":"\u003cdiv class=\"product\">\n  \u003ch3>تمر عجوة المدينة\u003c/h3>\n  \u003cp class=\"price\">45 ر.س\u003c/p>\n  \u003cp id=\"note\">السعر شامل ضريبة القيمة المضافة.\u003c/p>\n\u003c/div>","css":".product {\n  padding: 16px;\n  border: 1px solid #e2e8f0;\n}\n\nh3 {\n  color: #0f172a;\n  font-size: 20px;\n}\n\n.price {\n  color: #0f766e;\n  font-weight: 700;\n}\n\n#note {\n  color: #64748b;\n  font-size: 13px;\n}\n"},"en":{"title":"A product card with three selector layers","brief":"Style the product card in the editor by writing CSS only, without changing the HTML: give `.product` padding `16px` and border `1px solid #e2e8f0`, every `h3` colour `#0f172a` and size `20px`, class `.price` colour `#0f766e` and font weight `700`, and the id `#note` colour `#64748b` and size `13px`.","steps":["Start with the `.product` rule for the container","Use the element selector `h3` for the heading","Finish with the class `.price` then the id `#note`"],"hint":"An id is written with `#` and matches the `id` attribute, a class with `.`. Remember `#note` has higher specificity than `.price`, but here they target different elements."}}],"summary":["HTML تعطي المعنى وCSS تعطي الشكل، والفصل بينهما هو ما يجعل التعديل والصيانة ممكنين","القاعدة = محدِّد + كتلة تعريفات، وكل تعريف ينتهي بفاصلة منقوطة","الملف الخارجي عبر \u003clink> هو الاختيار الافتراضي، والسطري للاختبار السريع فقط","الشلال يرتب: الأهمية ثم الأولوية ثم ترتيب الظهور، والوراثة ليست منافسًا"],"en":{"chapter":"CSS · Basics","title":"Introduction to CSS and Ways to Link It","subtitle":"Write a correct CSS rule, link it to the page the right way, and know why one style beats another in a conflict.","level":"Beginner","objectives":["Tell a selector from a declaration and write a CSS rule with no syntax errors","Link a stylesheet in three ways and pick the best for each case","Trace the cascade order to know which value the browser applies"],"summary":["HTML gives meaning and CSS gives appearance; separating them makes editing and maintenance possible","Rule = selector + a block of declarations, and each declaration ends with a semicolon","An external file via \u003clink> is the default choice; inline is for quick tests only","The cascade orders: importance, then specificity, then source order; inheritance is not a competitor"]}},{"id":"css-02","track":"css","chapter":"CSS · الأساسيات","order":2,"title":"المحددات الأساسية","subtitle":"تختار بالضبط العنصر الذي تريده — بالصنف أو العلاقة أو السمة — وتعرف مسبقًا أي قاعدة ستكسب عند التعارض.","minutes":18,"level":"مبتدئ","objectives":["تفرّق بين محددات العنصر والصنف والمعرّف وتعرف متى تستخدم كلًا منها","تصل إلى العناصر عبر العلاقات: السليل والابن والأشقاء","تستخدم محددات السمات لتصفية الروابط والحقول دون إضافة أصناف","تحسب أولوية أي محدِّد قبل أن يطبّق المتصفح قواعده"],"theory":[{"type":"h","text":"المحدِّد جملة شرط لا اسمًا"},{"type":"p","text":"المتصفح لا يبحث عن «عنصر الفقرة»؛ بل يمر على شجرة DOM عنصرًا عنصرًا ويسأل: هل يتحقق هذا الشرط؟ إن تحقق، طُبّقت الكتلة. لذلك المحدِّد `.card` ليس اسمًا لشيء، بل شرط «يحمل الصنف card». وفهم ذلك يفسّر أشهر حيرة عند المبتدئ: كتبت القاعدة ولم يُطبَّق شيء، لأن الشرط لم يتحقق على أي عنصر."},{"type":"compare","left":{"title":"HTML: ما كتبته","code":"\u003cul class=\"menu\">\n  \u003cli class=\"item active\">\n    \u003ca href=\"/offers\">العروض\u003c/a>\n  \u003c/li>\n\u003c/ul>"},"right":{"title":"CSS: كيف تخاطبه","code":"ul { list-style: none; }\n.menu { padding: 0; }\n.item.active { font-weight: 700; }\n.menu a { color: #1d4ed8; }"}},{"type":"h","text":"العام `*` والمحدِّد بالعنصر"},{"type":"p","text":"`*` يطابق **كل** عنصر في الصفحة، وأولويته صفر. يُستخدم عادةً لضبط `box-sizing` أو لتصفير هوامش محدودة، وليس لتنسيق المحتوى. أما محدِّد العنصر مثل `p` أو `h2` فيطابق كل وسم من هذا النوع، وهو مفيد للأنماط الأساسية التي تُبنى فوقها الأصناف."},{"type":"code","lang":"css","code":"*, *::before, *::after {\n  box-sizing: border-box;\n}\n\nbody {\n  margin: 0;\n  font-family: system-ui, sans-serif;\n}\n\nh2 {\n  color: #0f172a;\n}","caption":"الأساس أولًا، ثم الأصناف تخصصه"},{"type":"note","tone":"warn","title":"‏* ليست بديلًا عن التفكير","text":"`* { margin: 0; }` تحذف هوامش كل شيء، بما فيها ما تحتاجه للقراءة، ثم تبدأ بإعادة بناء كل مسافة يدويًا. استخدمها لما تُريده فعلًا: `box-sizing` أشهر استخدام مشروع لها."},{"type":"h","text":"الصنف `.class` والمعرّف `#id`"},{"type":"p","text":"الصنف يُعاد استخدامه على عشرات العناصر، ويمكن أن يحمل العنصر عدة أصناف (`class=\"card featured\"`). المعرّف فريد في الصفحة: عنصر واحد فقط يحمله، وأولويته عالية جدًا، ولهذا يُستحسن تركه للربط الداخلي (`#offers`) وللتعامل معه من JavaScript، لا للتنسيق."},{"type":"code","lang":"html","code":"\u003csection id=\"offers\" class=\"panel featured\">\n  \u003ch2 class=\"panel-title\">عروض الجمعة\u003c/h2>\n\u003c/section>","caption":"معرّف واحد للتقسيم، وأصناف متعددة للتنسيق"},{"type":"code","lang":"css","code":".panel { padding: 20px; }\n.panel.featured { border: 2px solid #0f766e; }\n#offers { scroll-margin-top: 80px; }","caption":"الصنف للتنسيق، والمعرّف لسلوك الصفحة"},{"type":"list","items":["الصنف يبدأ بنقطة `.`، والمعرّف بعلامة `#`.","`.panel.featured` تعني عنصرًا يحمل الصنفين معًا، لا أيًّا منهما.","لا تخلط بين `.a .b` (بمسافة: عنصر داخل آخر) و`.a.b` (بلا مسافة: العنصر نفسه)."],"ordered":false},{"type":"h","text":"العلاقات: السليل والابن والأشقاء"},{"type":"p","text":"لغة HTML شجرة، وCSS تسمح بوصف الموقع في الشجرة. السليل (مسافة) يصل إلى أي عمق، والابن `>` يصل إلى الجيل الأول فقط، و`+` يختار الأخ التالي المباشر، و`~` يختار كل الأشقاء التالين."},{"type":"table","head":["المحدِّد","ماذا يختار"],"rows":[["`article p`","كل فقرة داخل article، حتى لو كانت داخل أقسام أعمق"],["`article > p`","الفقرة التي أبيها المباشر article فقط"],["`h2 + p`","الفقرة الأولى التي تأتي **مباشرة** بعد h2"],["`h2 ~ p`","كل الفقرات اللاحقة لـ h2 ولو فصل بينها عنصر"],["`h1, h2, h3`","ثلاثة محددات في قاعدة واحدة، ولكل منها أولويته"]]},{"type":"code","lang":"css","code":".article > p { margin-block: 1em; }\n.article p a { text-decoration: underline; }\nh2 + p { font-size: 1.1rem; color: #475569; }\nh2 ~ figure { margin-top: 24px; }","caption":"أربع علاقات في أربع قواعد"},{"type":"note","tone":"warn","title":"السليل يصل إلى العمق كله","text":"`ul li` تطابق أيضًا عناصر القوائم المتداخلة، فتصبغ المستوى الثالث بلا قصد. إن أردت المستوى الأول فقط فاكتب `ul > li`."},{"type":"h","text":"محددات السمات"},{"type":"p","text":"أحيانًا لا تحتاج صنفًا جديدًا؛ فقيمة السمة نفسها تحمل المعلومة. تريد تمييز الروابط الخارجية؟ `a[href^=\"https\"]`. تريد تمييز ملفات PDF؟ `a[href$=\".pdf\"]`. هذه المحددات تصف **المعنى** الموجود في HTML أصلًا، وتُبقي الوسم نظيفًا."},{"type":"table","head":["الصيغة","تطابق عنصرًا"],"rows":[["`[disabled]`","يملك السمة، أيا كانت قيمتها"],["`[type=\"email\"]`","قيمة السمة تساوي email تمامًا"],["`[href^=\"https\"]`","القيمة تبدأ بـ https"],["`[href$=\".pdf\"]`","القيمة تنتهي بـ .pdf"],["`[class*=\"btn\"]`","القيمة تحتوي btn في أي موضع"],["`[class~=\"btn\"]`","إحدى الكلمات المفصولة بمسافة تساوي btn بالضبط"],["`[lang|=\"ar\"]`","القيمة ar، أو تبدأ بـ ar- مثل ar-SA"]]},{"type":"code","lang":"css","code":"a[target=\"_blank\"] { font-weight: 700; }\na[href^=\"https://\"] { color: #1d4ed8; }\na[href$=\".pdf\"] { color: #b91c1c; }\n[class*=\"btn\"] { border-radius: 6px; }\n[lang|=\"ar\"] { direction: rtl; }","caption":"خمس قواعد بلا صنف واحد"},{"type":"p","text":"قيم السمات حسّاسة لحالة الأحرف عمومًا: `[href$=\".PDF\"]` لا يطابق `guide.pdf`. يمكنك تجاهل الحالة بإضافة `i` بعد القيمة: `[href$=\".pdf\" i]`. وتذكّر أن `~=` تعني «كلمة كاملة»، فلا تخلطها بـ `*=` التي تعني «جزء من النص»."},{"type":"h","text":"الأولوية: كيف يحسبها المتصفح؟"},{"type":"p","text":"لكل محدِّد ثلاثة أعمدة: عدد المعرّفات، عدد الأصناف والسمات والحالات الزائفة، عدد العناصر والعناصر الزائفة. تقارن الأعمدة من اليسار إلى اليمين كأنها ثلاثة أرقام منفصلة، لا رقمًا واحدًا في نظام عشري؛ فـ (0,1,0) أقوى من (0,0,99) مهما كثرت العناصر، و(1,0,0) تقهر أي عدد من الأصناف."},{"type":"table","head":["المحدِّد","معرّفات","أصناف/سمات/حالات","عناصر","الأولوية"],"rows":[["`*`","0","0","0","(0,0,0)"],["`li`","0","0","1","(0,0,1)"],["`ul li`","0","0","2","(0,0,2)"],["`.card`","0","1","0","(0,1,0)"],["`a:hover`","0","1","1","(0,1,1)"],["`#nav .item`","1","1","0","(1,1,0)"],["`#nav .item a`","1","1","1","(1,1,1)"]]},{"type":"code","lang":"css","code":"/* (0,0,1) */\np { color: #334155; }\n\n/* (0,1,0) يفوز */\n.intro { color: #0f766e; }\n\n/* (0,1,1) يفوز على الاثنين */\np.intro { color: #b91c1c; }\n\n/* (1,0,0) يقهر الجميع هنا */\n#summary { color: #0f172a; }","caption":"نفس العنصر، أربع أولويات"},{"type":"note","tone":"info","title":"الفاصلة لا تجمع الأولوية","text":"في `h1, h2 { color: teal; }` تُعامَل كل قائمة كأنها قاعدة مستقلة؛ `h1` بأولوية (0,0,1) و`h2` كذلك. الفاصلة تختصر الكتابة فقط ولا ترفع الأولوية."},{"type":"h","text":"تسمية الأصناف"},{"type":"p","text":"اسم الصنف عقد بين HTML وCSS، ويُقرأ أكثر مما يُكتب. اجعله يصف **الدور** لا المظهر: لو غيّرت الأحمر إلى أزرق غدًا، فالاسم `red-box` يصبح كذبة، أما `alert` فيبقى صحيحًا."},{"type":"list","items":["أحرف لاتينية صغيرة وأرقام وشرطة: `product-card` أو `productCard`، وثبّت على نمط واحد.","لا تبدأ برقم ولا تضع مسافة أو حرفًا عربيًا داخل الاسم.","صف الدور: `alert`, `checkout-btn`, `price-tag`، لا `big-red-thing`.","صنف أساسي واحد + أصناف مساعدة صغيرة أفضل من صنف طويل يخلط كل شيء."],"ordered":false},{"type":"note","tone":"tip","title":"اختبار سريع للتسمية","text":"لو احتاج مصمم جديد إلى معرفة وظيفة العنصر من اسمه وحده، فالتسمية ناجحة. وإن احتاج أن يفتح CSS ليعرف، فأعد التفكير في الاسم."},{"type":"terms","items":[{"term":"محدِّد السليل","desc":"مسافة بين محدِّدين تعني «داخل»، وتصل إلى أي عمق."},{"term":"الابن المباشر `>`","desc":"يختار الجيل الأول فقط تحت الأب."},{"term":"الأولوية (specificity)","desc":"ثلاثة أعمدة: معرّفات، ثم أصناف/سمات/حالات، ثم عناصر."},{"term":"`[attr^=]` و`[attr$=]`","desc":"بداية القيمة ونهايتها؛ و`*=` تحتوي، و`~=` كلمة كاملة."}]}],"examples":[{"title":"‏* تطابق كل شيء ولا تفوز على شيء","prompt":"ما لون عناصر القائمة الثلاثة؟ ولماذا لم تُصبغ بلون القاعدة العامة `*`؟","answer":"الثلاثة بلون `#0f766e` إلا «العروض» فأحمر `#b91c1c`؛ قاعدة `*` طابقت كل عنصر لكنها خسرت أمام كل قاعدة أخرى.","explain":"`*` أولويتها (0,0,0)، فأي محدِّد عنصر مثل `li` يتفوق عليها، والصنف `.active` يتفوق على الاثنين. كثرة المطابقة لا تعني قوة القاعدة.","html":"\u003cul class=\"menu\">\n  \u003cli>الرئيسية\u003c/li>\n  \u003cli class=\"active\">العروض\u003c/li>\n  \u003cli>اتصل بنا\u003c/li>\n\u003c/ul>","css":"* {\n  color: #334155;\n}\nli {\n  color: #0f766e;\n}\n.active {\n  color: #b91c1c;\n}","en":{"title":"* matches everything and wins against nothing","prompt":"What colour are the three list items? And why weren't they painted with the universal `*` rule's colour?","answer":"All three are `#0f766e` except «العروض», which is red `#b91c1c`; the `*` rule matched every element but lost to every other rule.","explain":"`*` has specificity (0,0,0), so any element selector such as `li` beats it, and the class `.active` beats both. Matching a lot doesn't mean a rule is strong."}},{"title":"السليل أم الابن؟","prompt":"أي العناصر يصير أخضر؟ وأيها رمادي؟ وأيها عريض؟","answer":"عنصرا المستوى الأول أخضران، والعنصر المتداخل «خصم 10%» رمادي، والثلاثة عريضة.","explain":"`.list > li` تطابق الجيل الأول فقط (عنصرين)، بينما `.list li` تطابق أيضًا `li` داخل القائمة المتداخلة. أي أن العريض وصل إلى العمق كله. ولولا قاعدة `.list ul` لورث العنصر الداخلي الأخضر عن أبيه؛ لكن القائمة الداخلية أعلنت لونها الخاص فقطعت سلسلة الوراثة.","html":"\u003cul class=\"list\">\n  \u003cli>عروض الصيف\n    \u003cul>\n      \u003cli>خصم 10%\u003c/li>\n    \u003c/ul>\n  \u003c/li>\n  \u003cli>وصل حديثًا\u003c/li>\n\u003c/ul>","css":".list > li {\n  color: #0f766e;\n}\n.list ul {\n  color: #64748b;\n}\n.list li {\n  font-weight: 700;\n}","en":{"title":"Descendant or child?","prompt":"Which items become green? Which are grey? Which are bold?","answer":"The two first-level items are green, the nested item «خصم 10%» is grey, and all three are bold.","explain":"`.list > li` matches only the first generation (two items), while `.list li` also matches the `li` inside the nested list, so bold reached all depths. Without the `.list ul` rule the inner item would inherit green from its parent; but the inner list declared its own colour and cut the inheritance chain."}},{"title":"وسم الروابط بلا أصناف","prompt":"أي رابط سيظهر عريضًا؟ وأيها أحمر؟ وأيها بلا خط تحت؟","answer":"الرابط الخارجي عريض وأزرق، ورابط PDF أحمر، ورابط البريد بلا خط تحت. الرابط الداخلي بقي على حاله الافتراضية.","explain":"كل قاعدة تختبر جزءًا من قيمة السمة: `^=` بداية القيمة، و`$=` نهايتها. رابط PDF لا يبدأ بـ https فلا يصير عريضًا، لكن قاعدته الخاصة للون تفوز على قاعدة `a` العامة.","html":"\u003cp>\u003ca href=\"https://example.com\">موقع خارجي\u003c/a>\u003c/p>\n\u003cp>\u003ca href=\"/files/guide.pdf\">دليل المشتري\u003c/a>\u003c/p>\n\u003cp>\u003ca href=\"mailto:info@shop.sa\">راسلنا\u003c/a>\u003c/p>","css":"a {\n  color: #1d4ed8;\n}\na[href^=\"https://\"] {\n  font-weight: 700;\n}\na[href$=\".pdf\"] {\n  color: #b91c1c;\n}\na[href^=\"mailto:\"] {\n  text-decoration: none;\n}","en":{"title":"Marking links without classes","prompt":"Which link is bold? Which is red? Which has no underline?","answer":"The external link is bold and blue, the PDF link is red, and the email link has no underline. The internal link stays at its default look.","explain":"Each rule tests part of the attribute value: `^=` is the start of the value, `$=` is its end. The PDF link doesn't start with https so it isn't bold, but its own colour rule beats the general `a` rule."}}],"quiz":[{"q":"أي محدِّد يختار عناصر `li` المباشرة فقط داخل `.menu`؟","options":[".menu li",".menu > li",".menu + li",".menu ~ li"],"answer":1,"explain":"علامة `>` تعني الابن المباشر (الجيل الأول). أما المسافة فتصل إلى أي عمق، و`+` و`~` تخصّان الأشقاء لا الأبناء."},{"q":"ماذا يختار `h2 ~ p`؟","options":["كل فقرة تأتي بعد h2 داخل الأب نفسه","الفقرة التالية لـ h2 مباشرة فقط","كل فقرة داخل h2","الفقرات التي تسبق h2"],"answer":0,"explain":"‏`~` هي الأخ العام: تختار كل الأشقاء اللاحقين المطابقين، ولو فصل بينها عناصر أخرى. التالي المباشر فقط يُكتب بـ `h2 + p`."},{"q":"ما الذي يختاره `a[href$=\".pdf\"]`؟","options":["الروابط التي تنتهي قيمتها بـ .pdf","الروابط التي تبدأ بـ .pdf","الروابط التي تحتوي .pdf في أي موضع","كل الروابط لأن href سمة موجودة"],"answer":0,"explain":"‏`$=` تختبر نهاية القيمة. البداية `^=`، والاحتواء في أي موضع `*=`. وجود السمة وحده يُكتب `[href]`."},{"q":"ما أولوية المحدِّد `#header .nav a`؟","options":["(0,1,1)","(1,1,1)","(0,2,1)","(1,0,0)"],"answer":1,"explain":"معرّف واحد (`#header`)، صنف واحد (`.nav`)، عنصر واحد (`a`)؛ فالناتج (1,1,1) ويُقرأ كثلاثة أعمدة مستقلة لا كرقم واحد."},{"q":"ماذا تفعل الفاصلة في `h1, h2 { color: teal; }`؟","options":["تجمع المحدِّدين في قاعدة واحدة تُطبَّق على كل منهما","تعني أن h2 داخل h1","ترفع الأولوية إلى مستوى المعرّف","تلغي القاعدة إن لم يوجد h2"],"answer":0,"explain":"هي اختصار للكتابة فقط؛ تُعامَل كل قائمة كقاعدة مستقلة بأولويتها الخاصة، ولا ترفع الأولوية ولا تنشئ علاقة بين العنصرين."}],"tasks":[{"id":"css-02-t1","title":"قائمة تنقل بلا أصناف زائدة","brief":"نسّق قائمة التنقل في المحرر باستخدام `.menu` فقط كصنف على الحاوية، دون إضافة أصناف جديدة إلى `li` أو `a` (العنصر النشط يحمل الصنف `active` أصلًا). المطلوب: `.menu ul` بلا نقاط (`list-style: none`) وبحشوة `0` وعرض `flex`، و`.menu a` بلا خط تحت وبلون `#1d4ed8`، و`.menu .active a` بلون `#b91c1c` ووزن خط `700`.","steps":["ابدأ بـ `.menu ul` لتصفير القائمة وتحويلها إلى صف","نسّق كل الروابط بقاعدة `.menu a`","خصص العنصر النشط بـ `.menu .active a`"],"files":{"html":"\u003c!-- لا تضف أصنافًا: استخدم العلاقات بين العناصر -->\n\u003cnav class=\"menu\">\n  \u003cul>\n    \u003cli>\u003ca href=\"/\">الرئيسية\u003c/a>\u003c/li>\n    \u003cli class=\"active\">\u003ca href=\"/offers\">العروض\u003c/a>\u003c/li>\n    \u003cli>\u003ca href=\"/contact\">اتصل بنا\u003c/a>\u003c/li>\n  \u003c/ul>\n\u003c/nav>","css":"/* اكتب المحدِّدات العلائقية هنا */\n"},"checks":[{"kind":"cssDecl","label":"قائمة .menu في صف أفقي","selector":".menu ul","prop":"display","regex":"flex"},{"kind":"cssDecl","label":"روابط بلا خط تحت","selector":".menu a","prop":"text-decoration","regex":"none"},{"kind":"cssDecl","label":"الرابط النشط بخط عريض","selector":".menu .active a","prop":"font-weight","regex":"700|bold"},{"kind":"cssCount","label":"قاعدتان على الأقل تعلنان color","prop":"color","min":2},{"kind":"selector","label":"ثلاثة عناصر li في القائمة","sel":".menu li","min":3}],"hint":"المسافة تعني «داخل»: `.menu a` تصل إلى الروابط في العمق. ولتمييز العنصر النشط استخدم `.menu .active a` لا `.active a` وحدها.","solution":{"html":"\u003cnav class=\"menu\">\n  \u003cul>\n    \u003cli>\u003ca href=\"/\">الرئيسية\u003c/a>\u003c/li>\n    \u003cli class=\"active\">\u003ca href=\"/offers\">العروض\u003c/a>\u003c/li>\n    \u003cli>\u003ca href=\"/contact\">اتصل بنا\u003c/a>\u003c/li>\n  \u003c/ul>\n\u003c/nav>","css":".menu ul {\n  list-style: none;\n  padding: 0;\n  display: flex;\n  gap: 16px;\n}\n\n.menu a {\n  color: #1d4ed8;\n  text-decoration: none;\n}\n\n.menu .active a {\n  color: #b91c1c;\n  font-weight: 700;\n}\n"},"en":{"title":"A nav menu with no extra classes","brief":"Style the navigation menu in the editor using `.menu` only as the class on the container, without adding new classes to `li` or `a` (the active item already has the class `active`). Required: `.menu ul` with no bullets (`list-style: none`), padding `0` and `flex` display; `.menu a` with no underline and colour `#1d4ed8`; `.menu .active a` with colour `#b91c1c` and font weight `700`.","steps":["Start with `.menu ul` to reset the list and turn it into a row","Style all links with the `.menu a` rule","Customize the active item with `.menu .active a`"],"hint":"A space means “inside”: `.menu a` reaches the links at any depth. To mark the active item use `.menu .active a`, not `.active a` alone."}},{"id":"css-02-t2","title":"تمييز الروابط بالسمة لا بالصنف","brief":"في المحرر أربعة روابط مختلفة. دون إضافة أي صنف جديد، ميّزها بمحددات السمات: `nav a` بلون `#1d4ed8` وبلا خط تحت، والروابط التي تبدأ بـ `https://` بوزن خط `700`، والتي تنتهي بـ `.pdf` بلون `#b91c1c`، والتي تبدأ بـ `mailto:` بحد سفلي `2px solid #0f766e`.","steps":["ابدأ بقاعدة `nav a` العامة","أضف `a[href^=\"https://\"]` للسعر العريض","أكمل بـ `a[href$=\".pdf\"]` و`a[href^=\"mailto:\"]`"],"files":{"html":"\u003c!-- لا تضف أصنافًا: استخدم محددات السمات -->\n\u003cnav class=\"links\">\n  \u003ca href=\"https://developer.mozilla.org\">مرجع MDN\u003c/a>\n  \u003ca href=\"/files/catalog.pdf\">كتالوج المنتجات\u003c/a>\n  \u003ca href=\"mailto:sales@dates.sa\">مراسلة المبيعات\u003c/a>\n  \u003ca href=\"#offers\">العروض\u003c/a>\n\u003c/nav>","css":"/* استخدم محددات السمات: [href^=] و[href$=] */\n"},"checks":[{"kind":"cssDecl","label":"روابط بلا خط تحت","selector":"nav a","prop":"text-decoration","regex":"none"},{"kind":"cssDecl","label":"الروابط الخارجية عريضة","selector":"a[href^=\"https://\"]","prop":"font-weight","regex":"700|bold"},{"kind":"cssDecl","label":"ملفات PDF بلون مميز","selector":"a[href$=\".pdf\"]","prop":"color","regex":"#b91c1c"},{"kind":"cssDecl","label":"روابط البريد بحد سفلي","selector":"a[href^=\"mailto:\"]","prop":"border-bottom","regex":"2px"},{"kind":"cssCount","label":"قاعدتان على الأقل تعلنان color","prop":"color","min":2}],"hint":"ضع القيمة بين علامتي تنصيص داخل القوسين: `a[href$=\".pdf\"]`. وبدون علامات تنصيص تعمل القيم البسيطة أيضًا، لكن التنصيص أوضح وأأمن.","solution":{"html":"\u003cnav class=\"links\">\n  \u003ca href=\"https://developer.mozilla.org\">مرجع MDN\u003c/a>\n  \u003ca href=\"/files/catalog.pdf\">كتالوج المنتجات\u003c/a>\n  \u003ca href=\"mailto:sales@dates.sa\">مراسلة المبيعات\u003c/a>\n  \u003ca href=\"#offers\">العروض\u003c/a>\n\u003c/nav>","css":"nav a {\n  color: #1d4ed8;\n  text-decoration: none;\n}\n\na[href^=\"https://\"] {\n  font-weight: 700;\n}\n\na[href$=\".pdf\"] {\n  color: #b91c1c;\n}\n\na[href^=\"mailto:\"] {\n  border-bottom: 2px solid #0f766e;\n}\n"},"en":{"title":"Marking links by attribute, not class","brief":"The editor has four different links. Without adding any new class, tell them apart with attribute selectors: `nav a` with colour `#1d4ed8` and no underline, links starting with `https://` with font weight `700`, links ending in `.pdf` with colour `#b91c1c`, and links starting with `mailto:` with a bottom border `2px solid #0f766e`.","steps":["Start with the general `nav a` rule","Add `a[href^=\"https://\"]` for the bold weight","Finish with `a[href$=\".pdf\"]` and `a[href^=\"mailto:\"]`"],"hint":"Put the value between quotes inside the brackets: `a[href$=\".pdf\"]`. Simple values work without quotes too, but quotes are clearer and safer."}}],"summary":["المحدِّد شرط يمر عليه المتصفح عنصرًا عنصرًا، لا اسمًا لشيء","الصنف للتنسيق القابل لإعادة الاستخدام، والمعرّف لسلوك فريد في الصفحة","المسافة تعني أي عمق، و> تعني الجيل الأول، و+/~ تخصّان الأشقاء","محددات السمات تصف المعنى الموجود في HTML بلا أصناف إضافية","الأولوية ثلاثة أعمدة تُقارن من اليسار لليمين، لا رقم واحد"],"en":{"chapter":"CSS · Basics","title":"Basic Selectors","subtitle":"Pick exactly the element you want — by class, relationship or attribute — and know in advance which rule will win in a conflict.","level":"Beginner","objectives":["Tell element, class and id selectors apart and know when to use each","Reach elements through relationships: descendant, child and siblings","Use attribute selectors to filter links and fields without adding classes","Calculate any selector's specificity before the browser applies the rules"],"summary":["A selector is a condition the browser tests on each element, not a name for something","A class is for reusable styling, an id for unique behaviour on the page","A space means any depth, > means the first generation, and +/~ concern siblings","Attribute selectors describe the meaning already in HTML without extra classes","Specificity is three columns compared left to right, not a single number"]}},{"id":"css-03","track":"css","chapter":"CSS · الأساسيات","order":3,"title":"المحددات الزائفة والعناصر الزائفة","subtitle":"تنسّق العنصر في حالته وفي أجزائه التي لا وجود لها في HTML: عند المرور، عند التركيز، الصفوف الفردية، والنقطة قبل النص.","minutes":22,"level":"متوسط","objectives":["تفرّق بين الحالة الزائفة `:` والعنصر الزائف `::` وتستخدم كليهما في موضعه","تنسّق حالات التفاعل والنماذج دون أن تُفسد تجربة لوحة المفاتيح","تصل إلى العناصر بالموقع بين أخوتها وبـ nth-child بأنماط an+b","تستخدم :is و:where و:has وتعرف أثر كل منها على الأولوية"],"theory":[{"type":"h","text":"نقطتان أم أربع؟"},{"type":"p","text":"هذه المحددات تحل مشكلة لا تحلها الأصناف: الحالة أو الجزء لا وجود له في HTML. لا تستطيع كتابة `class=\"hover\"` على عنصر لأن الحالة تتبدل مئة مرة في الثانية، ولا تستطيع إضافة وسم للنقطة التي تسبق نصًا لأنها ليست عنصرًا في الشجرة. النقطتان `:` للحالة (pseudo-class)، والأربع `::` للجزء (pseudo-element)."},{"type":"compare","left":{"title":"HTML: لا شيء يصف الحالة","code":"\u003cbutton class=\"btn\">أضف إلى السلة\u003c/button>\n\u003cp class=\"note\">السعر شامل الضريبة\u003c/p>"},"right":{"title":"CSS: الحالة والجزء","code":".btn:hover { background: #115e59; }\n.btn:focus-visible { outline: 3px solid #5eead4; }\n.note::before { content: \"* \"; }"}},{"type":"h","text":"حالات التفاعل"},{"type":"table","head":["الحالة","متى تنطبق"],"rows":[["`:hover`","المؤشر فوق العنصر (لا وجود لها على شاشة اللمس وحدها)"],["`:focus`","العنصر يستقبل التركيز: نقرة، أو Tab، أو برمجة"],["`:focus-visible`","التركيز جاء من لوحة المفاتيح أو يحتاج مؤشرًا واضحًا"],["`:active`","اللحظة التي يُضغط فيها العنصر"],["`:visited`","رابط زاره المستخدم سابقًا"]]},{"type":"code","lang":"css","code":".btn {\n  background: #0f766e;\n  color: #ffffff;\n}\n.btn:hover { background: #115e59; }\n.btn:active { transform: translateY(1px); }\n.btn:focus-visible {\n  outline: 3px solid #5eead4;\n  outline-offset: 2px;\n}","caption":"الحالة تُضاف إلى المحدِّد لا إلى الوسم"},{"type":"note","tone":"warn","title":"‏:visited ليست أداة تتبع","text":"المتصفح يقيّد ما يمكن تغييره في الرابط المزار إلى خصائص الألوان وبعض خصائص الرسم، ولا يسمح بقراءة `getComputedStyle` للون الزيارة. هذا حماية لخصوصية المستخدم، فلا تبنِ على `:visited` أي منطق."},{"type":"h","text":"حالات النماذج"},{"type":"table","head":["الحالة","تنطبق على"],"rows":[["`:checked`","مربع اختيار أو زر راديو محدد"],["`:disabled`","حقل معطّل لا يقبل التفاعل"],["`:enabled`","حقل قابل للتفاعل"],["`:required`","حقل مطلوب (يحمل السمة required)"],["`:invalid`","قيمة الحقل لا تحقق شروط التحقق الحالية"],["`:placeholder-shown`","الحقل يعرض نصه الإرشادي، أي أنه فارغ"]]},{"type":"code","lang":"css","code":"input:focus { border-color: #0f766e; }\ninput:required { border-inline-start: 3px solid #b91c1c; }\ninput:invalid:not(:placeholder-shown) { border-color: #b91c1c; }\ninput:disabled { background: #f1f5f9; color: #94a3b8; }\ninput[type=\"checkbox\"]:checked + label { font-weight: 700; }","caption":"تنسيق الحقل حسب حالته الحقيقية"},{"type":"note","tone":"tip","title":"فخ :invalid عند فتح الصفحة","text":"الحقل المطلوب الفارغ غير صالح من اللحظة الأولى، فيظهر إطار أحمر قبل أن يكتب المستخدم حرفًا. الحل الشائع: `input:invalid:not(:placeholder-shown)` أي «غير صالح **و** ليس فارغًا»، أو استخدام `:user-invalid` حيث يدعمه المتصفح."},{"type":"h","text":"المحددات البنيوية"},{"type":"p","text":"هذه المحددات لا تنظر إلى الصنف بل إلى **الموقع** بين الأخوة. `:first-child` يعني «أول ابن لأبيه»، لا «أول عنصر من نوعه»، وهذا أشهر التباس في CSS: `p:first-child` لا تطابق شيئًا إذا سبق الفقرةَ عنوانٌ داخل الأب نفسه."},{"type":"code","lang":"css","code":"li:first-child { border-top: 0; }\nli:last-child { border-bottom: 0; }\nli:only-child { margin: 0 auto; }\n\n/* الأنماط an+b */\ntr:nth-child(odd) { background: #f8fafc; }\ntr:nth-child(even) { background: #f1f5f9; }\ntr:nth-child(3n) { color: #0f766e; }\ntr:nth-child(2n + 1) { border-top: 1px solid #e2e8f0; }\n\np:nth-of-type(2) { font-weight: 700; }","caption":"الموقع بين الأخوة يحدد المطابقة"},{"type":"table","head":["الصيغة","تختار"],"rows":[["`odd` = `2n+1`","الفردي: 1، 3، 5…"],["`even` = `2n`","الزوجي: 2، 4، 6…"],["`3n`","كل ثالث: 3، 6، 9…"],["`2n+3`","بدءًا من الثالث ثم كل ثاني: 3، 5، 7…"],["`-n+3`","أول ثلاثة عناصر فقط"]]},{"type":"note","tone":"warn","title":"‏:nth-child أم :nth-of-type؟","text":"`nth-child` يعدّ **كل** الأخوة، و`nth-of-type` يعدّ أخوة الوسم نفسه فقط. في حاوية فيها `h2` ثم ثلاث فقرات: `p:nth-child(2)` تطابق الفقرة الأولى، أما `p:nth-of-type(2)` فتطابق الثانية."},{"type":"h","text":"‏:not و:is و:where و:has"},{"type":"p","text":"هذه الأربع تعمل كدوال تأخذ محددات كوسائط. `:not()` تستثني، و`:is()` تختصر قائمة بدائل، و`:where()` مثل `:is` لكن بأولوية صفر، و`:has()` تختار الأب بناءً على ما يحتويه — أي أنها تنظر إلى أسفل الشجرة بعد أن كانت CSS تنظر إلى أعلى فقط."},{"type":"code","lang":"css","code":"/* استثناء */\nli:not(:last-child) { border-bottom: 1px solid #e2e8f0; }\n\n/* اختصار بدائل */\n:is(h1, h2, h3) + p { margin-top: 0; }\n\n/* نفس الاختصار بأولوية صفر */\n:where(h1, h2, h3) { margin-block: 1.5em 0.5em; }\n\n/* الأب الذي يحتوي على شيء */\n.card:has(img) { padding: 0; }\n.card:has(.badge) { border-color: #0f766e; }","caption":"أربع أدوات لوصف شروط مركّبة"},{"type":"p","text":"الفرق العملي بين `:is` و`:where` هو الأولوية وحدها. `:is(.a, #b)` تأخذ أولوية **أقوى** وسيط داخلها، أي (1,0,0) هنا، وقد تفاجئك. أما `:where(...)` فأولويتها (0,0,0) دائمًا، ولهذا تُستخدم في أنماط الأساس والتصفير حيث تريد أن يسهل تجاوزها لاحقًا."},{"type":"table","head":["الصيغة","الأولوية","الاستخدام"],"rows":[["`:is(.a, #b)`","(1,0,0)","اختصار قوائم مع الحفاظ على قوة المحدد"],["`:where(.a, #b)`","(0,0,0)","أنماط أساس يسهل تجاوزها"],["`:not(.a)`","أولوية الوسيط","استثناء عنصر من قاعدة"],["`:has(.a)`","أولوية الوسيط","تنسيق الأب حسب محتواه"]]},{"type":"h","text":"العناصر الزائفة"},{"type":"p","text":"العنصر الزائف ينشئ **جزءًا** من العنصر يمكن تنسيقه. `::before` و`::after` ينشئان صندوقًا داخل العنصر قبل محتواه وبعده، ولا يظهران إلا إذا أعلنت `content` ولو فارغًا `content: \"\"`؛ وهما في السلوك `inline` افتراضيًا حتى تغيّر `display`."},{"type":"table","head":["العنصر الزائف","ماذا يمثّل"],"rows":[["`::before`","محتوى يُدرج قبل محتوى العنصر"],["`::after`","محتوى يُدرج بعد محتوى العنصر"],["`::first-letter`","الحرف الأول من الكتلة، لتنسيق الاستهلال"],["`::first-line`","السطر الأول كما يراه المتصفح بعد التنسيق"],["`::selection`","النص الذي حدده المستخدم"],["`::placeholder`","نص `placeholder` داخل الحقل"],["`::marker`","النقطة أو الرقم في عنصر القائمة"],["`::file-selector-button`","زر اختيار الملف في `input type=\"file\"`"]]},{"type":"code","lang":"css","code":"blockquote::before {\n  content: \"”\";\n  font-size: 40px;\n  color: #0f766e;\n}\n\np::first-letter { font-size: 1.6em; font-weight: 700; }\np::first-line { letter-spacing: 0.02em; }\n::selection { background: #99f6e4; }\ninput::placeholder { color: #94a3b8; }\nli::marker { color: #0f766e; }\ninput[type=\"file\"]::file-selector-button {\n  padding: 8px 14px;\n  border: 0;\n  border-radius: 6px;\n  background: #0f766e;\n  color: #fff;\n}","caption":"أجزاء لا وجود لها في HTML، لكنها قابلة للتنسيق"},{"type":"note","tone":"info","title":"‏content للنص الزخرفي فقط","text":"المحتوى الذي تضيفه `::before` و`::after` لا يدخل في النص المنسوخ ولا تقرأه معظم قارئات الشاشة. لا تستخدمه لرسائل مهمة أو لعلامات إلزامية، بل استخدم HTML حقيقيًا."},{"type":"terms","items":[{"term":"حالة زائفة `:`","desc":"تنسّق عنصرًا موجودًا في حالة معينة مثل `:hover` و`:checked`."},{"term":"عنصر زائف `::`","desc":"ينشئ جزءًا من العنصر يمكن تنسيقه مثل `::before` و`::marker`."},{"term":"‏an+b","desc":"نمط عدّ في `nth-child`: `2n` الزوجي، `2n+1` الفردي، `3n` كل ثالث."},{"term":"‏:where() بأولوية صفر","desc":"مثل `:is` لكنها لا تزيد الأولوية، فتُستخدم لأنماط الأساس."},{"term":"‏:has()","desc":"تختار الأب حسب ما يحتويه من عناصر، عكس اتجاه البحث المعتاد."}]}],"examples":[{"title":"الماوس ولوحة المفاتيح","prompt":"ما الذي يتغير عند مرور الماوس، وما الذي يتغير عند الوصول بـ Tab؟ ولماذا لم نستخدم `:focus` وحدها؟","answer":"بالماوس يتغير لون الخلفية فقط. بالوصول بـ Tab يتغير اللون أيضًا ويظهر إطار خارجي بلون فاتح. استخدمنا `:focus-visible` ليظهر الإطار لمن يتنقل بلوحة المفاتيح دون أن يظهر عند النقر بالماوس.","explain":"`:focus` تنطبق على أي تركيز، بما فيه النقرة، فيظهر الإطار لكل من ينقر بالماوس ويراه تشويشًا. `:focus-visible` يترك القرار للمتصفح: يعرض المؤشر حين يكون التركيز قادمًا من لوحة المفاتيح أو حين يحتاجه المستخدم فعلًا. لاحظ أن الترتيب مهم: قاعدة الحالة تأتي بعد القاعدة الأساسية وإلا غلبها اللون الأساسي عند التساوي.","html":"\u003cbutton class=\"btn\">أضف إلى السلة\u003c/button>\n\u003ca class=\"btn\" href=\"#help\">تحتاج مساعدة؟\u003c/a>","css":".btn {\n  display: inline-block;\n  padding: 10px 18px;\n  background: #0f766e;\n  color: #ffffff;\n  border: 0;\n  border-radius: 6px;\n}\n.btn:hover {\n  background: #115e59;\n}\n.btn:focus-visible {\n  outline: 3px solid #5eead4;\n  outline-offset: 2px;\n}","en":{"title":"Mouse and keyboard","prompt":"What changes on mouse hover, and what changes when you reach it with Tab? And why didn't we use `:focus` alone?","answer":"With the mouse only the background colour changes. When reached with Tab the colour changes too and a light outer ring appears. We used `:focus-visible` so the ring shows for keyboard users without appearing on mouse clicks.","explain":"`:focus` applies to any focus, including a click, so everyone who clicks sees the ring and finds it noisy. `:focus-visible` leaves the decision to the browser: it shows the indicator when focus comes from the keyboard or when the user really needs it. Note that order matters: the state rule comes after the base rule, otherwise the base colour wins on a tie."}},{"title":"تخطيط صفوف الجدول","prompt":"أي صفوف البيانات تصير رمادية؟ وهل يتأثر صف العنوان؟","answer":"الصف الثاني والرابع (متقدمة ومؤسسات) لأن العدّ يبدأ داخل `tbody`، وصف العنوان في `thead` لا يدخل في العدّ أصلًا. والصف الأخير بخط عريض عبر `:last-child`.","explain":"‏`nth-child` تعدّ الأخوة داخل الأب نفسه، و`thead` أب منفصل عن `tbody`. ولو كتبت `tr:nth-child(odd)` على مستوى الجدول لاختلط العدّ، ولهذا نقيّد المحدِّد بـ `.prices tbody tr`.","html":"\u003ctable class=\"prices\">\n  \u003cthead>\n    \u003ctr>\u003cth>الخطة\u003c/th>\u003cth>السعر\u003c/th>\u003c/tr>\n  \u003c/thead>\n  \u003ctbody>\n    \u003ctr>\u003ctd>أساسية\u003c/td>\u003ctd>19\u003c/td>\u003c/tr>\n    \u003ctr>\u003ctd>متقدمة\u003c/td>\u003ctd>39\u003c/td>\u003c/tr>\n    \u003ctr>\u003ctd>احترافية\u003c/td>\u003ctd>79\u003c/td>\u003c/tr>\n    \u003ctr>\u003ctd>مؤسسات\u003c/td>\u003ctd>199\u003c/td>\u003c/tr>\n  \u003c/tbody>\n\u003c/table>","css":".prices {\n  border-collapse: collapse;\n  width: 100%;\n}\n.prices th,\n.prices td {\n  padding: 8px 12px;\n  border-bottom: 1px solid #e2e8f0;\n  text-align: right;\n}\n.prices tbody tr:nth-child(even) {\n  background: #f1f5f9;\n}\n.prices tbody tr:last-child td {\n  font-weight: 700;\n}","en":{"title":"Table row layout","prompt":"Which data rows turn grey? And is the header row affected?","answer":"The second and fourth rows (متقدمة and مؤسسات), because counting starts inside `tbody`; the `thead` header row isn't counted at all. The last row is bold via `:last-child`.","explain":"`nth-child` counts siblings inside the same parent, and `thead` is a separate parent from `tbody`. If you wrote `tr:nth-child(odd)` at table level the count would get mixed, which is why we restrict the selector to `.prices tbody tr`."}},{"title":"الأب يعرف ما بداخله","prompt":"أي بطاقة تحصل على حد أخضر ونجمة قبل اسمها؟ ولماذا لم تحتج إلى صنف إضافي على البطاقة؟","answer":"البطاقة الأولى فقط، لأنها الوحيدة التي تحتوي على `.badge`. الثانية بقيت بحد رمادي وبلا نجمة.","explain":"‏`.card:has(.badge)` تختار البطاقة بشرط احتوائها على شارة، و`:has` تنظر إلى الأبناء بينما المحددات التقليدية تنظر إلى الآباء. والنجمة نفسها من `::before` مع `content`، وهي زخرفة لا تُقرأ كنص.","html":"\u003cdiv class=\"card\">\n  \u003cp class=\"name\">تمر سكري\u003c/p>\n  \u003cspan class=\"badge\">جديد\u003c/span>\n\u003c/div>\n\u003cdiv class=\"card\">\n  \u003cp class=\"name\">تمر خلاص\u003c/p>\n\u003c/div>","css":".card {\n  padding: 14px;\n  border: 1px solid #e2e8f0;\n  border-radius: 8px;\n  margin-bottom: 12px;\n}\n.card:has(.badge) {\n  border-color: #0f766e;\n}\n.card:has(.badge) .name::before {\n  content: \"* \";\n  color: #0f766e;\n}\n.badge {\n  background: #0f766e;\n  color: #ffffff;\n  padding: 2px 8px;\n  border-radius: 999px;\n  font-size: 12px;\n}","en":{"title":"The parent knows what's inside","prompt":"Which card gets a green border and a star before its name? And why didn't it need an extra class on the card?","answer":"Only the first card, because it is the only one that contains `.badge`. The second kept its grey border and has no star.","explain":"`.card:has(.badge)` selects the card if it contains a badge; `:has` looks at children whereas traditional selectors look at parents. The star itself comes from `::before` with `content` and is decoration that isn't read as text."}}],"quiz":[{"q":"ما الفرق الجوهري بين `:hover` و`::before`؟","options":["لا فرق، كلاهما اختصار للنقطتين","الأولى حالة لعنصر موجود، والثانية جزء يُنشأ داخل العنصر","الأولى تعمل في HTML والثانية في CSS فقط","الثانية أقدم ولا تُستخدم اليوم"],"answer":1,"explain":"الحالة الزائفة `:` تصف عنصرًا موجودًا في وضع معين، والعنصر الزائف `::` يمثّل جزءًا غير موجود في شجرة HTML مثل صندوق قبل المحتوى. النقطتان المزدوجة هي الصيغة الحديثة، وتُقبل المفردة تاريخيًا لأربعة عناصر زائفة قديمة."},{"q":"ما أولوية `:where(.a, #b)`؟","options":["(0,0,0)","(0,1,0)","(1,0,0)","تساوي أولوية أعلى وسيط داخلها"],"answer":0,"explain":"‏`:where` أُضيفت تحديدًا لتكون أولويتها صفرًا مهما كان داخلها، فتصلح لأنماط الأساس. أما `:is(.a, #b)` فتأخذ أولوية أقوى وسيط وهي (1,0,0)."},{"q":"متى لا تطابق `p:first-child` فقرةً هي أول فقرة في الصفحة؟","options":["إذا كان الأب يحمل صنفًا","إذا سبق الفقرةَ أي عنصر آخر داخل الأب نفسه","إذا كانت الفقرة داخل div","لا يمكن أن يحدث ذلك"],"answer":1,"explain":"المحدِّد يعني «أول ابن لأبيه»، لا «أول عنصر من نوعه». فوجود `h2` قبل الفقرة داخل الأب نفسه يجعل أول ابن هو العنوان، فلا تطابق القاعدة. الحل `p:first-of-type` أو `:nth-of-type`."},{"q":"أي عناصر `li` تختارها `li:nth-child(3n)`؟","options":["كل العناصر الفردية","العناصر 3 و6 و9 وما بعدها بمضاعفات الثلاثة","العناصر من الثالث إلى الأخير","العنصر الثالث فقط"],"answer":1,"explain":"الصيغة `an+b` تعني مضاعفات `a` بدءًا من `b`. فـ`3n` تعني 3، 6، 9… و`3n+1` تعني 1، 4، 7… و`-n+3` تعني أول ثلاثة فقط."},{"q":"لماذا يُفضّل `:focus-visible` على `:focus` في أزرار الموقع؟","options":["لأن `:focus` لا تعمل في المتصفحات الحديثة","لأنها تعرض مؤشر التركيز عند التنقل بلوحة المفاتيح دون إظهاره عند كل نقرة بالماوس","لأنها تمنع التركيز على العنصر أصلًا","لأنها تعمل على العناصر المعطّلة فقط"],"answer":1,"explain":"‏`:focus` تنطبق على أي تركيز فيظهر الإطار حتى بالنقر، و`:focus-visible` تترك للمتصفح تقدير الحاجة إلى المؤشر. النتيجة: إتاحة أفضل لمن يتنقل بلوحة المفاتيح، ومظهر أنظف لمن يستخدم الماوس."}],"tasks":[{"id":"css-03-t1","title":"زر يتغير عند المرور والتركيز","brief":"نسّق الأزرار التي تحمل الصنف `btn` (رابط وزر في المحرر): اجعل `.btn` بحشوة `10px 18px` وخلفية `#0f766e` ولون نص `#ffffff` وزوايا `6px` وبلا خط تحت، ثم `.btn:hover` بخلفية أغمق `#115e59`، و`.btn:focus-visible` بإطار `3px solid #5eead4` وإزاحة `2px`.","steps":["اكتب قاعدة `.btn` الأساسية أولًا","أضف حالة المرور بخلفية أغمق","أضف `:focus-visible` بإطار واضح مع `outline-offset`"],"files":{"html":"\u003c!-- لا تغيّر الهيكل: التنسيق كله من CSS -->\n\u003cbutton class=\"btn\">أضف إلى السلة\u003c/button>\n\u003ca class=\"btn\" href=\"#help\">تحتاج مساعدة؟\u003c/a>","css":"/* الحالة تُكتب ملتصقة بالمحدِّد: .btn:hover */\n"},"checks":[{"kind":"cssDecl","label":"الزر بلا خط تحت","selector":".btn","prop":"text-decoration","regex":"none"},{"kind":"cssDecl","label":"حالة المرور بخلفية أغمق","selector":".btn:hover","prop":"background","regex":"#115e59"},{"kind":"cssDecl","label":"إطار تركيز بسماكة 3px","selector":".btn:focus-visible","prop":"outline","regex":"3px"},{"kind":"cssDecl","label":"إزاحة الإطار عن الحافة","selector":".btn:focus-visible","prop":"outline-offset","regex":"2px"},{"kind":"selector","label":"عنصران يحملان الصنف btn","sel":".btn","min":2}],"hint":"لا تكتب مسافة قبل الحالة: `.btn:hover` صحيح، و`.btn :hover` يعني شيئًا آخر تمامًا (حالة على عنصر داخل الزر).","solution":{"html":"\u003cbutton class=\"btn\">أضف إلى السلة\u003c/button>\n\u003ca class=\"btn\" href=\"#help\">تحتاج مساعدة؟\u003c/a>","css":".btn {\n  display: inline-block;\n  padding: 10px 18px;\n  background: #0f766e;\n  color: #ffffff;\n  border: 0;\n  border-radius: 6px;\n  text-decoration: none;\n}\n\n.btn:hover {\n  background: #115e59;\n}\n\n.btn:focus-visible {\n  outline: 3px solid #5eead4;\n  outline-offset: 2px;\n}\n"},"en":{"title":"A button that changes on hover and focus","brief":"Style the buttons with the class `btn` (a link and a button in the editor): `.btn` with padding `10px 18px`, background `#0f766e`, text colour `#ffffff`, radius `6px` and no underline; then `.btn:hover` with a darker background `#115e59`, and `.btn:focus-visible` with an outline `3px solid #5eead4` and an offset of `2px`.","steps":["Write the base `.btn` rule first","Add the hover state with a darker background","Add `:focus-visible` with a clear outline and `outline-offset`"],"hint":"Don't put a space before the state: `.btn:hover` is correct, and `.btn :hover` means something completely different (a state on an element inside the button)."}},{"id":"css-03-t2","title":"جدول أسعار بصفوف مخططة وعلامات قبل النص","brief":"نسّق جدول الأسعار: اجعل `.prices` بـ `border-collapse: collapse` وعرض `100%`، وخلايا `th` و`td` بحشوة `10px` وحدّ سفلي `1px solid #e2e8f0` ومحاذاة يمين، وصفوف `tbody` الزوجية بخلفية `#f1f5f9`، والصف الأخير بخط `700`، وأضف قبل أول خلية في كل صف (ما عدا الأخير) علامة `content: \"* \"` بلون `#0f766e` باستخدام `::before`.","steps":["ابدأ بتنسيق الجدول والخلايا","لوّن الصفوف الزوجية بـ nth-child(even)","أضف ::before مع content للخلية الأولى مع استثناء الصف الأخير"],"files":{"html":"\u003c!-- الجدول جاهز: كل المطلوب في CSS -->\n\u003ctable class=\"prices\">\n  \u003ccaption>خطط الاشتراك\u003c/caption>\n  \u003cthead>\n    \u003ctr>\u003cth>الخطة\u003c/th>\u003cth>السعر\u003c/th>\u003c/tr>\n  \u003c/thead>\n  \u003ctbody>\n    \u003ctr>\u003ctd>أساسية\u003c/td>\u003ctd>19\u003c/td>\u003c/tr>\n    \u003ctr>\u003ctd>متقدمة\u003c/td>\u003ctd>39\u003c/td>\u003c/tr>\n    \u003ctr>\u003ctd>احترافية\u003c/td>\u003ctd>79\u003c/td>\u003c/tr>\n    \u003ctr>\u003ctd>مؤسسات\u003c/td>\u003ctd>199\u003c/td>\u003c/tr>\n  \u003c/tbody>\n\u003c/table>","css":"/* nth-child تعدّ الأخوة داخل tbody وحده */\n"},"checks":[{"kind":"cssDecl","label":"الصفوف الزوجية بخلفية رمادية","selector":".prices tbody tr:nth-child(even)","prop":"background","regex":"#f1f5f9"},{"kind":"computed","label":"الصف الأخير بخط عريض","sel":".prices tbody tr:last-child td","prop":"font-weight","regex":"700|bold"},{"kind":"ruleSel","label":"علامة ::before بمحتوى","selector":"::before","prop":"content","regex":"\\S"},{"kind":"ruleSel","label":"العلامة بلون مميز","selector":"::before","prop":"color","regex":"#0f766e"},{"kind":"selector","label":"أربعة صفوف بيانات","sel":".prices tbody tr","min":4}],"hint":"استثنِ الصف الأخير داخل المحدِّد نفسه: `tr:not(:last-child) td:first-child::before`. وتذكّر أن `::before` لا يظهر بلا `content`.","solution":{"html":"\u003ctable class=\"prices\">\n  \u003ccaption>خطط الاشتراك\u003c/caption>\n  \u003cthead>\n    \u003ctr>\u003cth>الخطة\u003c/th>\u003cth>السعر\u003c/th>\u003c/tr>\n  \u003c/thead>\n  \u003ctbody>\n    \u003ctr>\u003ctd>أساسية\u003c/td>\u003ctd>19\u003c/td>\u003c/tr>\n    \u003ctr>\u003ctd>متقدمة\u003c/td>\u003ctd>39\u003c/td>\u003c/tr>\n    \u003ctr>\u003ctd>احترافية\u003c/td>\u003ctd>79\u003c/td>\u003c/tr>\n    \u003ctr>\u003ctd>مؤسسات\u003c/td>\u003ctd>199\u003c/td>\u003c/tr>\n  \u003c/tbody>\n\u003c/table>","css":".prices {\n  border-collapse: collapse;\n  width: 100%;\n}\n\n.prices th,\n.prices td {\n  padding: 10px;\n  border-bottom: 1px solid #e2e8f0;\n  text-align: right;\n}\n\n.prices tbody tr:nth-child(even) {\n  background: #f1f5f9;\n}\n\n.prices tbody tr:last-child td {\n  font-weight: 700;\n}\n\n.prices tbody tr:not(:last-child) td:first-child::before {\n  content: \"* \";\n  color: #0f766e;\n}\n"},"en":{"title":"A price table with striped rows and markers before text","brief":"Style the price table: `.prices` with `border-collapse: collapse` and width `100%`; `th` and `td` cells with padding `10px`, a bottom border `1px solid #e2e8f0` and right alignment; the even `tbody` rows with background `#f1f5f9`; the last row with weight `700`; and before the first cell of every row (except the last) add `content: \"* \"` in colour `#0f766e` using `::before`.","steps":["Start by styling the table and cells","Colour even rows with nth-child(even)","Add ::before with content for the first cell, excluding the last row"],"hint":"Exclude the last row inside the same selector: `tr:not(:last-child) td:first-child::before`. And remember `::before` doesn't show without `content`."}}],"summary":["‏: للحالة و:: للجزء؛ وكلتاهما تنسّق ما لا يمكن وسمه في HTML","‏:hover و:active للتفاعل، و:focus-visible لإتاحة أفضل للوحة المفاتيح","‏:required و:invalid و:placeholder-shown تنسّق النماذج حسب حالتها الحقيقية","‏nth-child تعدّ كل الأخوة، وnth-of-type تعدّ الوسم نفسه فقط","‏:is تأخذ أولوية أقوى وسيط، و:where أولويتها صفر دائمًا، و:has تنظر إلى الأبناء"],"en":{"chapter":"CSS · Basics","title":"Pseudo-classes and Pseudo-elements","subtitle":"Style an element in its state and in parts that don't exist in HTML: on hover, on focus, odd rows, and a marker before the text.","level":"Intermediate","objectives":["Tell the pseudo-class `:` from the pseudo-element `::` and use each correctly","Style interaction and form states without ruining keyboard experience","Reach elements by position among siblings and with nth-child using an+b patterns","Use :is, :where and :has and know each one's effect on specificity"],"summary":[": is for state and :: is for a part; both style what HTML can't mark up",":hover and :active are for interaction, and :focus-visible gives better keyboard accessibility",":required, :invalid and :placeholder-shown style forms by their real state","nth-child counts all siblings, nth-of-type counts only the same tag",":is takes the specificity of its strongest argument, :where is always zero, and :has looks at children"]}},{"id":"css-04","track":"css","chapter":"CSS · الألوان والنصوص","order":4,"title":"الألوان في CSS","subtitle":"تكتب اللون بأربع صيغ مختلفة، وتفرّق بين شفافية اللون وشفافية العنصر، وتختار ألوانًا يقرأها الجميع.","minutes":16,"level":"مبتدئ","objectives":["تفرّق بين color و background-color في كل عنصر","تكتب اللون بـ hex و rgb و hsl وتضيف الشفافية في كل صيغة","تستخدم transparent و currentColor لتوريث الألوان بذكاء","تختار opacity أو قناة alpha حسب ما تريد أن يشفّ فعليًا","تفحص تباين النص مع الخلفية قبل النشر"],"theory":[{"type":"h","text":"اللون خاصيتان لا واحدة"},{"type":"p","text":"`color` تلوّن **النص**، و`background-color` تلوّن **الخلفية**. أشهر خطأ للمبتدئ أن يكتب `color: black` وينتظر خلفية سوداء فيحصل على نص أسود على خلفية بيضاء. القاعدة: ما تراه خلف الحروف تضبطه `background-color`، والحروف نفسها تضبطها `color`."},{"type":"code","lang":"css","code":".card {\n  color: #1f2937;            /* لون النص */\n  background-color: #f8fafc; /* لون الخلفية */\n  border: 1px solid #cbd5e1;\n  padding: 16px;\n}","caption":"أول بطاقة ملوّنة"},{"type":"p","text":"تفصيل دقيق: خلفية `body` تنتقل إلى مساحة العرض كلها ما دام `html` بلا خلفية، ولهذا يبدو لون الصفحة كاملًا حتى لو كانت `body` قصيرة."},{"type":"h","text":"أسماء الألوان: 148 اسمًا جاهزًا"},{"type":"p","text":"CSS تعرف 148 اسمًا مثل `tomato` و`teal` و`rebeccapurple` و`gold`. ممتازة للتجربة السريعة وشرح فكرة، وسيئة لنظام تصميم: الأسماء قليلة ومتباعدة، ولا تعطيك الدرجة التي بين اسمين. لاحظ أن `gray` و`grey` اسما اللون نفسه، وأن `transparent` حالة خاصة."},{"type":"code","lang":"css","code":".alert {\n  background-color: tomato;\n  color: white;\n}\n\n.alert--info {\n  background-color: teal;\n  color: white;\n}","caption":"أسماء جاهزة للاختبار السريع"},{"type":"h","text":"hex: بثلاث أو ست أو ثماني خانات"},{"type":"p","text":"الصيغة `#RRGGBB` تجمع ثلاث قنوات، كل قناة من `00` إلى `ff` (أي 0–255). و`#f00` اختصار مزدوج لـ `#ff0000`. أضف خانتين في النهاية للشفافية `#RRGGBBAA`، أو استخدم الرباعية المختصرة `#RGBA`."},{"type":"table","head":["الصيغة","المعنى"],"rows":[["#fff","أبيض، اختصار #ffffff"],["#0f766e","أخضر مزرق داكن = rgb(15, 118, 110)"],["#0f766e80","اللون نفسه بشفافية 50% تقريبًا (80 = 128 من 255)"],["#0f78","اختصار رباعي يساوي #00ff7788"]]},{"type":"note","tone":"info","title":"لماذا 8 خانات؟","text":"لأن hex الحديث يحمل الشفافية داخله، فلم تبقَ حاجة لتحويل اللون إلى rgba() لمجرد أنك تريد خلفية شبه شفافة."},{"type":"h","text":"rgb() و rgba(): القنوات بالأرقام"},{"type":"p","text":"الصيغة القديمة `rgb(15, 118, 110)` بفواصل، والحديثة `rgb(15 118 110)` بمسافات مع شفافية بعد شرطة مائلة: `rgb(15 118 110 / 0.4)`. أما `rgba()` فهي اسم قديم ما زال يعمل، لكن `rgb()` الحديثة تقبل الشفافية نفسها، فلا سبب لكتابة rgba في كود جديد."},{"type":"code","lang":"css","code":".badge {\n  background-color: rgb(15 118 110 / 0.12);\n  color: rgb(15 118 110);\n  border: 1px solid rgb(15 118 110 / 0.4);\n  padding: 2px 10px;\n  border-radius: 999px;\n}","caption":"قنوات صريحة وشفافية موضعية"},{"type":"h","text":"hsl(): اللون كما يفكر فيه المصمم"},{"type":"p","text":"`hsl()` تقرأ اللون بثلاثة أرقام: **الدرجة** على عجلة من 0 إلى 360 (0 أحمر، 120 أخضر، 240 أزرق)، ثم **التشبع** 0–100%، ثم **الإضاءة** 0–100% حيث 0% أسود و100% أبيض. قوتها أن تغيير الإضاءة وحدها يعطيك نسخة أفتح أو أغمق من اللون نفسه، وهذا ما تحتاجه لحالة hover وللحدود والخلفيات الخفيفة."},{"type":"code","lang":"css","code":":root { --brand-h: 174; }\n\n.btn {\n  background-color: hsl(var(--brand-h) 72% 40%);\n  color: white;\n}\n.btn:hover {\n  background-color: hsl(var(--brand-h) 72% 33%);\n}\n.btn-ghost {\n  background-color: hsl(var(--brand-h) 72% 40% / 0.1);\n  color: hsl(var(--brand-h) 80% 24%);\n  border: 1px solid hsl(var(--brand-h) 72% 40% / 0.35);\n}","caption":"عائلة لون واحدة بثلاث درجات"},{"type":"note","tone":"warn","title":"خطأ شائع","text":"الرقم الثالث في hsl هو الإضاءة لا التشبع. الخلط بينهما يعطي ألوانًا باهتة أو صارخة بلا سبب واضح، ولهذا تُكتب دائمًا `hsl(174 72% 40%)` وليس `hsl(174 40% 72%)`."},{"type":"h","text":"صيغ أحدث: hwb و lab و lch و oklch"},{"type":"p","text":"`hwb()` تقرأ اللون كدرجة مع نسبة بياض وسواد: `hwb(174 10% 25%)`. و`lab()` و`lch()` تعملان في فضاء أوسع من sRGB فتمثلان ألوان شاشات P3، و`lch()` هي `lab` بإحداثيات قطبية. الأهم عمليًا `oklch()`: سطوعها أقرب إلى إدراك العين، فالتدرّج بين درجتين لا يمرّ بمنتصف رمادي باهت، وتوليد سلّم ألوان متساوي الخطوات يصبح ممكنًا."},{"type":"table","head":["الصيغة","الشكل","متى تستخدمها"],"rows":[["hwb()","hwb(174 10% 25%)","مزج بديهي مع الأبيض والأسود"],["lab()","lab(52% -35 -5)","ألوان خارج نطاق sRGB"],["lch()","lch(52% 35 190)","تعديل التشبع دون تغيير السطوع"],["oklch()","oklch(0.58 0.11 190)","سلالم ألوان وتدرّجات نظيفة"]]},{"type":"p","text":"الدعم جيد في المتصفحات الحديثة، لكن القاعدة الآمنة أن تكتب لونًا احتياطيًا قبله: `color: #0f766e;` ثم `color: oklch(0.55 0.11 190);`. المتصفح الذي لا يفهم السطر الثاني يتجاهله ويُبقي الأول."},{"type":"h","text":"transparent و currentColor"},{"type":"p","text":"`transparent` لون أسود بشفافية صفر، و`currentColor` كلمة تعني «خذ قيمة `color` المحسوبة لهذا العنصر». الثانية أذكى ما في CSS للأيقونات: تلوّن الأب فيتبع الابن تلقائيًا بلا تكرار للقيم."},{"type":"code","lang":"css","code":".icon { color: #0f766e; }\n.icon svg { fill: currentColor; stroke: currentColor; }\n\n.chip {\n  color: #0f766e;\n  border: 1px solid currentColor;\n  padding: 4px 12px;\n}\n.chip:hover { color: #134e4a; } /* الحدود تتبع اللون الجديد */","caption":"لون واحد يقود عنصرًا كاملًا"},{"type":"h","text":"opacity أم قناة alpha؟"},{"type":"p","text":"`opacity: 0.5` تجعل **العنصر كله** نصف شفاف: الخلفية والنص والحدود والظل والأبناء. أما `rgb(15 23 42 / 0.5)` فتجعل **اللون وحده** شفافًا ويبقى النص صريحًا. كما أن `opacity` تنشئ stacking context وقد تغيّر ترتيب العناصر فوق بعضها، وتخفض تباين النص فعليًا."},{"type":"compare","left":{"title":"HTML","code":"\u003cdiv class=\"promo\">\n  \u003ch3>خصم 30%\u003c/h3>\n  \u003cp>على جميع الأقمشة\u003c/p>\n\u003c/div>"},"right":{"title":"CSS","code":".promo {\n  background-color: rgb(15 23 42 / 0.6);\n  color: #ffffff;\n  padding: 16px;\n}"}},{"type":"note","tone":"warn","title":"لا تُخفِ النص مع الخلفية","text":"استخدام opacity لتخفيف خلفية تحت نص يعني أن النص نفسه سيباهت ويفقد التباين المطلوب. استخدم قناة alpha في `background-color` واترك `color` كما هي."},{"type":"h","text":"color-scheme والوضع الليلي"},{"type":"p","text":"`color-scheme: light dark` تخبر المتصفح أن الصفحة تدعم الوضعين، فيلوّن عناصر النموذج وأشرطة التمرير وخلفية المستند حسب تفضيل المستخدم. وعند بناء ثيم داكن يدويًا اكتب `color-scheme: dark` أيضًا، وإلا بقي حقل الإدخال أبيض وسط صفحة سوداء. مع `prefers-color-scheme` والمتغيرات تحصل على تبديل كامل بلا تكرار."},{"type":"code","lang":"css","code":":root {\n  color-scheme: light dark;\n  --bg: #f8fafc;\n  --fg: #0f172a;\n}\n\n@media (prefers-color-scheme: dark) {\n  :root { --bg: #0f172a; --fg: #e2e8f0; }\n}\n\nbody {\n  background-color: var(--bg);\n  color: var(--fg);\n}","caption":"ثيم يتبع النظام"},{"type":"h","text":"التباين قبل الجمال"},{"type":"p","text":"معيار WCAG يطلب 4.5:1 للنص العادي، و3:1 للنص الكبير (24px، أو 18.66px عريض) وحدود المكوّنات، و7:1 للمستوى AAA. لونان «متناسقان» قد يكونان غير مقروءين: `#f59e0b` على أبيض يبلغ 2.15:1 فقط، و`#94a3b8` يبلغ 2.56:1. أدوات المطوّر في المتصفح تعرض النسبة مباشرة عند فحص النص."},{"type":"list","items":["لا تنقل المعنى باللون وحده (خطأ/نجاح): أضف أيقونة أو كلمة","اجعل `:focus-visible` واضحًا بإطار سميك لا بتغيّر لون فقط","تذكّر أن خلفيات الصور و`opacity` تخفض التباين الفعلي لا المكتوب","اختبر الوضع الفاتح والداكن ووضع `forced-colors` في ويندوز"],"ordered":false},{"type":"note","tone":"tip","title":"طريقة عملية","text":"ابدأ بزوج واحد عالي التباين (نص وخلفية)، ثم اشتق منه الألوان الثانوية بتغيير الإضاءة في hsl أو oklch."},{"type":"terms","items":[{"term":"color","desc":"لون النص، ويورَّث للأبناء ويُستخدم كقيمة لـ currentColor."},{"term":"background-color","desc":"لون الخلفية، ويمتد افتراضيًا حتى الحافة الخارجية للحدود."},{"term":"قناة alpha","desc":"الخانة الرابعة في hex أو القيمة بعد الشرطة المائلة، تضبط شفافية اللون وحده."},{"term":"hsl()","desc":"لون بدرجة وتشبع وإضاءة، الأسهل في توليد درجات فاتحة وداكنة."},{"term":"currentColor","desc":"قيمة color المحسوبة للعنصر نفسه، تُستخدم في الحدود والأيقونات."},{"term":"opacity","desc":"شفافية العنصر بأكمله بما فيه الأبناء، وتنشئ stacking context."},{"term":"color-scheme","desc":"تفضيل فاتح/داكن يطبّقه المتصفح على عناصر النظام."}]}],"examples":[{"title":"بطاقة بست عشري وتباين محسوب","prompt":"ما لون الخلفية والنص؟ وهل التباين بينهما كافٍ لنص عادي؟","answer":"الخلفية `#0f766e` (أخضر مزرق داكن) والنص `#ecfdf5` (شبه أبيض). النسبة بينهما 5.2:1، أي فوق حد 4.5:1 المطلوب للنص العادي.","explain":"`#0f766e` تعني rgb(15, 118, 110) لأن 0f=15 و76=118 و6e=110. حساب التباين يعتمد على السطوع النسبي لا على الإحساس، ولهذا يُقاس بالأرقام لا بالذوق.","html":"\u003carticle class=\"card\">\n  \u003ch3>كوب قهوة مختصة\u003c/h3>\n  \u003cp>حمّص إثيوبي، تحميص فاتح، 250 جرامًا.\u003c/p>\n  \u003cspan class=\"price\">38 ريالًا\u003c/span>\n\u003c/article>","css":".card {\n  background-color: #0f766e;\n  color: #ecfdf5;\n  padding: 20px;\n  border-radius: 12px;\n  max-width: 320px;\n}\n.price {\n  display: inline-block;\n  margin-top: 8px;\n  background-color: #0f766e80;\n  padding: 2px 10px;\n  border-radius: 999px;\n}","en":{"title":"A hex card with computed contrast","prompt":"What are the background and text colours? And is the contrast enough for normal text?","answer":"The background is `#0f766e` (dark teal) and the text is `#ecfdf5` (almost white). The ratio is 5.2:1, above the 4.5:1 required for normal text.","explain":"`#0f766e` means rgb(15, 118, 110) because 0f=15, 76=118 and 6e=110. Contrast calculation relies on relative luminance, not on feeling, so it is measured by numbers, not taste."}},{"title":"ثلاث درجات من لون واحد","prompt":"لماذا تبدو الألوان الثلاثة من العائلة نفسها؟ وما الرقم الذي تغيّر فعليًا؟","answer":"لأن الدرجة 174 والتشبع ثابتان، وتغيّرت الإضاءة وحدها: 88% ثم 42% ثم 20%. النتيجة نسخة فاتحة وأساسية وداكنة من اللون نفسه.","explain":"هذا هو سبب تفضيل hsl في أنظمة التصميم: تعديل رقم واحد يعطي درجة مشتقة متوقعة، بينما في hex تحتاج حساب قنوات ثلاث.","html":"\u003cdiv class=\"chips\">\n  \u003cspan class=\"chip light\">فاتح\u003c/span>\n  \u003cspan class=\"chip base\">أساسي\u003c/span>\n  \u003cspan class=\"chip dark\">داكن\u003c/span>\n\u003c/div>","css":".chips {\n  display: flex;\n  gap: 10px;\n  font-family: system-ui, sans-serif;\n}\n.chip {\n  padding: 8px 16px;\n  border-radius: 10px;\n  font-weight: 600;\n}\n.light {\n  background-color: hsl(174 60% 88%);\n  color: hsl(174 80% 20%);\n}\n.base {\n  background-color: hsl(174 72% 42%);\n  color: #ffffff;\n}\n.dark {\n  background-color: hsl(174 72% 20%);\n  color: hsl(174 60% 90%);\n}","en":{"title":"Three shades of one colour","prompt":"Why do the three colours look like the same family? And which number actually changed?","answer":"Because the hue 174 and the saturation are constant, and only the lightness changed: 88%, then 42%, then 20%. The result is a light, a base and a dark version of the same colour.","explain":"This is why hsl is preferred in design systems: changing one number gives a predictable derived shade, whereas in hex you have to compute three channels."}},{"title":"opacity أمام قناة alpha","prompt":"البطاقتان تستخدمان الشفافية نفسها تقريبًا، فلماذا يبدو نص اليمنى أوضح؟","answer":"لأن اليسرى استخدمت `opacity: 0.5` فشفّت البطاقة كلها بما فيها النص، بينما اليمنى استخدمت `rgb(15 118 110 / 0.5)` فشفّت الخلفية وحدها وبقي النص أبيض صريحًا.","explain":"قناة alpha تُطبَّق على قيمة اللون نفسها فقط، أما opacity فتُطبَّق على العنصر كطبقة كاملة بعد رسمه.","html":"\u003cdiv class=\"stage\">\n  \u003cdiv class=\"panel ghost\">\n    \u003cstrong>opacity\u003c/strong>\n    \u003cp>النص باهت مع الخلفية\u003c/p>\n  \u003c/div>\n  \u003cdiv class=\"panel alpha\">\n    \u003cstrong>rgb / alpha\u003c/strong>\n    \u003cp>النص صريح\u003c/p>\n  \u003c/div>\n\u003c/div>","css":".stage {\n  display: flex;\n  gap: 14px;\n  padding: 18px;\n  background-color: #e2e8f0;\n  border-radius: 14px;\n}\n.panel {\n  flex: 1;\n  padding: 16px;\n  border-radius: 10px;\n  background-color: #0f766e;\n  color: #ffffff;\n}\n.panel.ghost { opacity: 0.5; }\n.panel.alpha { background-color: rgb(15 118 110 / 0.5); }","en":{"title":"opacity versus the alpha channel","prompt":"Both cards use roughly the same transparency, so why does the right card's text look clearer?","answer":"Because the left one used `opacity: 0.5`, which made the whole card see-through including the text, while the right one used `rgb(15 118 110 / 0.5)`, which made only the background see-through and left the text solid white.","explain":"The alpha channel applies to the colour value only, whereas opacity applies to the element as a whole layer after it is painted."}}],"quiz":[{"q":"أي قيمة تساوي اللون #0f766e؟","options":["rgb(15 118 110)","rgb(15 110 118)","rgb(0 15 766)","rgb(15 118 110 / 100)"],"answer":0,"explain":"0f = 15، و76 = 118، و6e = 110. ترتيب القنوات دائمًا أحمر ثم أخضر ثم أزرق."},{"q":"تريد خلفية شبه شفافة ويبقى النص أبيض صريحًا. ما الصحيح؟","options":["opacity: 0.5 على الحاوية","background-color: rgb(15 23 42 / 0.5)","background-color: #0f172a مع opacity: 0.5","filter: opacity(50%)"],"answer":1,"explain":"قناة alpha تشفّف اللون وحده، أما opacity وfilter فيشفّان العنصر وأبناءه معه."},{"q":"ماذا تعني الخانتان الأخيرتان في #e11d4880؟","options":["درجة اللون","شفافية تقارب 50%","كمية الأزرق","سطوع اللون"],"answer":1,"explain":"80 بالست عشري تساوي 128، أي 128/255 ≈ 50% شفافية."},{"q":"أي لون نص يفشل في معيار AA على خلفية بيضاء؟","options":["#1f2937","#2563eb","#f59e0b","#0f766e"],"answer":2,"explain":"تباين #f59e0b مع الأبيض 2.15:1 فقط، أقل من 4.5:1 المطلوبة للنص العادي. الأزرق 5.17 والأخضر 5.47 والرمادي الداكن 14:1."},{"q":"ما معنى currentColor في border: 1px solid currentColor؟","options":["الأسود الافتراضي","قيمة color المحسوبة للعنصر نفسه","لون الخلفية","لون آخر عنصر في الصفحة"],"answer":1,"explain":"currentColor تأخذ قيمة color للعنصر، فإذا تغيّر لون النص في :hover تغيّر الإطار معه تلقائيًا."}],"tasks":[{"id":"css-04-t1","title":"بطاقة منتج بثلاث صيغ لون","brief":"لديك بطاقة منتج جاهزة. اضبط في CSS ما يلي حرفيًا: خلفية الصفحة `body` بالصيغة `#f1f5f9`، وخلفية `.card` بالصيغة `#ffffff`، ولون السعر `.price` بالصيغة `hsl(160 84% 30%)`. المطلوب إعلانات هذه الخصائص الثلاث بهذه الصيغ نفسها، مع بقاء خلفية `.card` بيضاء فعلًا.","steps":["اكتب القاعدة body { background-color: #f1f5f9; }","أضف .card { background-color: #ffffff; }","أضف .price { color: hsl(160 84% 30%); }"],"files":{"html":"\u003c!-- الهيكل جاهز، ينقصه التنسيق -->\n\u003carticle class=\"card\">\n  \u003ch3>حقيبة كتف جلدية\u003c/h3>\n  \u003cp>لون بني، حجم وسط، ضمان سنة.\u003c/p>\n  \u003cspan class=\"price\">249 ريالًا\u003c/span>\n\u003c/article>","css":"/* اكتب قواعدك هنا */\n.card {\n  padding: 18px;\n  border-radius: 12px;\n}\n"},"checks":[{"kind":"cssDecl","label":"خلفية body هي #f1f5f9","selector":"body","prop":"background-color","regex":"#f1f5f9"},{"kind":"cssDecl","label":"خلفية .card هي #ffffff","selector":".card","prop":"background-color","regex":"#ffffff|#fff|\\bwhite\\b"},{"kind":"computed","label":"لون .price بصيغة hsl (160 84% 30%)","sel":".price","prop":"color","regex":"#0c8d62|12,\\s*141,\\s*98"},{"kind":"computed","label":"اللون المحسوب للسعر تحوّل إلى rgb","sel":".price","prop":"color","regex":"rgb|hsl"}],"hint":"hex يبدأ بعلامة #، وhsl يحتاج ثلاث قيم بين قوسين: الدرجة ثم التشبع ثم الإضاءة.","solution":{"html":"\u003carticle class=\"card\">\n  \u003ch3>حقيبة كتف جلدية\u003c/h3>\n  \u003cp>لون بني، حجم وسط، ضمان سنة.\u003c/p>\n  \u003cspan class=\"price\">249 ريالًا\u003c/span>\n\u003c/article>","css":"body {\n  background-color: #f1f5f9;\n}\n\n.card {\n  background-color: #ffffff;\n  padding: 18px;\n  border-radius: 12px;\n}\n\n.price {\n  color: hsl(160 84% 30%);\n  font-weight: 700;\n}"},"en":{"title":"A product card with three colour formats","brief":"You have a ready product card. Set the following in CSS exactly: the `body` page background in the format `#f1f5f9`, the `.card` background in the format `#ffffff`, and the `.price` colour in the format `hsl(160 84% 30%)`. The task is to declare these three properties in these exact formats while the `.card` background stays truly white.","steps":["Write the rule body { background-color: #f1f5f9; }","Add .card { background-color: #ffffff; }","Add .price { color: hsl(160 84% 30%); }"],"hint":"hex starts with #, and hsl needs three values in parentheses: hue, then saturation, then lightness."}},{"id":"css-04-t2","title":"شفافية موضعية ولون موروث","brief":"اجعل خلفية `.panel` شبه شفافة بالصيغة `rgb(15 23 42 / 0.62)`، ولون نص `.note` هو `#0f766e` مع إطار `1px solid currentColor` كي يتبع الإطار لون النص. ممنوع استخدام الخاصية `opacity` في أي مكان.","steps":["اكتب .panel { background-color: rgb(15 23 42 / 0.62); color: #ffffff; }","اكتب .note { color: #0f766e; border: 1px solid currentColor; }","أضف padding وborder-radius للشكل فقط"],"files":{"html":"\u003c!-- الهيكل جاهز، ينقصه التنسيق -->\n\u003csection class=\"hero\">\n  \u003cdiv class=\"panel\">\n    \u003ch2>تخفيضات الصيف\u003c/h2>\n    \u003cp>حتى 40% على الأجهزة الصغيرة.\u003c/p>\n  \u003c/div>\n  \u003cp class=\"note\">الشحن مجاني فوق 200 ريال\u003c/p>\n\u003c/section>","css":".hero {\n  background-color: #e2e8f0;\n  padding: 24px;\n  border-radius: 16px;\n}\n\n/* اكتب تنسيق .panel و .note هنا */\n"},"checks":[{"kind":"cssDecl","label":"خلفية .panel بشفافية 0.62","selector":".panel","prop":"background-color","regex":"rgba?\\(\\s*15[ ,]+23[ ,]+42[ ,/]+0?\\.62\\s*\\)"},{"kind":"cssDecl","label":"لون .note هو #0f766e","selector":".note","prop":"color","regex":"#0f766e"},{"kind":"computed","label":"إطار .note يستخدم currentColor (لون النص نفسه)","sel":".note","prop":"border-top-color","regex":"#0f766e|15,\\s*118,\\s*110"},{"kind":"sourceNot","label":"لا يوجد استخدام لـ opacity","regex":"opacity\\s*:"},{"kind":"computed","label":"خلفية .panel محسوبة كـ rgba","sel":".panel","prop":"background-color","regex":"rgba?\\(|color"}],"hint":"currentColor كلمة جاهزة تأخذ قيمة color للعنصر نفسه، فلا تحتاج تكرار اللون مرتين.","solution":{"html":"\u003csection class=\"hero\">\n  \u003cdiv class=\"panel\">\n    \u003ch2>تخفيضات الصيف\u003c/h2>\n    \u003cp>حتى 40% على الأجهزة الصغيرة.\u003c/p>\n  \u003c/div>\n  \u003cp class=\"note\">الشحن مجاني فوق 200 ريال\u003c/p>\n\u003c/section>","css":".hero {\n  background-color: #e2e8f0;\n  padding: 24px;\n  border-radius: 16px;\n}\n\n.panel {\n  background-color: rgb(15 23 42 / 0.62);\n  color: #ffffff;\n  padding: 18px;\n  border-radius: 12px;\n}\n\n.note {\n  color: #0f766e;\n  border: 1px solid currentColor;\n  padding: 6px 12px;\n  border-radius: 999px;\n  display: inline-block;\n}"},"en":{"title":"Local transparency and an inherited colour","brief":"Make the `.panel` background semi-transparent with `rgb(15 23 42 / 0.62)`, and the `.note` text colour `#0f766e` with a `1px solid currentColor` border so the border follows the text colour. Using the `opacity` property anywhere is forbidden.","steps":["Write .panel { background-color: rgb(15 23 42 / 0.62); color: #ffffff; }","Write .note { color: #0f766e; border: 1px solid currentColor; }","Add padding and border-radius for shape only"],"hint":"currentColor is a ready keyword that takes the element's own color value, so you don't repeat the colour twice."}}],"summary":["color للنص وbackground-color للخلفية، ولا تُخلط بينهما","hex و rgb و hsl تصف اللون نفسه بطرق مختلفة، والشفافية تُضاف في كل منها","hsl أسهل في توليد درجات فاتحة وداكنة من لون واحد","currentColor تنقل لون النص إلى الحدود والأيقونات تلقائيًا","opacity تشفّ العنصر كله، وقناة alpha تشفّ اللون وحده","لا تنشر زوجًا لونيًا قبل قياس تباينه"],"en":{"chapter":"CSS · Colours and Text","title":"Colours in CSS","subtitle":"Write a colour in four different formats, tell colour transparency from element transparency, and choose colours everyone can read.","level":"Beginner","objectives":["Tell color from background-color on each element","Write colours in hex, rgb and hsl and add transparency in each format","Use transparent and currentColor to inherit colours smartly","Choose opacity or the alpha channel depending on what should actually be see-through","Check text-to-background contrast before publishing"],"summary":["color is for text and background-color for the background; don't mix them","hex, rgb and hsl describe the same colour in different ways, and transparency can be added to each","hsl makes it easier to generate light and dark shades from one colour","currentColor carries the text colour to borders and icons automatically","opacity makes the whole element see-through, the alpha channel only the colour","Never publish a colour pair before measuring its contrast"]}}],"projects":[{"id":"proj-1","title":"بطاقة منتج متجر","desc":"أكمل بطاقة منتج داخل متجر إلكتروني: صورة بنص بديل، عنوان، سعر، وصف قصير، وزر «أضف إلى السلة» داخل الحاوية `card`. ثم نسّقها بتنسيق CSS: زوايا دائرية وظل للبطاقة، خلفية للزر، وخط عريض للسعر.","goals":["إضافة صورة `\u003cimg>` بنص بديل `alt` وصفي داخل البطاقة","بناء محتوى البطاقة بالأصناف `card` و`card-title` و`price` و`btn`","تنسيق البطاقة بـ `border-radius` و`box-shadow` وتلوين زر `.btn`"],"files":{"html":"\u003cdiv class=\"card\">\n  \u003ch2 class=\"card-title\">عباية مطرزة\u003c/h2>\n  \u003cp class=\"card-desc\">قماش كتان خفيف مناسب للصيف.\u003c/p>\n\u003c/div>\n","css":"body {\n  font-family: system-ui, sans-serif;\n  padding: 24px;\n}\n"},"checks":[{"kind":"selector","label":"صورة المنتج موجودة","sel":"img","min":1},{"kind":"attr","label":"لكل صورة نص بديل alt وصفي","sel":"img","attr":"alt","regex":".{4,}"},{"kind":"text","label":"عنوان المنتج داخل h2","sel":"h2","regex":"عباية"},{"kind":"cssDecl","label":"بطاقة بزوايا دائرية","selector":".card","prop":"border-radius","regex":"\\d+px"},{"kind":"cssDecl","label":"تنسيق السعر بخط عريض","selector":".price","prop":"font-weight","regex":"bold|700|[6-9]00"},{"kind":"cssDecl","label":"زر الإضافة بخلفية ملوّنة","selector":".btn","prop":"background","regex":"#[0-9a-fA-F]{3,6}"}],"hint":"الصورة داخل البطاقة تحتاج `display: block` و`width: 100%` لتملأ العرض، وتذكّر أن `alt` يصف الصورة لمن لا يراها لا اسم الملف.","solution":{"html":"\u003cdiv class=\"card\">\n  \u003cimg class=\"card-img\" src=\"https://picsum.photos/seed/abaya/600/400\" alt=\"عباية سوداء مطرزة على خلفية بيج\">\n  \u003cdiv class=\"card-body\">\n    \u003ch2 class=\"card-title\">عباية مطرزة\u003c/h2>\n    \u003cp class=\"price\">349 ر.س\u003c/p>\n    \u003cp class=\"card-desc\">قماش كتان خفيف مناسب للصيف، متوفر بثلاثة مقاسات.\u003c/p>\n    \u003cbutton class=\"btn\" type=\"button\">أضف إلى السلة\u003c/button>\n  \u003c/div>\n\u003c/div>\n","css":"body {\n  font-family: system-ui, sans-serif;\n  background: #f4f4f5;\n  padding: 24px;\n}\n\n.card {\n  max-width: 320px;\n  background: #ffffff;\n  border: 1px solid #e4e4e7;\n  border-radius: 14px;\n  box-shadow: 0 6px 18px rgba(24, 24, 27, 0.12);\n  overflow: hidden;\n}\n\n.card-img {\n  display: block;\n  width: 100%;\n  height: 200px;\n  object-fit: cover;\n}\n\n.card-body {\n  padding: 16px;\n}\n\n.card-title {\n  margin: 0 0 8px;\n  font-size: 20px;\n  color: #18181b;\n}\n\n.price {\n  margin: 0 0 12px;\n  font-size: 18px;\n  font-weight: 700;\n  color: #0f766e;\n}\n\n.card-desc {\n  margin: 0 0 16px;\n  font-size: 14px;\n  line-height: 1.7;\n  color: #52525b;\n}\n\n.btn {\n  display: inline-block;\n  width: 100%;\n  padding: 10px 16px;\n  background: #0f766e;\n  color: #ffffff;\n  border: none;\n  border-radius: 8px;\n  font-size: 15px;\n  cursor: pointer;\n}\n\n.btn:hover {\n  background: #115e59;\n}\n"},"en":{"title":"Store Product Card","desc":"Complete a product card in an online store: an image with alt text, a title, a price, a short descrip
