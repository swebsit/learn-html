tion and an «Add to cart» button inside the `card` container. Then style it with CSS: rounded corners and a shadow for the card, a background for the button, and bold text for the price.","goals":["Add an `\u003cimg>` with descriptive `alt` text inside the card","Build the card content with the classes `card`, `card-title`, `price` and `btn`","Style the card with `border-radius` and `box-shadow` and colour the `.btn` button"],"hint":"The image inside the card needs `display: block` and `width: 100%` to fill the width, and remember `alt` describes the image for people who can't see it, not the file name."}},{"id":"proj-2","title":"صفحة ملف شخصي","desc":"ابنِ صفحة ملف شخصي لمطوّرة واجهات: رأس `profile-header` بصورة واسم، قائمة مهارات، جدول خبرات، ورابط بريد يبدأ بـ `mailto:`. ونسّق الصفحة بتخطيط flex للرأس، وحدود حول الصورة الرمزية `avatar`.","goals":["ترتيب الصورة والاسم في رأس `.profile-header` بتخطيط `flex`","بناء جدول خبرات بـ `thead` و`tbody` وصفّين على الأقل","ربط البريد برابط `mailto:` وإضافة حدود للصورة بالصنف `avatar`"],"files":{"html":"\u003cdiv class=\"profile\">\n  \u003ch1>سارة العتيبي\u003c/h1>\n  \u003cp class=\"role\">مطوّرة واجهات أمامية\u003c/p>\n\u003c/div>\n","css":"body {\n  font-family: system-ui, sans-serif;\n  padding: 24px;\n}\n"},"checks":[{"kind":"attr","label":"صورة شخصية بنص بديل","sel":"img","attr":"alt","regex":".{4,}"},{"kind":"text","label":"الاسم في عنوان h1","sel":"h1","regex":"سارة"},{"kind":"selector","label":"جدول خبرات بصفّين على الأقل","sel":"table tbody tr","min":2},{"kind":"attr","label":"رابط بريد يبدأ بـ mailto","sel":"a[href^='mailto:']","attr":"href","regex":"^mailto:"},{"kind":"cssDecl","label":"رأس الملف بتخطيط flex","selector":".profile-header","prop":"display","regex":"flex"},{"kind":"cssDecl","label":"حدود حول الصورة الشخصية","selector":".avatar","prop":"border","regex":"\\d+px"}],"hint":"`align-items: center` في الحاوية المرنة يضع الصورة والاسم على خط أفقي واحد، و`border-radius: 50%` يحوّل الصورة المربعة إلى دائرة.","solution":{"html":"\u003cdiv class=\"profile\">\n  \u003cheader class=\"profile-header\">\n    \u003cimg class=\"avatar\" src=\"https://picsum.photos/seed/sara/160/160\" alt=\"صورة سارة العتيبي\">\n    \u003cdiv>\n      \u003ch1>سارة العتيبي\u003c/h1>\n      \u003cp class=\"role\">مطوّرة واجهات أمامية\u003c/p>\n      \u003ca class=\"mail\" href=\"mailto:sara@example.com\">sara@example.com\u003c/a>\n    \u003c/div>\n  \u003c/header>\n\n  \u003csection class=\"block\">\n    \u003ch2>المهارات\u003c/h2>\n    \u003cul class=\"skills\">\n      \u003cli>HTML5\u003c/li>\n      \u003cli>CSS3\u003c/li>\n      \u003cli>JavaScript\u003c/li>\n      \u003cli>إتاحة الوصول\u003c/li>\n    \u003c/ul>\n  \u003c/section>\n\n  \u003csection class=\"block\">\n    \u003ch2>الخبرات\u003c/h2>\n    \u003ctable class=\"exp\">\n      \u003cthead>\n        \u003ctr>\n          \u003cth scope=\"col\">المدة\u003c/th>\n          \u003cth scope=\"col\">الجهة\u003c/th>\n          \u003cth scope=\"col\">الدور\u003c/th>\n        \u003c/tr>\n      \u003c/thead>\n      \u003ctbody>\n        \u003ctr>\n          \u003ctd>2023 — الآن\u003c/td>\n          \u003ctd>شركة نُوى\u003c/td>\n          \u003ctd>مطوّرة واجهات\u003c/td>\n        \u003c/tr>\n        \u003ctr>\n          \u003ctd>2021 — 2023\u003c/td>\n          \u003ctd>متجر رِفّ\u003c/td>\n          \u003ctd>مطوّرة مبتدئة\u003c/td>\n        \u003c/tr>\n      \u003c/tbody>\n    \u003c/table>\n  \u003c/section>\n\u003c/div>\n","css":"body {\n  font-family: system-ui, sans-serif;\n  background: #f8fafc;\n  color: #1e293b;\n  padding: 24px;\n}\n\n.profile {\n  max-width: 640px;\n  margin: 0 auto;\n  background: #ffffff;\n  border-radius: 16px;\n  padding: 24px 28px;\n}\n\n.profile-header {\n  display: flex;\n  align-items: center;\n  gap: 20px;\n}\n\n.avatar {\n  width: 96px;\n  height: 96px;\n  border-radius: 50%;\n  border: 3px solid #c7d2fe;\n  object-fit: cover;\n}\n\nh1 {\n  margin: 0 0 4px;\n  font-size: 24px;\n}\n\n.role {\n  margin: 0 0 6px;\n  color: #64748b;\n  font-size: 15px;\n}\n\n.mail {\n  color: #4338ca;\n  font-size: 15px;\n}\n\n.block {\n  margin-top: 28px;\n  border-top: 1px solid #e2e8f0;\n  padding-top: 16px;\n}\n\n.skills {\n  display: flex;\n  flex-wrap: wrap;\n  gap: 8px;\n  list-style: none;\n  margin: 12px 0 0;\n  padding: 0;\n}\n\n.skills li {\n  background: #eef2ff;\n  color: #3730a3;\n  padding: 4px 12px;\n  border-radius: 999px;\n  font-size: 14px;\n}\n\n.exp {\n  width: 100%;\n  border-collapse: collapse;\n  margin-top: 12px;\n  font-size: 15px;\n}\n\n.exp th,\n.exp td {\n  border: 1px solid #e2e8f0;\n  padding: 10px 12px;\n  text-align: right;\n}\n\n.exp thead th {\n  background: #f1f5f9;\n  color: #334155;\n}\n"},"en":{"title":"Profile Page","desc":"Build a profile page for a front-end developer: a `profile-header` with a picture and a name, a skills list, an experience table, and an email link starting with `mailto:`. Style the page with a flex layout for the header and borders around the `avatar` picture.","goals":["Arrange the picture and name in `.profile-header` with a `flex` layout","Build an experience table with `thead` and `tbody` and at least two rows","Link the email with `mailto:` and add borders to the picture with the class `avatar`"],"hint":"`align-items: center` in the flex container puts the picture and name on one horizontal line, and `border-radius: 50%` turns a square picture into a circle."}},{"id":"proj-3","title":"شريط تنقّل متجاوب مع قسم بطل","desc":"أنشئ شريط تنقّل `navbar` يحمل اسم المنصة وثلاثة روابط داخل `nav-links`، يليه قسم بطل `hero` بعنوان h1 وفقرة وزر `hero-btn`. ثم وزّع العناصر بتخطيط flex، وأعطِ قسم البطل خلفية متدرجة ومسافات مريحة.","goals":["بناء شريط تنقّل `.navbar` بثلاثة روابط داخل `.nav-links`","توزيع الشريط بـ `display: flex` و`justify-content: space-between`","تنسيق قسم `.hero` بخلفية `linear-gradient` وزر `.hero-btn` بحشو مناسب"],"files":{"html":"\u003cnav class=\"navbar\">\n  \u003cspan class=\"brand\">مِداد\u003c/span>\n\u003c/nav>\n\n const rx=s=>new RegExp(s,"i");
const ns=s=>s.replace(/\s+/g,"").replace(/\(even\)/g,"(2n)").replace(/\(odd\)/g,"(2n+1)");
function runChecks(t,html,css){return new Promise(res=>{
  const f=document.createElement("iframe");f.style.cssText="position:absolute;left:-9999px;width:600px;height:400px";
  let done=false;const go=()=>{if(done)return;done=true;const d=f.contentDocument,w=f.contentWindow,src=html+"\n"+css;
    const rules=()=>{const o=[];for(const sh of d.styleSheets)try{for(const r of sh.cssRules)o.push(r)}catch(e){}return o};
    const out=t.checks.map(c=>{let ok=false;try{const a=c.sel?[...d.querySelectorAll(c.sel)]:[];
      if(c.kind=="selector")ok=a.length>=(c.min??1)&&a.length<=(c.max??1e9);
      else if(c.kind=="text")ok=a.some(e=>rx(c.regex).test(e.textContent));
      else if(c.kind=="attr")ok=a.length>0&&a.every(e=>e.hasAttribute(c.attr)&&rx(c.regex).test(e.getAttribute(c.attr)));
      else if(c.kind=="source")ok=rx(c.regex).test(src);
      else if(c.kind=="sourceNot")ok=!rx(c.regex).test(src);
      else if(c.kind=="computed")ok=a.length>0&&a.every(e=>{const v=w.getComputedStyle(e).getPropertyValue(c.prop);return rx(c.regex).test(hex(v)+" "+v)});
      else if(c.kind=="cssDecl")ok=rules().some(r=>r.selectorText&&ns(r.selectorText)==ns(c.selector)&&rx(c.regex).test(hex(r.style.getPropertyValue(c.prop))));
      else if(c.kind=="ruleSel")ok=rules().some(r=>r.selectorText&&rx(c.selector).test(r.selectorText)&&rx(c.regex).test(hex(r.style.getPropertyValue(c.prop))));
      else if(c.kind=="cssDeclAny")ok=rules().some(r=>r.style&&rx(c.regex).test(hex(r.style.getPropertyValue(c.prop))));
      else if(c.kind=="cssCount")ok=rules().filter(r=>r.style&&r.style.getPropertyValue(c.prop)).length>=c.min}catch(e){}
      return{label:c.label,ok}});f.remove();res(out)};
  f.onload=go;setTimeout(go,2500);f.srcdoc=doc(html,css);document.body.appendChild(f)})}

 list:()=>{const tg=b.ordered?"ol":"ul";return`<${tg} dir="${dirOf(b.items.join(" "))}">${b.items.map(i=>`<li>${inl(i)}</li>`).join("")}</${tg}>`},
 code:()=>`<pre>${esc(b.code)}</pre>`,note:()=>`<p class="note" dir="${dirOf(b.text)}">${b.title?`<b>${esc(b.title)}:</b> `:""}${inl(b.text)}</p>`,
 table:()=>`<div style="overflow:auto" dir="${dirOf(b.head.join(" "))}"><table><tr>${b.head.map(h=>`<th>${inl(h)}</th>`).join("")}</tr>${b.rows.map(r=>`<tr>${r.map(c=>`<td>${inl(c)}</td>`).join("")}</tr>`).join("")}</table></div>`,
 terms:()=>`<ul dir="${dirOf(b.items.map(i=>i.desc).join(" "))}">${b.items.map(i=>`<li><code>${esc(i.term)}</code> — ${inl(i.desc)}</li>`).join("")}</ul>`,
 compare:()=>`<div class="ed">${[b.left,b.right].map(s=>`<div><b>${esc(s.title)}</b><pre>${esc(s.code)}</pre></div>`).join("")}</div>`,
 quote:()=>`<p class="note" dir="${dirOf(b.text)}">${inl(b.text)}</p>`}[b.type]||(()=>""))();

/* صندوق تعليمات ثنائي اللغة / bilingual instruction box */
const guide=(titleKey,body)=>`<div class="guide"><div class="gh">${t(titleKey)}</div>${body}</div>`;
const bar=txt=>`<p dir="${dirOf(txt)}" style="margin:6px 0">${inl(txt)}</p>`;
const copy=async(txt,btn)=>{try{await navigator.clipboard.writeText(txt)}catch(e){const a=document.createElement("textarea");a.value=txt;document.body.appendChild(a);a.select();try{document.execCommand("copy")}catch(_){}a.remove()}
  const o=btn.textContent;btn.textContent=t("copied");setTimeout(()=>btn.textContent=o,1300)};
const tabsHTML=()=>`<div class="etabs"><button class="on" data-e="h">HTML</button><button data-e="c">CSS</button></div>`;
function bindTabs(host,h,c){$(".etabs",host).onclick=e=>{const b=e.target.closest("button");if(!b)return;
  $$(".etabs button",host).forEach(x=>x.classList.toggle("on",x==b));h.classList.toggle("hid",b.dataset.e!="h");c.classList.toggle("hid",b.dataset.e!="c")}}
const lbl=(k,acts="")=>`<div class="lbl"><span>${t(k)}</span><span class="acts">${acts}</span></div>`;

/* محرر التمارين والمشاريع / editor for exercises and projects */
function editor(tk,host){
  const k="d:"+tk.id,fl=tk.files,d=P.draft[k]||{html:fl.html,css:fl.css},steps=f(tk,"steps");
  host.innerHTML=`${steps?`<div class="steps" dir="${dirOf(steps.join(" "))}"><b>${t("steps")}</b><ol>${steps.map(s=>`<li>${inl(s)}</li>`).join("")}</ol></div>`:""}
  <div class="cbox">${lbl("code",`<button class="btn g sm cp">${t("copy")}</button><button class="btn g sm rs0">${t("reset")}</button>`)}
  ${tabsHTML()}<div><textarea class="h" spellcheck="false">${esc(d.html)}</textarea><textarea class="c hid" spellcheck="false">${esc(d.css)}</textarea></div></div>
  <div class="rbox">${lbl("live")}<iframe class="pv" title="${esc(t("live"))}"></iframe></div>
  <p><button class="btn k">${t("check")}</button> <button class="btn g hn">${t("hint")}</button> <button class="btn g sl">${t("solution")}</button></p>
  <ul class="chk"></ul><p class="note hid" dir="${dirOf(f(tk,"hint")||"")}"><b>${t("hintH")}:</b> ${inl(f(tk,"hint")||"")}</p>`;
  const h=$(".h",host),c=$(".c",host),pv=$(".pv",host);
  const live=()=>{pv.srcdoc=doc(h.value,c.value);P.draft[k]={html:h.value,css:c.value};save()};
  h.oninput=c.oninput=live;live();bindTabs(host,h,c);
  $(".cp",host).onclick=e=>copy(c.classList.contains("hid")?h.value:c.value,e.currentTarget);
  $(".rs0",host).onclick=()=>{h.value=fl.html;c.value=fl.css;live()};
  $(".hn",host).onclick=()=>$(".note",host).classList.toggle("hid");
  $(".sl",host).onclick=()=>{h.value=tk.solution.html;c.value=tk.solution.css;live()};
  $(".k",host).onclick=async()=>{const r=await runChecks(tk,h.value,c.value),win=r.every(x=>x.ok);
    $(".chk",host).innerHTML=r.map(x=>`<li class="${x.ok?"p":"f"}" dir="${dirOf(x.label)}">${esc(x.label)}</li>`).join("")+(win?`<li class="win">${t("win")}</li>`:"");
    if(win){award(tk.id,20);if(tk.id.startsWith("proj")){const hh=$("h3",host.parentElement);if(hh&&!hh.textContent.startsWith("✅"))hh.textContent="✅ "+hh.textContent}}}}

/* مثال: سؤال + صندوق الجواب + محرر + ناتج مباشر / example: question + answer box + editor + live result */
function exampleCard(e,i){
  const q=f(e,"prompt"),a=f(e,"answer"),x=f(e,"explain");
  return `<div class="card ex" data-x="${i}"><div class="exh"><span class="badge">${t("exampleN")} ${i+1}</span> <b dir="${dirOf(f(e,"title"))}">${esc(f(e,"title"))}</b></div>
  <div class="qbox" dir="${dirOf(q)}"><div class="lbl2">${t("question")}</div><p>${inl(q)}</p></div>
  <div class="abox" dir="${dirOf(a)}"><div class="lbl2">${t("answer")}</div><p>${inl(a)}</p>${x?`<p class="why"><b>${t("why")}</b> ${inl(x)}</p>`:""}</div>
  <div class="cbox">${lbl("code",`<button class="btn g sm cp">${t("copy")}</button><button class="btn g sm rs0">${t("reset")}</button>`)}
  ${e.css?tabsHTML():""}<div><textarea class="h" spellcheck="false">${esc(e.html)}</textarea>${e.css?`<textarea class="c hid" spellcheck="false">${esc(e.css)}</textarea>`:""}</div></div>
  <div class="rbox">${lbl("live")}<iframe class="pv" title="${esc(t("live"))}"></iframe></div></div>`}
function bindExample(card,e){
  const h=$(".h",card),c=$(".c",card),pv=$(".pv",card);
  const live=()=>{pv.srcdoc=doc(h.value,c?c.value:"")};
  h.oninput=live;if(c)c.oninput=live;live();if(c)bindTabs(card,h,c);
  $(".cp",card).onclick=ev=>copy(c&&!c.classList.contains("hid")?c.value:h.value,ev.currentTarget);
  $(".rs0",card).onclick=()=>{h.value=e.html;if(c)c.value=e.css;live()}}

/* ====== الصفحات ====== */
let TR="html";
const lvl=l=>f(l,"level");
const grid=()=>L.filter(l=>l.track==TR).map(lcard).join("");
const seg=()=>`<div class="seg"><button data-tr="html" class="${TR=="html"?"on":""}">HTML</button><button data-tr="css" class="${TR=="css"?"on":""}">CSS</button></div><div class="grid" id="gr">${grid()}</div>`;
const bindSeg=()=>$$(".seg button").forEach(b=>b.onclick=()=>{TR=b.dataset.tr;$$(".seg button").forEach(x=>x.classList.toggle("on",x==b));$("#gr").innerHTML=grid()});
const lcard=l=>`<a class="card lc" href="#/lesson/${l.id}"><span class="tag ${l.track}">${l.track.toUpperCase()}</span> <small>${l.minutes} ${t("min")} · ${esc(lvl(l))}</small>
  <h3 style="margin:6px 0 2px" dir="${dirOf(f(l,"title"))}">${esc(f(l,"title"))}</h3><small dir="${dirOf(f(l,"subtitle"))}" style="display:block">${esc(f(l,"subtitle"))}</small><div class="pb"><i style="width:${pct(l)}%"></i></div><small>${pct(l)}%</small></a>`;
const guideList=(arr)=>`<ol class="gl">${arr.map(s=>`<li>${inl(s[EN()?1:0])}</li>`).join("")}</ol>`;
function home(){const q=L.reduce((a,l)=>a+l.quiz.filter((_,i)=>P.done[l.id+":q"+i]).length,0),tt=L.reduce((a,l)=>a+l.tasks.filter(x=>P.done[x.id]).length,0);
  $("#m").innerHTML=`<section class="hero"><div><h1>${t("heroH")}</h1><p>${t("heroP")}</p><a class="btn w" href="#/lesson/${L[0].id}" style="display:inline-block">${t("start")}</a></div>
  <div class="ring" style="--p:${total()}"><span>${total()}%</span></div></section>
  <div class="stats"><div class="stat"><b>${L.filter(l=>pct(l)==100).length}/${L.length}</b><small>${t("sLessons")}</small></div><div class="stat"><b>${q}</b><small>${t("sQ")}</small></div>
  <div class="stat"><b>${tt}</b><small>${t("sT")}</small></div><div class="stat"><b>${1+Math.floor(P.xp/100)}</b><small>${t("sLvl")}</small></div></div>
  ${guide("guideH",guideList(U.guideSteps)+bar(U.xpRules[EN()?1:0])+`<p class="mini" dir="${EN()?"ltr":"rtl"}">${esc(t("contentNote"))}</p>`)}
  <h2>${t("lessonsH")}</h2>${seg()}`;bindSeg()}
function lessons(){$("#m").innerHTML=`<h2>${t("lessonsH")}</h2>${seg()}`;bindSeg()}
function lesson(l){const i=L.indexOf(l),nx=L[i+1];
  const obj=f(l,"objectives"),sum=f(l,"summary");
  const tabs={
   explain:guide("insH",bar(t("insExplain")))+l.theory.map(block).join("")+
     `<div class="card sumc" style="margin-top:24px" dir="${dirOf(sum.join(" "))}"><h3>${t("sumH")}</h3><ul>${sum.map(s=>`<li>${inl(s)}</li>`).join("")}</ul></div>`,
   examples:guide("insH",bar(t("insExamples")))+l.examples.map(exampleCard).join(""),
   quiz:guide("insH",bar(t("insQuiz")))+l.quiz.map((q,k)=>`<div class="card" style="margin:12px 0" data-q="${k}"><b dir="${dirOf(q.q)}" style="display:block">${k+1}. ${inl(q.q)}</b>${q.options.map((o,oi)=>`<button class="opt" dir="${dirOf(o)}" data-o="${oi}">${esc(o)}</button>`).join("")}<p class="fb" dir="${dirOf(q.explain)}"></p></div>`).join(""),
   tasks:guide("insH",bar(t("insTasks")))+l.tasks.map((x,k)=>`<div class="card" style="margin:12px 0"><h3 dir="${dirOf(f(x,"title"))}">${esc(f(x,"title"))}</h3><p dir="${dirOf(f(x,"brief"))}">${inl(f(x,"brief"))}</p><div data-t="${k}"></div></div>`).join("")};
  const names={explain:"tExplain",examples:"tExamples",quiz:"tQuiz",tasks:"tTasks"};
  $("#m").innerHTML=`<a href="#/lessons">${t("back")}</a><h1 style="margin:6px 0" dir="${dirOf(f(l,"title"))}">${esc(f(l,"title"))}</h1><p><small dir="${dirOf(f(l,"subtitle"))}" style="display:block">${esc(f(l,"subtitle"))}</small></p>
  <div class="pb"><i style="width:${pct(l)}%"></i></div>
  <div class="card obj" dir="${dirOf(obj.join(" "))}"><b>${t("objH")}</b><ul>${obj.map(o=>`<li>${inl(o)}</li>`).join("")}</ul></div>
  <div class="tabs">${Object.keys(tabs).map((k,j)=>`<button class="${j?"":"on"}" data-k="${k}">${t(names[k])}</button>`).join("")}</div><div id="tb"></div>
  <p>${nx?`<a class="btn" href="#/lesson/${nx.id}">${t("next")}</a>`:""}</p>`;
  const show=k=>{$("#tb").innerHTML=tabs[k];
    $$("[data-x]").forEach(c=>bindExample(c,l.examples[+c.dataset.x]));
    $$("[data-q]").forEach(c=>{const q=l.quiz[+c.dataset.q];c.onclick=e=>{const b=e.target.closest(".opt");if(!b)return;
      const ok=+b.dataset.o==q.answer;b.classList.add(ok?"ok":"no");$(".fb",c).innerHTML=ok?"✓ "+inl(q.explain):t("tryAgain");if(ok){award(l.id+":q"+c.dataset.q,10);$(".pb i").style.width=pct(l)+"%"}}});
    $$("[data-t]").forEach(h=>editor(l.tasks[+h.dataset.t],h))};
  $(".tabs").onclick=e=>{const b=e.target.closest("button");if(!b)return;$$(".tabs button").forEach(x=>x.classList.toggle("on",x==b));show(b.dataset.k)};
  show("explain")}
function projects(){$("#m").innerHTML=`<h1>${t("projH")}</h1><p><small>${t("projP")}</small></p>${guide("insH",bar(t("insProj")))}`+PR.map((p,k)=>`<div class="card" style="margin:14px 0"><h3 dir="${dirOf(f(p,"title"))}">${P.done[p.id]?"✅ ":""}${esc(f(p,"title"))}</h3><p dir="${dirOf(f(p,"desc"))}">${inl(f(p,"desc"))}</p><b>${t("projGoals")}</b><ul dir="${dirOf(f(p,"goals").join(" "))}">${f(p,"goals").map(g=>`<li>${inl(g)}</li>`).join("")}</ul><div data-p="${k}"></div></div>`).join("");
  $$("[data-p]").forEach(h=>editor(PR[+h.dataset.p],h))}
function progress(){$("#m").innerHTML=`<h1>${t("progH")}</h1>${guide("insH",bar(t("insProg"))+bar(U.xpRules[EN()?1:0]))}<div class="stats"><div class="stat"><b>${total()}%</b><small>${t("sTotal")}</small></div><div class="stat"><b>${P.xp}</b><small>${t("sXP")}</small></div>
  <div class="stat"><b>${PR.filter(p=>P.done[p.id]).length}/${PR.length}</b><small>${t("sProj")}</small></div></div>
  <div class="card">${L.map(l=>`<div class="row"><span dir="${dirOf(f(l,"title"))}">${esc(f(l,"title"))}</span><div class="pb"><i style="width:${pct(l)}%"></i></div><small>${pct(l)}%</small></div>`).join("")}</div>
  <p><button class="btn g" id="rs">${t("resetP")}</button></p>`;
  $("#rs").onclick=function(){if(this.dataset.s){P={xp:0,done:{},draft:{}};save();progress()}else{this.dataset.s=1;this.textContent=t("resetC")}}}

/* ====== الهيكل واللغة ====== */
function chrome(){
  document.documentElement.lang=EN()?"en":"ar";document.documentElement.dir=EN()?"ltr":"rtl";document.title=t("title");
  $("#brand").textContent=t("brand");
  const nv={"":"nHome",lessons:"nLessons",projects:"nProjects",progress:"nProgress"};
  $$("nav a").forEach(a=>a.textContent=t(nv[a.dataset.n]));
  $("#lang").textContent=t("langBtn");$("#devline").textContent=t("dev")}
$("#lang").onclick=()=>{LANG=EN()?"ar":"en";try{localStorage.setItem("wasm.lang",LANG)}catch(e){}chrome();route()};

function route(){const[,p,id]=location.hash.split("/");
  $$("nav a").forEach(a=>a.classList.toggle("on",a.dataset.n==(p=="lesson"?"lessons":p||"")));
  const l=L.find(x=>x.id==id);({lessons,projects,progress}[p]||(p=="lesson"&&l?()=>lesson(l):home))();scrollTo(0,0)}
addEventListener("hashchange",route);$("#xp").textContent=P.xp;chrome();route();
</script>
</body>
</html>
